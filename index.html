let R=null;
const cur=()=>R.tasks[R.i];
function snapshot(){ const o={}; C.WORLDS.forEach(w=>{ const m=C.medalInfo(S,w); o[w]={medal:m.medal,und:m.und}; }); return o; }
function startRound(mode,level,typeIds){
  let tasks;
  if(mode==='und') tasks=C.makeRound(C.undTypesFor(level),10);
  else if(mode==='practice') tasks=C.makeRound(typeIds,10);
  else tasks=C.makeRound(C.typesFor(level),10,C.undTypesFor(level),3);
  startRun({mode,level,ids:typeIds,tasks});
}
function startRun(o){
  R=Object.assign({i:0,score:0,ins:0,streak:0,results:[],newCards:[],done:true,raf:0,before:snapshot(),plBefore:C.playerLevel(S.xp).level},o);
  document.body.classList.toggle('bossmode',R.mode==='boss');
  $('#s-game').style.setProperty('--wc',R.mode==='boss'?'#d4af37':wcol(R.level));
  show('game'); showTask();
}
function taskLimit(t){ return t.time || C.timeFor(t.level,!!t.und); }

function showTask(){
  const t=cur();
  R.part=0; R.partRes=[]; R.hint=false; R.hintPenalty=false; R.done=false;
  $('#s-game').classList.remove('answered'); $('#g-card').classList.remove('ok-fx','no-fx');
  const total=R.tasks.length;
  $('#g-title').innerHTML=`<span class="wdot"></span>${runTitle()}`;
  renderProgress();
  $('#g-score').textContent=R.score; $('#g-ins').textContent=R.ins;
  renderCombo(false);
  $('#g-type').innerHTML=t.und?`<span class="ubadge">✦ ${esc(C.UND[t.und])}</span>`:esc(t.typeName);
  $('#g-diff').innerHTML='Svårighet '+t.diff+' '+[1,2,3].map(i=>`<i class="${i<=t.diff?'on':''}"></i>`).join('');
  $('#g-prompt').innerHTML=`<div>${md(t.prompt)}</div>`;
  $('#g-lines').innerHTML=t.lines?`<ol class="sol">${t.lines.map((l,i)=>`<li class="${i===t.mark?'mark':''}"><span class="rn">Rad ${i+1}</span><span>${md(l)}</span></li>`).join('')}</ol>`:'';
  $('#g-fig').innerHTML=t.fig;
  $('#g-feedback').innerHTML='';
  $('#g-parts').innerHTML='';
  renderHintButton();
  renderPart();
  startTimer(taskLimit(t));
}
function renderProgress(){
  const total=R.tasks.length, el=$('#g-prog');
  el.classList.toggle('hidden',total<=1);
  el.setAttribute('aria-label',`Uppgift ${R.i+1} av ${total}`);
  el.innerHTML=R.tasks.map((_,i)=>`<i class="${i<R.results.length?(R.results[i].ok?'ok':'no'):i===R.i?'now':''}"></i>`).join('');
}
function renderCombo(pop){
  const el=$('#g-streak');
  el.innerHTML=`🔥 <b>${R.streak}</b>`;
  el.classList.toggle('zero',R.streak===0); el.classList.toggle('hot',R.streak>=3);
  if(pop){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function runTitle(){ return R.mode==='practice'?'Träna fel':R.mode==='und'?'Förståelse':R.level<=10?'Nivå '+R.level:esc(C.levelInfo(R.level).name); }

/* ----- Ledtråd ----- */
function renderHintButton(){
  const t=cur(), box=$('#g-hint');
  if(t.und || R.mode==='boss' || !t.steps.length){ box.innerHTML=''; return; }
  box.innerHTML=`<div style="margin-top:12px"><button class="hintbtn" id="b-hint">💡 Ledtråd · ${S.insights>=1?'1 ✦':'halva XP'}</button></div>`;
  $('#b-hint').onclick=()=>{
    if(R.done||R.hint) return;
    R.hint=true;
    if(S.insights>=1){ S.insights--; S.hintsUsed++; } else R.hintPenalty=true;
    save();
    box.innerHTML=`<div class="hintbox">${md(t.steps[0])}</div>`;
  };
}

/* ----- Delar ----- */
function renderPart(){
  const t=cur(), p=t.parts[R.part];
  const wrap=document.createElement('div'); wrap.className='part';
  wrap.innerHTML=(p.prompt?`<div class="pprompt">${md(p.prompt)}</div>`:'')+(p.fig||'')+'<div class="pans"></div><div class="pv"></div>';
  $('#g-parts').appendChild(wrap);
  renderAnswer(wrap.querySelector('.pans'),p);
  if(R.part>0) setTimeout(()=>wrap.scrollIntoView({behavior:'smooth',block:'center'}),50);
}
function hintFor(p){ return p.answer.hint || (p.answer.values.length>1?'Två svar: skriv dem med ; emellan, t.ex. 2; -3':'Bråk: 1/2 · decimal: 0,5'); }
function renderAnswer(box,p){
  const A=p.answer;
  if(A.kind==='mc'){
    const pics=A.options.some(o=>o.h&&o.h.startsWith('<svg')), tabs=A.options.some(o=>o.h&&o.h.startsWith('<table'));
    if(A.lines) box.innerHTML='<div class="opts">'+A.options.map((o,i)=>`<button class="opt line" data-i="${i}"><span class="rn">Rad ${i+1}</span><span>${md(o.t)}</span></button>`).join('')+'</div>';
    else box.innerHTML=`<div class="opts${pics?' pics':''}${tabs?' tabs':''}">`+A.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-label="Alternativ ${i+1}">${o.h?o.h:md(o.t)}</button>`).join('')+'</div>';
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>submitPart(+b.dataset.i));
  } else if(A.kind==='order'){
    renderOrder(box,p);
  } else {
    box.innerHTML=`<input class="display" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ditt svar" aria-label="Ditt svar">
      <div class="hint">${esc(hintFor(p))}</div>
      <div class="keys">
        ${['7','8','9','⌫','4','5','6','/','1','2','3','−','0',',',';','OK'].map(k=>{
          if(k==='OK') return '<button class="k-ok" data-k="ok">Svara</button>';
          if(k===';') return '<button class="k-sep" data-k=";">;<small>nästa svar</small></button>';
          return `<button data-k="${k}" aria-label="${k==='⌫'?'Radera':k}">${k}</button>`;
        }).join('')}
      </div>`;
    const inp=box.querySelector('.display'), h=box.querySelector('.hint');
    const clear=()=>{ if(h.classList.contains('err')){ h.classList.remove('err'); h.textContent=hintFor(p); } };
    box.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='ok') return submitPart(inp.value);
      if(k==='⌫') inp.value=inp.value.slice(0,-1);
      else if(k==='−') inp.value+='-';
      else if(k===';') inp.value+='; ';
      else inp.value+=k;
      clear();
    });
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); submitPart(inp.value); } };
    inp.oninput=clear;
    if(!matchMedia('(pointer: coarse)').matches) inp.focus({preventScroll:true});
  }
}

/* ----- Ordna stegen: dra i greppet eller använd pilarna ----- */
function renderOrder(box,p){
  const A=p.answer; let ord=A.start.slice();
  box.innerHTML='<ol class="order"></ol><button class="btn primary">Svara</button>';
  const ol=box.querySelector('.order');
  const draw=()=>{
    ol.innerHTML=ord.map((id,pos)=>`<li class="oitem" data-id="${id}"><span class="grip" aria-hidden="true">⋮⋮</span><span class="otext">${md(A.items[id])}</span>
      <span class="omove"><button data-up="${pos}" aria-label="Flytta upp" ${pos===0?'disabled':''}>↑</button><button data-down="${pos}" aria-label="Flytta ned" ${pos===ord.length-1?'disabled':''}>↓</button></span></li>`).join('');
    ol.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [ord[i-1],ord[i]]=[ord[i],ord[i-1]]; draw(); });
    ol.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.down; [ord[i+1],ord[i]]=[ord[i],ord[i+1]]; draw(); });
  };
  draw();
  ol.addEventListener('pointerdown',e=>{
    const grip=e.target.closest('.grip'); if(!grip||R.done) return;
    const li=grip.closest('.oitem'); e.preventDefault();
    li.classList.add('drag'); try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    const move=ev=>{
      // Flytta de andra raderna, aldrig den dragna: då behåller den greppet om fingret.
      const y=ev.clientY, kids=[...ol.children], i=kids.indexOf(li);
      for(const other of kids.slice(0,i).reverse()){ const r=other.getBoundingClientRect(); if(y<r.top+r.height/2) ol.insertBefore(other,li.nextSibling); else break; }
      for(const other of kids.slice(i+1)){ const r=other.getBoundingClientRect(); if(y>r.top+r.height/2) ol.insertBefore(other,li); else break; }
    };
    const up=()=>{ li.classList.remove('drag'); grip.removeEventListener('pointermove',move); grip.removeEventListener('pointerup',up); grip.removeEventListener('pointercancel',up);
      ord=[...ol.children].map(x=>+x.dataset.id); draw(); };
    grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up); grip.addEventListener('pointercancel',up);
  });
  box.querySelector('.btn').onclick=()=>submitPart(ord.slice());
}

function submitPart(input){
  if(!R||R.done) return;
  const t=cur(), p=t.parts[R.part], res=C.check(p,input);
  const box=$('#g-parts').lastElementChild;
  if(!res.valid){
    const inp=box.querySelector('.display'), h=box.querySelector('.hint');
    if(inp){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); }
    if(h){ h.classList.add('err'); h.textContent='Det gick inte att läsa svaret. Skriv ett tal, t.ex. -3, 1/2 eller 0,5.'; }
    return;
  }
  R.partRes[R.part]={res,input};
  lockPart(box,p,input,res);
  if(t.parts.length>1) partVerdict(box,p,res);
  if(R.part<t.parts.length-1){ R.part++; renderPart(); }
  else finishTask(false);
}
function lockPart(box,p,input,res){
  const A=p.answer;
  if(A.kind==='mc'){
    box.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(A.options[i].ok) b.classList.add('right'); else if(i===input) b.classList.add('wrong'); });
  } else if(A.kind==='order'){
    const ord=Array.isArray(input)?input:A.start;
    box.querySelectorAll('.oitem').forEach((li,pos)=>{ li.classList.add(ord[pos]===pos?'right':'wrong'); li.querySelector('.omove').remove(); });
    const btn=box.querySelector('.btn'); if(btn) btn.remove();
    if(!res||!res.correct) box.insertAdjacentHTML('beforeend',`<div class="pprompt" style="margin-top:10px">Rätt ordning:</div><ol class="correctorder">${A.items.map(x=>`<li>${md(x)}</li>`).join('')}</ol>`);
  } else {
    const keys=box.querySelector('.keys'); if(keys) keys.remove();
    const h=box.querySelector('.hint'); if(h) h.remove();
    const inp=box.querySelector('.display'); if(inp){ inp.readOnly=true; inp.style.borderColor=res&&res.correct?'var(--good)':'var(--bad)'; if(!inp.value) inp.value='–'; }
  }
}
function facitOf(p){ const A=p.answer; return A.kind==='mc'?(A.options.find(o=>o.ok).h?'alternativet markerat i grönt':A.options.find(o=>o.ok).t):A.kind==='num'?'$'+A.tex+'$':'se ordningen ovan'; }
function partVerdict(box,p,res){
  const v=box.querySelector('.pv');
  if(p.role==='predict') v.innerHTML=`<div class="pverdict ${res&&res.correct?'ok':'no'}">${res&&res.correct?'✓ Rätt förutsägelse! +2 ✦':'✗ Förutsägelsen missade'}${res&&!res.correct&&res.msg?`<span class="pmsg">${md(res.msg)}</span>`:''}</div>`;
  else if(res&&res.correct) v.innerHTML='<div class="pverdict ok">✓ Rätt</div>';
  else v.innerHTML=`<div class="pverdict no">✗ ${res?'Fel':'Hann inte'}. Rätt svar: ${md(facitOf(p))}${res&&res.msg?`<span class="pmsg">${md(res.msg)}</span>`:''}</div>`;
}

/* ----- Timer ----- */
function startTimer(limit){
  cancelAnimationFrame(R.raf);
  R.limit=limit; R.t0=performance.now();
  const bar=$('#g-timer'), fill=bar.firstElementChild, txt=$('#g-timetext');
  const tick=()=>{
    if(R.done) return;
    const left=Math.max(0,limit-(performance.now()-R.t0)/1000), f=left/limit;
    fill.style.width=(100*f)+'%';
    // grön → gul → röd när tiden rinner ut
    bar.style.setProperty('--tc', f>=0.6 ? 'var(--good)' : f>=0.3 ? `color-mix(in srgb,var(--good) ${Math.round((f-0.3)/0.3*100)}%,var(--warn))`
      : `color-mix(in srgb,var(--warn) ${Math.round(f/0.3*100)}%,var(--bad))`);
    bar.classList.toggle('low',f<0.25); txt.classList.toggle('low',f<0.25);
    txt.textContent=(left>=60?Math.floor(left/60)+' min '+Math.ceil(left%60):Math.ceil(left))+' s';
    if(left<=0){ finishTask(true); return; }
    R.raf=requestAnimationFrame(tick);
  };
  tick();
}

/* ----- Uppgiften klar ----- */
function finishTask(timedOut){
  R.done=true; cancelAnimationFrame(R.raf);
  $('#s-game').classList.add('answered');
  const t=cur(), used=Math.min(R.limit,(performance.now()-R.t0)/1000);
  // olåsta delar räknas som fel
  const boxes=[...$('#g-parts').children];
  t.parts.forEach((p,i)=>{ if(!R.partRes[i]){ if(boxes[i]){ lockPart(boxes[i],p,null,null); if(t.parts.length>1) partVerdict(boxes[i],p,null); } } });
  const mains=t.parts.map((p,i)=>({p,r:R.partRes[i]})).filter(x=>x.p.role!=='predict');
  const ok=!timedOut && mains.every(x=>x.r&&x.r.res.correct);
  const pi=t.parts.findIndex(p=>p.role==='predict'), predOk=pi>=0 && R.partRes[pi] && R.partRes[pi].res.correct;

  let pts=0;
  if(ok){
    pts = t.und ? 60 : 50+Math.round(100*(1-used/R.limit));
    pts += Math.min(50,10*R.streak);
    if(R.hintPenalty) pts=Math.round(pts/2);
    R.streak++;
  } else R.streak=0;
  let ins=0;
  if(t.und && ok) ins+=t.diff;
  if(predOk) ins+=2;
  let newCard=null;
  if(t.und && ok){
    const u=S.und[t.level]||(S.und[t.level]={n:0,kinds:{}}); u.n++; u.kinds[t.und]=true;
    if(t.card && !S.cards[t.card]){ S.cards[t.card]=Date.now(); newCard=C.CARDS.find(c=>c.id===t.card); R.newCards.push(t.card); }
  }
  R.score+=pts; R.ins+=ins;
  S.xp+=pts; S.insights+=ins; S.insightsEarned+=ins;
  R.results.push({type:t.type,name:t.typeName,und:t.und,ok,time:used,timedOut});
  S.answered++; if(ok) S.correct++; S.totalTime+=used;
  S.bestStreak=Math.max(S.bestStreak,R.streak);
  const ts=S.types[t.type]||(S.types[t.type]={n:0,c:0,time:0}); ts.n++; if(ok) ts.c++; ts.time+=used;
  save();

  $('#g-score').textContent=R.score; $('#g-ins').textContent=R.ins;
  renderCombo(ok); renderProgress();
  $('#g-timer').firstElementChild.style.width=(100*Math.max(0,1-used/R.limit))+'%';
  $('#g-timer').classList.remove('low'); $('#g-timetext').classList.remove('low');
  const card=$('#g-card'); card.classList.remove('ok-fx','no-fx'); void card.offsetWidth; card.classList.add(ok?'ok-fx':'no-fx');
  if(ok && pts){ const f=document.createElement('span'); f.className='xpfloat'; f.textContent='+'+pts; $('#g-score').appendChild(f); setTimeout(()=>f.remove(),1200); }
  const hb=$('#b-hint'); if(hb) hb.disabled=true;

  const single=t.parts.length===1, p0=t.parts[0], r0=R.partRes[0];
  const head = timedOut ? '<div class="verdict time"><span><span class="vi">⏰</span>Tiden tog slut</span></div>'
            : ok ? `<div class="verdict ok"><span><span class="vi">✓</span>${R.streak>=3?'Grymt, '+R.streak+' i rad!':'Rätt!'}</span><span class="pts">+${pts} XP</span></div>`
                 : '<div class="verdict no"><span><span class="vi">✗</span>Inte riktigt</span></div>';
  const last=t.steps.length-1;
  const tip = single && !ok && r0 && r0.res.msg ? `<div class="tip">${md(r0.res.msg)}</div>` : '';
  const facit = single && !ok && p0.answer.kind!=='order' ? `<div class="facit">Rätt svar: ${md(facitOf(p0))}</div>` : '';
  const fb=$('#g-feedback');
  fb.innerHTML=`<div class="feedback ${timedOut?'time':ok?'ok':'no'}">
      ${head}${facit}${tip}
      ${ins?`<div class="insgain">+${ins} ✦ Insikter${predOk&&ins>2?' (varav 2 för rätt förutsägelse)':''}</div>`:''}
      ${newCard?`<div class="newcard"><div class="lbl">Nytt Kodex-kort!</div>${cardHTML(newCard,true,{reveal:true})}</div>`:''}
      <div class="stepshead">${ok?'Så här kan man tänka':'Så här löser du den'}</div>
      <ol class="steps">${t.steps.map((s,i)=>`<li class="${i===last&&/^Kontroll/.test(s)?'check':''}">${md(s)}</li>`).join('')}</ol>
    </div>
    <button class="btn primary sticky" id="b-next">${nextLabel()}</button>`;
  bindCards(fb);
  const nb=$('#b-next'); nb.onclick=next;
  setTimeout(()=>{ fb.scrollIntoView({behavior:'smooth',block:'start'}); nb.focus({preventScroll:true}); },60);
}
function nextLabel(){ return R.i<R.tasks.length-1?'Nästa':R.mode==='boss'?'Se hur det gick':'Se resultatet'; }
function next(){ if(R.i<R.tasks.length-1){ R.i++; showTask(); window.scrollTo(0,0); } else endRound(); }
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && R && R.done && $('#b-next') && !$('#s-game').classList.contains('hidden') && document.activeElement && !document.activeElement.classList.contains('display')){ e.preventDefault(); next(); } });

/* ---------- Slutskärm ---------- */
function endRound(){
  if(R.mode==='boss') return endBoss();
  const n=R.results.length, right=R.results.filter(r=>r.ok).length;
  const avg=R.results.reduce((s,r)=>s+r.time,0)/n;
  const missed={}; R.results.filter(r=>!r.ok).forEach(r=>{ missed[r.type]=missed[r.type]||{name:r.name,und:r.und,n:0}; missed[r.type].n++; });
  const stars=C.starsFor(right), counts=R.mode==='level';
  let banner='', downTo=0, leveled=false;
  S.history.push({level:R.level,correct:right,score:R.score,practice:!counts,date:Date.now()});
  if(S.history.length>80) S.history=S.history.slice(-80);
  S.rounds++;
  if(counts){
    S.best[R.level]=Math.max(S.best[R.level]||0,R.score);
    const st=S.stars[R.level]||(S.stars[R.level]={best:0,n3:0,n:0}); st.best=Math.max(st.best,stars); if(stars===3) st.n3++; st.n++;
    if(right>=8 && R.level<=10){
      S.passed[R.level]=true;
      if(R.level>=S.level && R.level<10){ S.level=R.level+1; leveled=true; }
      banner = leveled ? `<div class="banner up">Nivå upp! Du är nu på ${esc(worldName(S.level))}.</div>`
             : R.level===10 ? '<div class="banner up">Starkt jobbat på provnivån!</div>'
             : '<div class="banner up">Godkänt! Minst 8 rätt.</div>';
    }
    if(R.level<=10){
      if(right<5){ if(S.low.level===R.level) S.low.count++; else S.low={level:R.level,count:1}; }
      else S.low={level:0,count:0};
      if(S.low.count>=2 && R.level>1){ downTo=R.level-1; banner+=`<div class="banner down">Två rundor i rad med under 5 rätt. Det kan hjälpa att köra nivå ${downTo} en stund först.</div>`; }
    }
  }
  if((counts||R.mode==='und') && right>=6) S.worldLast[R.level]=Date.now();
  // medaljer och stämplar som ändrats
  const after=snapshot();
  C.WORLDS.forEach(w=>{
    if(after[w].medal>R.before[w].medal) banner+=`<div class="banner up">${MEDAL_ICON[after[w].medal]} Värld ${w} har nått ${C.MEDALS[after[w].medal]}!</div>`;
    if(after[w].und && !R.before[w].und) banner+=`<div class="banner up"><span class="stamp">Förstådd</span> Värld ${w} är förstådd. Nu kan den nå Guld.</div>`;
  });
  save();

  const missedIds=Object.keys(missed);
  const newCards=R.newCards.map(id=>C.CARDS.find(c=>c.id===id));
  $('#e-title').textContent=R.mode==='practice'?'Träningsrundan klar':R.mode==='und'?'Förståelserundan klar':`${runTitle()} klar`;
  $('#endbody').innerHTML=`
    ${counts?`<div class="bigstars" aria-label="${stars} stjärnor">${[0,1,2].map(i=>`<i>${i<stars?'★':'☆'}</i>`).join('')}</div>`:''}
    ${banner}
    <div class="tiles">
      <div class="tile"><span>XP</span><b>${R.score}</b></div>
      <div class="tile"><span>Rätt</span><b>${right} av ${n}</b></div>
      <div class="tile"><span>Insikter</span><b style="color:var(--ins)">✦ ${R.ins}</b></div>
      <div class="tile"><span>Snittid</span><b>${fmt1(avg)} s</b></div>
    </div>
    ${newCards.length?`<div class="card"><b>Nya Kodex-kort</b><div class="kgrid">${newCards.map(c=>cardHTML(c,true,{reveal:true})).join('')}</div></div>`:''}
    <div class="card"><b>Dina svar</b>
      <div class="dots">${R.results.map(r=>`<i class="${r.ok?'ok':''}" title="${esc(r.name)}"></i>`).join('')}</div>
      ${missedIds.length?`<p style="margin:12px 0 4px"><b>Det här missade du:</b></p><ul class="list">${missedIds.map(id=>`<li><span>${missed[id].und?'✦ ':''}${esc(missed[id].name)}</span><span class="muted">${missed[id].n} st</span></li>`).join('')}</ul>`
        :'<p style="margin:12px 0 0">Alla rätt. Snyggt!</p>'}
    </div>
    ${missedIds.length?'<button class="btn primary" id="e-practice">Träna på mina fel</button>':''}
    ${leveled?`<button class="btn ${missedIds.length?'':'primary'}" id="e-next">Fortsätt till nivå ${S.level}</button>`:''}
    ${downTo?`<button class="btn" id="e-down">Gå ned till nivå ${downTo}</button>`:''}
    <button class="btn" id="e-again">${R.mode==='practice'?'Träna samma fel igen':R.mode==='und'?'En förståelserunda till':'Spela '+runTitle().toLowerCase()+' igen'}</button>
    <button class="btn ghost" id="e-home">Till startsidan</button>`;
  bindCards($('#endbody'));
  const ids=R.ids, mode=R.mode, level=R.level;
  if(missedIds.length) $('#e-practice').onclick=()=>startRound('practice',level,missedIds);
  if(leveled) $('#e-next').onclick=()=>startRound('level',S.level);
  if(downTo) $('#e-down').onclick=()=>{ S.level=downTo; S.low={level:0,count:0}; save(); startRound('level',downTo); };
  $('#e-again').onclick=()=>startRound(mode,level,ids);
  $('#e-home').onclick=()=>show('home');
  document.body.classList.remove('bossmode');
  show('end');
  const plAfter=C.playerLevel(S.xp).level;
  if(leveled) celebrate({n:S.level,color:wcol(S.level),kicker:'Nivå upp',title:esc(C.levelInfo(S.level).name),
    text:`Värld ${S.level} är upplåst.${plAfter>R.plBefore?` Du nådde också spelarnivå ${plAfter}!`:''}`});
  else if(plAfter>R.plBefore) celebrate({n:plAfter,color:'var(--accent)',kicker:'Ny spelarnivå',title:`Spelarnivå ${plAfter}`,
    text:`Nästa nivå når du vid ${C.playerLevel(S.xp).to} XP.`});
}

/* ---------- Nivå upp-animationen ---------- */
function celebrate(o){
  const el=document.createElement('div'); el.className='lvup'; el.style.setProperty('--lc',o.color);
  el.setAttribute('role','dialog'); el.setAttribute('aria-label',o.kicker);
  const cols=['#ffcf4a','#35d07f','#4f8bff','#ff5c7a','#b65cff','#4fe3d0'];
  const conf=Array.from({length:36},(_,i)=>{ const a=i/36*Math.PI*2+Math.random()*.3, r=130+Math.random()*150;

/* =====================================================================
   KONTO OCH MOLNSPARNING (Supabase)
   Utan url och nyckel här under är kontot avstängt, och allt sparas bara
   lokalt i webbläsaren som förut. Uppsättningen beskrivs i KONTO.md.
   Nyckeln är den publika "anon"-nyckeln. Den får ligga i koden eftersom
   databasen bara släpper fram varje användares egna rader (RLS).
   ===================================================================== */
const CLOUD={url:'', anonKey:''};
const CLOUD_ON=!!(CLOUD.url && CLOUD.anonKey);
const SB_SRC='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
const SYNCKEY='snabbmatte-sync', SKIPKEY='snabbmatte-utan-konto';
const USER_RE=/^[A-Za-z0-9ÅÄÖåäö_.-]{3,20}$/, MAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let sb=null, sbReady=null;
const A={user:null, username:'', view:'welcome', err:'', ok:'', busy:false, status:'ok', f:{}, free:null, cooldownUntil:0, pending:null, forceOut:false};
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} };
// Synkläget: vem de lokala framstegen tillhör, när de sparades och om molnet ligger efter.
function syncMeta(){ try{ return JSON.parse(lsGet(SYNCKEY))||{}; }catch(e){ return {}; } }
function setSyncMeta(m){ lsSet(SYNCKEY,JSON.stringify(m)); }

function loadSB(){
  if(!sbReady) sbReady=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=SB_SRC;
    s.onload=()=>{ try{ sb=window.supabase.createClient(CLOUD.url,CLOUD.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}); res(sb); }catch(e){ rej(e); } };
    s.onerror=()=>{ sbReady=null; s.remove(); rej(new Error('offline')); };
    document.head.appendChild(s);
  });
  return sbReady;
}
function errText(e){
  const c=String((e&&(e.code||e.error_code))||''), m=String(e&&e.message||'').toLowerCase();
  if(c==='invalid_credentials'||m.includes('invalid login')) return 'Fel e-post eller lösenord.';
  if(c==='email_not_confirmed'||m.includes('not confirmed')) return 'E-postadressen är inte verifierad än.';
  if(c==='user_already_exists'||c==='email_exists'||m.includes('already registered')) return 'Det finns redan ett konto med den e-postadressen. Logga in i stället.';
  if(c==='weak_password'||m.includes('password should')) return 'Lösenordet är för svagt. Välj minst 8 tecken.';
  if(c==='same_password') return 'Välj ett annat lösenord än det gamla.';
  if(c==='otp_expired'||m.includes('expired')||(m.includes('invalid')&&m.includes('otp'))) return 'Koden stämmer inte eller har gått ut. Skicka en ny kod.';
  if(c.includes('rate_limit')||m.includes('rate limit')||(e&&e.status===429)) return 'För många försök på kort tid. Vänta en minut och försök igen.';
  if(m.includes('database error saving new user')) return 'Användarnamnet är redan taget. Välj ett annat.';
  if(m==='offline'||m.includes('fetch')||m.includes('network')) return 'Ingen kontakt med servern. Kolla din internetanslutning.';
  return 'Något gick fel: '+(e&&e.message||'okänt fel');
}
const must=r=>{ if(r && r.error) throw r.error; return r ? r.data : null; };

/* ----- Sparning till molnet ----- */
let pushT=0;
onSaved=()=>{
  const m=syncMeta(); m.savedAt=Date.now();
  if(A.user){ m.dirty=true; m.owner=A.user.id; }
  setSyncMeta(m);
  if(A.user){ setStatus('pending'); clearTimeout(pushT); pushT=setTimeout(pushNow,1500); }
};
async function pushNow(){
  clearTimeout(pushT);
  if(!A.user||!sb) return false;
  const m=syncMeta(); if(!m.dirty){ setStatus('ok'); return true; }
  const at=m.savedAt||Date.now();
  let data; try{ data=JSON.parse(lsGet(STORE)); }catch(e){}
  if(!data) return false;
  setStatus('saving');
  let error; try{ ({error}=await sb.from('progress').upsert({user_id:A.user.id,data,updated_at:new Date(at).toISOString()})); }catch(e){ error=e; }
  if(error){ setStatus('offline'); return false; }
  const m2=syncMeta(); m2.owner=A.user.id; if(m2.savedAt===at) m2.dirty=false; setSyncMeta(m2);
  if(m2.dirty){ setStatus('pending'); pushT=setTimeout(pushNow,1500); } else setStatus('ok');
  return true;
}
// Jämför den här enhetens framsteg med molnets och välj de senaste.
async function reconcile(){
  if(!A.user||!sb) return;
  if(!$('#s-game').classList.contains('hidden')) return;   // aldrig mitt i en runda
  let r; try{ r=await sb.from('progress').select('data,updated_at').eq('user_id',A.user.id).maybeSingle(); }catch(e){ r={error:e}; }
  if(r.error){ setStatus('offline'); return; }
  const m=syncMeta(), remote=r.data;
  if(!remote){ m.owner=A.user.id; m.dirty=true; m.savedAt=m.savedAt||Date.now(); setSyncMeta(m); await pushNow(); return; }
  const rt=Date.parse(remote.updated_at)||0;
  if(m.owner===A.user.id){
    if(rt>(m.savedAt||0) && !m.dirty) applyRemote(remote.data,rt);   // spelat på en annan enhet sedan sist
    else if(m.dirty) await pushNow();
    else setStatus('ok');
    return;
  }
  const local=load(STORE);
  if(!local.answered && !local.xp){ applyRemote(remote.data,rt); return; }
  A.pending={remote:C.migrate(remote.data),rt}; A.view='choose'; show('account');   // båda har framsteg: låt spelaren välja
}
function applyRemote(data,rt){
  const st=C.migrate(data);
  lsSet(STORE,JSON.stringify(st)); setSyncMeta({owner:A.user.id,savedAt:rt,dirty:false});
  if(!TEST){ S=st; applySkin(); }
  setStatus('ok');
  const cur=SCREENS.find(n=>!$('#s-'+n).classList.contains('hidden'));
  if(!TEST && ['home','worlds','kodex','shop','stats'].includes(cur)) show(cur);
}
function setStatus(st){
  A.status=st; renderAccountBtn();
  const l=$('#syncline'); if(l) l.outerHTML=syncLine();
}
const SYNC_TXT={ok:'Sparat i molnet',pending:'Sparar snart…',saving:'Sparar…',offline:'Offline. Sparas när du är online igen.'};
const syncLine=()=>`<div class="syncline" id="syncline"><i class="${A.status}"></i>${SYNC_TXT[A.status]||''}</div>`;

/* ----- Inloggning ----- */
async function afterLogin(user){
  A.user=user; A.username=(user.user_metadata&&user.user_metadata.username)||'';
  lsSet(SKIPKEY,null);
  try{ const p=await sb.from('profiles').select('username').eq('id',user.id).maybeSingle(); if(p.data&&p.data.username) A.username=p.data.username; }catch(e){}
  renderAccountBtn();
  A.view='profile';
  await reconcile();
}
async function finishLogin(user){
  await afterLogin(user);
  A.f={}; A.err=''; A.ok='';
  if(A.view!=='choose'){ show('home'); toast(`Inloggad som ${A.username||user.email}`); }
}
async function cloudInit(){
  if(!CLOUD_ON) return;
  let hasToken=false; try{ hasToken=Object.keys(localStorage).some(k=>/^sb-.*-auth-token$/.test(k)); }catch(e){}
  renderAccountBtn();
  if(!hasToken && !lsGet(SKIPKEY)){ A.view='welcome'; show('account'); }
  try{ await loadSB(); }catch(e){ setStatus('offline'); return; }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT' && A.user){ A.user=null; A.username=''; renderAccountBtn(); } });
  try{ const {data}=await sb.auth.getSession(); if(data&&data.session) await afterLogin(data.session.user); }catch(e){ setStatus('offline'); }
}
document.addEventListener('visibilitychange',()=>{ if(!A.user) return; if(document.hidden) pushNow(); else reconcile(); });
window.addEventListener('online',()=>{ if(A.user) pushNow(); });

async function logout(){
  if(!(await pushNow()) && syncMeta().dirty && !A.forceOut){
    A.forceOut=true; A.err='De senaste framstegen kunde inte sparas i molnet. Tryck på Logga ut igen för att logga ut ändå, men då försvinner det som inte hunnit sparas.';
    renderAccount(); return;
  }
  try{ await sb.auth.signOut(); }catch(e){}
  A.user=null; A.username=''; A.forceOut=false; A.err='';
  lsSet(STORE,null); setSyncMeta({}); S=C.migrate(null); save();   // nästa person på enheten börjar från noll
  applySkin(); renderAccountBtn(); A.view='welcome'; show('account');
}

/* ----- Kontoskärmen ----- */
function renderAccountBtn(){
  const b=$('#b-account'); if(!b) return;
  b.classList.toggle('hidden',!CLOUD_ON);
  b.classList.toggle('in',!!A.user);
  b.innerHTML=A.user ? `${esc((A.username||'?')[0].toUpperCase())}<span class="sd ${A.status}"></span>` : svgI('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>');
}
$('#b-account').onclick=()=>{ A.view=A.user?'profile':'welcome'; A.err=''; A.ok=''; show('account'); };
function go(view){ A.view=view; A.err=''; A.ok=''; A.forceOut=false; renderAccount(); window.scrollTo(0,0); }
async function run(fn){
  if(A.busy) return; A.busy=true; A.err=''; A.ok=''; renderAccount();
  try{ await loadSB(); await fn(); }catch(e){ A.err=errText(e); }
  A.busy=false; if(!$('#s-account').classList.contains('hidden')) renderAccount();
}
const field=(name,label,type,auto,extra='')=>`<label class="field"><span>${label}</span>${type==='password'
  ?`<span class="pw"><input name="${name}" type="password" autocomplete="${auto}" value="${esc(A.f[name]||'')}" ${extra}><button type="button" data-show>Visa</button></span>`
  :`<input name="${name}" type="${type}" autocomplete="${auto}" value="${esc(A.f[name]||'')}" ${extra}>`}${name==='username'?'<small id="u-help">3–20 tecken: bokstäver, siffror, _ . -</small>':''}</label>`;
const msgs=()=>(A.err?`<div class="formerr" role="alert">${esc(A.err)}</div>`:'')+(A.ok?`<div class="formok">${esc(A.ok)}</div>`:'');
const submit=(label)=>`<button class="btn primary${A.busy?' busy':''}" type="submit">${A.busy?'Vänta…':label}</button>`;
const accHero=(title,text)=>`<div class="acc-hero">${$('.hero .logo').outerHTML.replace(/lg-logo/g,'lg-logo-acc')}<h2>${title}</h2>${text?`<p>${text}</p>`:''}</div>`;
const summary=st=>{ const pl=C.playerLevel(st.xp); return `Spelarnivå ${pl.level} · ${st.xp} XP · ${esc(worldName(st.level))}`; };

function renderAccount(){
  const v=A.view, box=$('#accountbody'); let h='';
  if(!CLOUD_ON){ box.innerHTML=accHero('Konto','Kontot är inte aktiverat i den här versionen av appen. Dina framsteg sparas på den här enheten.')+'<button class="btn ghost" data-acc-home>Tillbaka</button>'; bindAcc(); return; }
  if(v==='welcome') h=accHero('Spara dina framsteg','Med ett konto sparas allt du klarar i molnet, så att du kan fortsätta på vilken mobil eller dator som helst.')+msgs()+`
    <button class="btn primary" data-go-acc="signup">Skapa konto</button>
    <button class="btn" data-go-acc="login">Jag har redan ett konto</button>
    <button class="linkbtn" data-skip>Fortsätt utan konto</button>
    <p class="muted small" style="text-align:center;margin:0">Utan konto sparas framstegen bara på den här enheten.</p>`;
  else if(v==='signup') h=accHero('Skapa konto','')+msgs()+`<form data-form="signup" novalidate>
    ${field('username','Användarnamn','text','username','maxlength="20" autocapitalize="off" spellcheck="false"')}
    ${field('email','E-post','email','email','inputmode="email" autocapitalize="off"')}
    ${field('password','Lösenord (minst 8 tecken)','password','new-password')}
    ${submit('Skapa konto')}</form>
    <button class="linkbtn" data-go-acc="login">Har du redan ett konto? Logga in</button>
    <button class="btn ghost" data-go-acc="welcome">Tillbaka</button>`;
  else if(v==='verify') h=accHero('Kolla din mejl',`Vi har skickat en kod till <b>${esc(A.f.email||'')}</b>. Skriv in den här för att verifiera kontot. Hittar du inte mejlet, titta i skräpposten.`)+msgs()+`<form data-form="verify" novalidate>
    <label class="field"><span>Kod</span><input class="codein" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" value="${esc(A.f.code||'')}" placeholder="••••••"></label>
    ${submit('Verifiera')}</form>${resendBtn('resend')}
    <button class="btn ghost" data-go-acc="signup">Fel e-post? Börja om</button>`;
  else if(v==='login') h=accHero('Logga in','')+msgs()+`<form data-form="login" novalidate>
    ${field('email','E-post','email','email','inputmode="email" autocapitalize="off"')}
    ${field('password','Lösenord','password','current-password')}
    ${submit('Logga in')}</form>
    <button class="linkbtn" data-go-acc="forgot">Glömt lösenordet?</button>
    <button class="btn ghost" data-go-acc="welcome">Tillbaka</button>`;
  else if(v==='forgot') h=accHero('Glömt lösenordet','Skriv din e-post så skickar vi en kod som du använder för att välja ett nytt lösenord.')+msgs()+`<form data-form="forgot" novalidate>
    ${field('email','E-post','email','email','inputmode="email" autocapitalize="off"')}
    ${submit('Skicka kod')}</form>
    <button class="btn ghost" data-go-acc="login">Tillbaka</button>`;
  else if(v==='reset') h=accHero('Nytt lösenord',`Skriv koden vi skickade till <b>${esc(A.f.email||'')}</b> och välj ett nytt lösenord.`)+msgs()+`<form data-form="reset" novalidate>
    <label class="field"><span>Kod</span><input class="codein" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" value="${esc(A.f.code||'')}" placeholder="••••••"></label>
    ${field('newpw','Nytt lösenord (minst 8 tecken)','password','new-password')}
    ${submit('Spara nytt lösenord')}</form>${resendBtn('resendReset')}
    <button class="btn ghost" data-go-acc="login">Tillbaka</button>`;
  else if(v==='choose'){ const loc=load(STORE), rem=A.pending.remote;
    h=accHero('Vilka framsteg vill du ha?','Både den här enheten och ditt konto har sparade framsteg. Välj vilka du vill fortsätta med. De andra skrivs över.')+msgs()+`
    <button class="btn choice" data-choose="remote"><b>Kontots framsteg</b><small>${summary(rem)}</small></button>
    <button class="btn choice" data-choose="local"><b>Den här enhetens framsteg</b><small>${summary(loc)}</small></button>`; }
  else if(v==='profile') h=`<h2>Ditt konto</h2><div class="card"><div class="prof"><span class="av">${esc((A.username||'?')[0].toUpperCase())}</span>
      <span style="min-width:0"><b>${esc(A.username)}</b><span class="muted small" style="overflow-wrap:anywhere">${esc(A.user?A.user.email:'')}</span></span></div>${syncLine()}</div>`+msgs()+`
    <button class="btn" data-sync>Spara nu</button>
    <button class="btn ghost" data-logout style="color:var(--bad)">Logga ut</button>
    <button class="btn ghost" data-acc-home>Tillbaka</button>`;
  box.innerHTML=h; bindAcc();
}
let cdTimer=0;
function resendBtn(act){
  const left=Math.ceil((A.cooldownUntil-Date.now())/1000);
  if(left>0 && !cdTimer) cdTimer=setTimeout(()=>{ cdTimer=0; const b=$('[data-resend]'); if(b){ b.outerHTML=resendBtn(act); bindResend(); } },1000);
  return `<button class="linkbtn" data-resend="${act}" ${left>0?'disabled':''}>${left>0?`Skicka ny kod (${left} s)`:'Skicka ny kod'}</button>`;
}
function bindResend(){
  const b=$('[data-resend]'); if(!b) return;
  b.onclick=()=>run(async()=>{
    if(b.dataset.resend==='resend') must(await sb.auth.resend({type:'signup',email:A.f.email}));
    else must(await sb.auth.resetPasswordForEmail(A.f.email));
    A.cooldownUntil=Date.now()+60000; A.ok='En ny kod är skickad.';
  });
}
let uCheck=0;
function bindAcc(){
  const box=$('#accountbody');
  box.querySelectorAll('[data-go-acc]').forEach(b=>b.onclick=()=>go(b.dataset.goAcc));
  box.querySelectorAll('[data-acc-home]').forEach(b=>b.onclick=()=>show('home'));
  const skip=box.querySelector('[data-skip]'); if(skip) skip.onclick=()=>{ lsSet(SKIPKEY,'1'); show('home'); };
  box.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const i=b.previousElementSibling; i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'Visa':'Dölj'; });
  box.querySelectorAll('input[name]').forEach(i=>i.oninput=()=>{ A.f[i.name]=i.value; if(i.name==='username') checkUsername(); });
  const sync=box.querySelector('[data-sync]'); if(sync) sync.onclick=async()=>{ const m=syncMeta(); m.dirty=true; m.savedAt=m.savedAt||Date.now(); setSyncMeta(m); await pushNow(); };
  const lo=box.querySelector('[data-logout]'); if(lo) lo.onclick=()=>run(logout);
  box.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>run(async()=>{
    const p=A.pending; A.pending=null;
    if(b.dataset.choose==='remote') applyRemote(p.remote,p.rt);
    else { setSyncMeta({owner:A.user.id,savedAt:Date.now(),dirty:true}); await pushNow(); }
    A.view='profile'; show('home'); toast(`Inloggad som ${A.username}`);
  }));
  bindResend();
  const form=box.querySelector('form'); if(form) form.onsubmit=e=>{ e.preventDefault(); submitAcc(form.dataset.form); };
  if(A.view==='signup' && A.f.username) checkUsername();
}
function checkUsername(){
  clearTimeout(uCheck);
  const h=$('#u-help'), u=(A.f.username||'').trim(); if(!h) return;
  A.free=null; h.className=''; h.textContent='3–20 tecken: bokstäver, siffror, _ . -';
  if(!u) return;
  if(!USER_RE.test(u)){ h.className='no'; h.textContent=u.length<3?'Minst 3 tecken.':'Bara bokstäver, siffror och _ . - (max 20 tecken).'; return; }
  uCheck=setTimeout(async()=>{
    try{ await loadSB(); const free=must(await sb.rpc('username_available',{name:u}));
      if((A.f.username||'').trim()!==u) return;
      A.free=!!free; const h2=$('#u-help'); if(h2){ h2.className=free?'ok':'no'; h2.textContent=free?'✓ Ledigt':'Upptaget. Välj ett annat.'; } }catch(e){}
  },400);
}
function submitAcc(form){
  const f=A.f, email=(f.email||'').trim().toLowerCase(), bad=t=>{ A.err=t; renderAccount(); };
  if(['signup','login','forgot'].includes(form)){ if(!MAIL_RE.test(email)) return bad('Skriv en giltig e-postadress.'); f.email=email; }
  if(form==='signup'){
    const u=(f.username||'').trim();
    if(!USER_RE.test(u)) return bad('Användarnamnet ska vara 3–20 tecken: bokstäver, siffror, _ . -');
    if((f.password||'').length<8) return bad('Lösenordet måste vara minst 8 tecken.');
    run(async()=>{
      if(!must(await sb.rpc('username_available',{name:u}))) throw new Error('Database error saving new user');
      const d=must(await sb.auth.signUp({email,password:f.password,options:{data:{username:u}}}));
      if(d.user && Array.isArray(d.user.identities) && !d.user.identities.length) throw {code:'user_already_exists'};
      if(d.session) return finishLogin(d.session.user);   // om e-postverifiering är avstängd i Supabase
      f.password=''; A.cooldownUntil=Date.now()+60000; A.view='verify';
    });
  }
  if(form==='verify' || form==='reset'){
    const code=(f.code||'').replace(/\s/g,'');
    if(!/^\d{6,10}$/.test(code)) return bad('Koden består av siffror. Kolla mejlet igen.');
    if(form==='reset' && (f.newpw||'').length<8) return bad('Lösenordet måste vara minst 8 tecken.');
    run(async()=>{
      const d=must(await sb.auth.verifyOtp({email:f.email,token:code,type:form==='verify'?'email':'recovery'}));
      if(form==='reset') must(await sb.auth.updateUser({password:f.newpw}));
      await finishLogin(d.user||(d.session&&d.session.user));
    });
  }
  if(form==='login'){
    if(!f.password) return bad('Skriv ditt lösenord.');
    run(async()=>{
      const r=await sb.auth.signInWithPassword({email,password:f.password});
      if(r.error && errText(r.error).startsWith('E-postadressen är inte')){
        must(await sb.auth.resend({type:'signup',email})); A.cooldownUntil=Date.now()+60000;
        A.view='verify'; A.ok='Kontot är inte verifierat än. Vi har skickat en ny kod.'; return;
      }
      must(r); f.password=''; await finishLogin(r.data.user);
    });
  }
  if(form==='forgot') run(async()=>{ must(await sb.auth.resetPasswordForEmail(email)); A.cooldownUntil=Date.now()+60000; A.view='reset'; });
}

// Intern krok för testsidan och testläget
window.__app={startRun,show,state:()=>S,round:()=>R,save};
applySkin();
show('home');
if(location.hash==='#test') enterTest(); else cloudInit();
})();
</script>
