<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snabbmatte Matte 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23ff4fb8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M12 35l6-3 7 13 13-31h14' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// Mörkt läge är standard. Ljust läge sparas separat från spelets data.
try{ if(localStorage.getItem('snabbmatte-theme')==='light') document.documentElement.dataset.theme='light'; }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
/* Mörkt läge är standard. Ljust läge väljs med knappen på startskärmen (data-theme="light"). */
:root{
  --bg:#0c0f1d; --bg-glow:#1b1745; --card:#161a2e; --raised:#20253f; --ink:#f3f4ff; --muted:#959cbd; --line:#272d4a; --grid:#21263f;
  --accent:#7c5cff; --accent-ink:#ffffff; --accent-soft:#262052;
  --good:#35d07f; --good-soft:#0f3324; --bad:#ff5c7a; --bad-soft:#3a1426; --warn:#ffb547; --warn-soft:#3a2a10;
  --c1:#9b87ff; --c2:#ff9f43;
  --radius:20px; --wc:var(--accent);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.28);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4fb; --bg-glow:#e4ddff; --card:#ffffff; --raised:#eef0fa; --ink:#161935; --muted:#5d6385; --line:#e1e4f2; --grid:#e9ebf5;
  --accent:#6a45ff; --accent-ink:#ffffff; --accent-soft:#ece7ff;
  --good:#13a35a; --good-soft:#dcf7e8; --bad:#e23655; --bad-soft:#ffe3e9; --warn:#c77700; --warn-soft:#fff1d6;
  --c1:#6a45ff; --c2:#e8590c;
  --shadow:0 1px 2px rgba(22,25,53,.06),0 8px 24px rgba(22,25,53,.07);
  color-scheme:light;
}
/* Härledda toner: följer med när ett tema byter --accent */
:root{--accent-deep:color-mix(in srgb,var(--accent) 68%,#000);--accent-2:color-mix(in srgb,var(--accent) 55%,#ff4fb8);
  --good-deep:color-mix(in srgb,var(--good) 65%,#000);--bad-deep:color-mix(in srgb,var(--bad) 65%,#000)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,var(--bg-glow),transparent 60%) no-repeat,var(--bg);color:var(--ink);
  font:600 17px/1.5 var(--font);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.7rem;line-height:1.2;margin:12px 0 4px;font-weight:900}
h2{font-size:1.45rem;margin:8px 0 12px;font-weight:900;letter-spacing:-.01em}
h3{font-weight:800}
b,strong{font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* Knappar med "3D-kant" som trycks ned */
.btn{--b:var(--raised);--bd:color-mix(in srgb,var(--raised) 70%,#000);display:block;width:100%;min-height:58px;border:0;border-radius:16px;padding:14px 18px;margin:0 0 14px;
  font-size:1.08rem;font-weight:800;background:var(--b);color:var(--ink);text-align:center;box-shadow:0 4px 0 var(--bd);transition:transform .08s,box-shadow .08s,filter .15s}
.btn.primary{--b:var(--accent);--bd:var(--accent-deep);color:var(--accent-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent))}
.btn.ghost{--b:transparent;--bd:var(--line);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 0 0 var(--bd)}
.btn:disabled{opacity:.5}
.btn small{display:block;font-weight:600;font-size:.85rem;opacity:.8}
.row{display:flex;gap:10px}.row>*{flex:1}
.hidden{display:none!important}
.big{font-size:2.6rem;font-weight:800;line-height:1.1;font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.5rem;font-family:var(--num);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}

/* ===== Startskärmen ===== */
.hud{position:relative;display:grid;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card) 70%);
  border:1px solid var(--line);border-radius:22px;padding:14px;margin:4px 0 6px;box-shadow:var(--shadow)}
.hud-top{display:flex;align-items:center;gap:12px}
.lvring{--p:0;flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent-2) calc(var(--p)*1%),var(--line) 0);position:relative}
.lvring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.lvring b{position:relative;font:800 1.45rem/1 var(--num)}
.hud-xp{flex:1;min-width:0}
.hud-xp .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.88rem;color:var(--muted)}
.hud-xp .lbl b{color:var(--ink);font-size:1.05rem}
.xpbar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 0}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:9px;position:relative;
  box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
.xpbar>div::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.hud-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.stat .top{display:flex;align-items:center;gap:7px}
.stat .ic{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc)}
.stat .ic svg{width:18px;height:18px}
.stat b{display:block;font:800 1.2rem/1.1 var(--num)}
.stat small{display:block;font-size:.7rem;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.off .ic{filter:grayscale(1);opacity:.55}
.hero{position:relative;text-align:center;padding:18px 0 14px}
.logo{width:84px;height:84px;margin:0 auto 10px;filter:drop-shadow(0 10px 24px color-mix(in srgb,var(--accent) 55%,transparent));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.hero h1{font-size:2.5rem;margin:0;letter-spacing:-.03em;line-height:1;
  background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--accent) 50%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:6px 0 0;font-size:.95rem}
.themebtn{position:absolute;top:10px;right:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.themebtn svg{width:20px;height:20px}
.btn.playbtn{display:flex;align-items:center;gap:14px;text-align:left;min-height:88px;padding:16px 18px;border-radius:22px;font-size:1.45rem;margin:0 0 16px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent) 55%,var(--accent-2));box-shadow:0 6px 0 var(--accent-deep),0 18px 36px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.playbtn:active{transform:translateY(6px);box-shadow:0 0 0 var(--accent-deep)}
.playbtn .pi{flex:0 0 52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.playbtn .pi svg{width:24px;height:24px;margin-left:3px}
.playbtn .pt{flex:1;line-height:1.15}
.playbtn .pt small{margin-top:6px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.2);border-radius:999px;padding:3px 10px 3px 6px;opacity:1}
.playbtn .chev{opacity:.7;font-size:1.6rem}
.wdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--wc);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.btn.act{--tc:var(--accent);display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-height:112px;margin:0;padding:14px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,var(--line))}
.btn.act:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.act .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 80%,#fff),var(--tc));box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 40%,transparent)}
.act .ic svg{width:22px;height:22px}
.act b{display:block;font-size:1.05rem;line-height:1.2}
.act small{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}
.act.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;padding:12px 14px}
.act.wide .ic{width:36px;height:36px;border-radius:11px}
.act.wide .ic svg{width:19px;height:19px}

/* ===== Spelet ===== */
.topbar{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.topbar b{color:var(--ink)}
.wchip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--wc) 22%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,var(--wc) 55%,transparent);
  border-radius:999px;padding:3px 10px 3px 6px;white-space:nowrap;font-weight:800;font-size:.82rem;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.wchip .wdot{flex:0 0 10px;box-shadow:none}
.rprog{flex:1;display:flex;gap:3px;min-width:40px}
.rprog i{flex:1;height:6px;border-radius:4px;background:var(--line);transition:background .3s}
.rprog i.ok{background:var(--good)}.rprog i.no{background:var(--bad)}.rprog i.now{background:var(--wc);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;font-size:.82rem}
.pill b{font-family:var(--num);font-variant-numeric:tabular-nums}
.combo{transition:background .25s,border-color .25s,color .25s}
.combo.zero{opacity:.55}
.combo.hot{background:color-mix(in srgb,#ff7a1a 22%,var(--card));border-color:#ff7a1a;color:#ffb36b}
.combo.hot b{color:#ffd2a6}
.combo.pop{animation:cpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes cpop{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-6deg)}100%{transform:scale(1)}}
.trow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.timer{--tc:var(--good);flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.timer>div{height:100%;width:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));border-radius:99px;
  box-shadow:0 0 14px color-mix(in srgb,var(--tc) 70%,transparent);position:relative}
.timer>div::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.timer.low{animation:tpulse .8s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 30%,transparent)}}
.timetext{flex:0 0 auto;min-width:46px;text-align:right;font:800 .9rem/1 var(--num);font-variant-numeric:tabular-nums;color:var(--muted)}
.timetext.low{color:var(--bad);animation:tick 1s steps(1) infinite}
@keyframes tick{50%{transform:scale(1.15)}}
#g-card{position:relative;overflow:hidden;padding:22px 18px 18px;border-top:0}
#g-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--wc),color-mix(in srgb,var(--wc) 50%,var(--accent-2)))}
#g-card.ok-fx{animation:okfx .7s ease-out}
#g-card.no-fx{animation:nofx .5s ease-out}
@keyframes okfx{0%{box-shadow:inset 0 0 0 3px var(--good),inset 0 0 40px color-mix(in srgb,var(--good) 30%,transparent)}30%{transform:scale(1.012)}
  100%{box-shadow:inset 0 0 0 0 transparent,inset 0 0 0 transparent;transform:none}}
#g-card.no-fx{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 70%,transparent)}
@keyframes nofx{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);margin:0 0 12px;gap:8px;font-weight:800}
.diff{white-space:nowrap}
.diff i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--wc);margin-left:3px}
.diff i.on{background:var(--wc)}
.prompt{font-size:1.55rem;line-height:1.55;font-weight:700}
.mnw{white-space:nowrap}
/* Uppgiften fyller skärmen och knappsatsen hamnar längst ned, nära tummen */
#s-game:not(.hidden){display:flex;flex-direction:column;min-height:calc(100svh - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
#s-game:not(.answered) #g-card{flex:1;display:flex;flex-direction:column;margin-bottom:0}
#s-game:not(.answered) #g-prompt{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding:8px 0 4px}
.prompt .katex{font-size:1.1em}
.prompt code{font-family:var(--num);font-size:.95em}
#g-score{position:relative}
.xpfloat{position:absolute;left:50%;top:140%;font:800 .9rem/1 var(--num);white-space:nowrap;z-index:5;color:#fff;background:var(--good);border-radius:999px;padding:5px 9px;
  pointer-events:none;animation:xpup 1.2s ease-out forwards;box-shadow:0 4px 14px color-mix(in srgb,var(--good) 50%,transparent)}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-16px) scale(1)}}
.fig{display:block;width:100%;height:auto;max-width:400px;margin:12px auto 0}
.fig .ax{stroke:var(--ink);stroke-width:1.5}
.fig .gr{stroke:var(--grid);stroke-width:1}
.fig .tick{fill:var(--muted);font-size:11px;font-family:system-ui,sans-serif}
.fig .hl{stroke:var(--c1);stroke-width:5;stroke-linecap:round}
.fig .cf{fill:none;stroke:var(--c1);stroke-width:3}
.fig .cg{fill:none;stroke:var(--c2);stroke-width:3}
.fig .lf{fill:var(--c1);font-weight:700;font-size:15px;font-style:italic;font-family:Georgia,serif}
.fig .lg{fill:var(--c2);font-weight:700;font-size:15px;font-style:italic;font-family:Georgia,serif}
.fig .dot{fill:var(--c1);stroke:var(--c1);stroke-width:2.5}
.fig .dot.hollow{fill:var(--card)}
.fig .arrow{fill:var(--c1)}
.fig .axarrow{fill:var(--ink)}
.fig .plate{fill:none;stroke:var(--c1);stroke-width:5;stroke-linejoin:round}
.fig .wall{stroke:var(--muted);stroke-width:4}
.fig .hatch{stroke:var(--muted);stroke-width:1.5}
.fig .lbl{fill:var(--ink);font-size:15px;font-family:system-ui,sans-serif}
.fig .lbl i{font-style:italic}

.answerbox{margin-top:14px}
.display{width:100%;font:700 1.45rem/1.2 var(--num);font-variant-numeric:tabular-nums;padding:10px 14px;border-radius:14px;border:2px solid var(--line);
  background:var(--bg);color:var(--ink);min-height:52px;letter-spacing:.01em;transition:border-color .15s}
.display::placeholder{font-family:var(--font);font-weight:700;color:var(--muted);opacity:.7}
.display:focus{outline:none;border-color:var(--wc)}
.display.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:.76rem;color:var(--muted);margin:5px 2px 8px;font-weight:600}
.hint.err{color:var(--bad);font-weight:800}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{min-height:46px;border:0;border-radius:12px;background:var(--raised);font:700 1.2rem/1 var(--num);color:var(--ink);
  box-shadow:0 3px 0 color-mix(in srgb,var(--raised) 60%,#000);transition:transform .06s,box-shadow .06s}
.keys button:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.keys .k-ok{background:var(--good);color:#fff;font-family:var(--font);font-weight:900;font-size:1rem;box-shadow:0 3px 0 var(--good-deep)}
.keys .k-sep small{display:block;font:700 .55rem/1 var(--font);opacity:.7;margin-top:1px}
.opts{display:grid;gap:10px}
.opt{min-height:56px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px;font-size:1.08rem;font-weight:700;text-align:left;
  box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s,border-color .15s}
.opt:active{border-color:var(--wc);transform:translateY(3px);box-shadow:0 0 0 transparent}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good-deep);animation:okpop .4s ease-out}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad-deep)}
.opt:disabled{cursor:default}
@keyframes okpop{40%{transform:scale(1.03)}}

.feedback{border-radius:var(--radius);padding:16px 18px;margin:0 0 14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);animation:slideup .35s cubic-bezier(.2,.9,.3,1.1) both}
.feedback.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--line));background:linear-gradient(180deg,var(--good-soft),var(--card) 90px)}
.feedback.no{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:linear-gradient(180deg,var(--bad-soft),var(--card) 90px)}
.feedback.time{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:linear-gradient(180deg,var(--warn-soft),var(--card) 90px)}
@keyframes slideup{from{opacity:0;transform:translateY(16px)}}
.verdict{font-size:1.45rem;font-weight:900;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.verdict .vi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-size:1.1rem;margin-right:8px;vertical-align:middle;animation:vipop .5s cubic-bezier(.3,1.7,.5,1) both}
.verdict.ok .vi{background:var(--good)}.verdict.no .vi{background:var(--bad)}.verdict.time .vi{background:var(--warn)}
@keyframes vipop{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}.verdict.time{color:var(--warn)}
.verdict .pts{font:800 1rem/1 var(--num);background:var(--good);color:#fff;border-radius:999px;padding:6px 10px;white-space:nowrap}
.facit{margin:4px 0}
.tip{background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-weight:500}
.tip::before{content:"Tips: ";font-weight:800}
.steps{margin:12px 0 0;padding-left:1.4em}
.steps li{margin:0 0 8px;line-height:1.6}
.steps li.check{list-style:none;margin-left:-1.4em;padding:8px 10px;background:var(--good-soft);border-radius:10px}
.stepshead{font-weight:700;margin:14px 0 0}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2}

.levels{display:grid;gap:10px}
.lvl{--wc:var(--accent);display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 14px;min-height:66px;
  box-shadow:0 4px 0 color-mix(in srgb,var(--wc) 40%,var(--line));transition:transform .06s,box-shadow .06s}
.lvl:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.lvl .n{flex:0 0 42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--wc) 22%,var(--card));color:var(--wc);display:grid;place-items:center;font:800 1.1rem/1 var(--num)}
.lvl.cur{border-color:var(--wc);background:linear-gradient(100deg,color-mix(in srgb,var(--wc) 14%,var(--card)),var(--card) 70%)}
.lvl.cur .n{background:var(--wc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--wc) 45%,transparent)}
.lvl .t{flex:1}.lvl .t small{display:block;color:var(--muted);font-size:.82rem}
.lvl .ok{color:var(--good);font-weight:800}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.banner.up{background:var(--good-soft);color:var(--good)}
.banner.down{background:var(--warn-soft);color:var(--warn)}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--accent)}
.typerow{padding:9px 0;border-bottom:1px solid var(--line)}
.typerow:last-child{border-bottom:0}
.typerow .h{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.typerow .h span{color:var(--muted);white-space:nowrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--bad)}
.dots i.ok{background:var(--good)}

/* ===== Förståelse, Kodex, medaljer, butik ===== */
:root{--ins:#4fe3d0;--ins-soft:#0f3436;--gold:#ffcf4a;--rustc:#f0915a}
:root[data-theme="light"]{--ins:#0e8a8a;--ins-soft:#d7f5f3;--gold:#c8961c;--rustc:#b4541a}
.small{font-size:.85rem}
#title{cursor:default;user-select:none;-webkit-user-select:none}
.plrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plstats{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{background:var(--accent-soft);border-radius:999px;padding:4px 10px;font-size:.85rem;white-space:nowrap}
.chip.ins{background:var(--ins-soft);color:var(--ins);font-weight:700}
.ubadge{color:var(--ins);font-weight:700}
.sol{list-style:none;padding:0;margin:12px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sol li{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;overflow-x:auto}
.sol li:first-child{border-top:0}
.sol li.mark{background:var(--warn-soft);box-shadow:inset 4px 0 0 var(--warn)}
.rn{font-size:.72rem;color:var(--muted);white-space:nowrap;min-width:36px}
.opt.line{display:flex;gap:10px;align-items:baseline;font-size:1rem;overflow-x:auto}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(98px,1fr))}
.opts.pics .opt{padding:6px;display:grid;place-items:center}
.opt .fig{margin:0;max-width:none}
.opts.tabs .opt{padding:8px}
.vt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
.vt th,.vt td{border:1px solid var(--line);padding:4px 2px;text-align:center}
.vt th{color:var(--muted);font-weight:500;font-family:Georgia,serif}
.part{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.part:first-child{border-top:0;padding-top:0}
.pprompt{font-weight:600;margin:0 0 10px}
.pverdict{margin-top:10px;font-size:.95rem;font-weight:600}
.pverdict.ok{color:var(--good)}.pverdict.no{color:var(--bad)}
.pverdict .pmsg{display:block;font-weight:400;color:var(--ink);margin-top:4px}
.order{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.oitem{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 6px 6px 0;min-height:54px;transition:border-color .2s}
.oitem.drag{border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;z-index:3}
.grip{touch-action:none;cursor:grab;align-self:stretch;display:grid;place-items:center;width:42px;flex:0 0 42px;color:var(--muted);font-size:1.2rem;user-select:none;-webkit-user-select:none}
.otext{flex:1;min-width:0;overflow-x:auto}
.omove{display:flex;flex-direction:column;gap:4px}
.omove button{border:0;background:var(--accent-soft);border-radius:8px;width:38px;height:24px;font-size:.85rem}
.oitem.right{border-color:var(--good);background:var(--good-soft)}
.oitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.correctorder{margin:10px 0 0;padding-left:1.4em;font-size:.95rem}
.correctorder li{margin:0 0 4px}
.hintbtn{border:0;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700}
.hintbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin:12px 0 0}
.hintbox::before{content:"Ledtråd: ";font-weight:800}
.insgain{color:var(--ins);font-weight:700;margin:8px 0}
.stamp{display:inline-block;border:2px solid var(--good);color:var(--good);border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-3deg)}
.stamp.big{font-size:1rem;padding:2px 10px;border-width:3px}
.rusttag{color:var(--rustc);font-weight:700}
.medal{font-size:1.7rem;line-height:1}
.stars{color:var(--gold);letter-spacing:2px}
.bigstars{font-size:2.6rem;text-align:center;color:var(--gold);letter-spacing:8px;margin:0 0 12px}
.bigstars i{font-style:normal;display:inline-block;animation:pop .5s both}
.bigstars i:nth-child(2){animation-delay:.2s}.bigstars i:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.chk li:last-child{border-bottom:0}
.chk .ck{flex:0 0 26px;font-size:1.2rem;line-height:1.3}
.chk li.done .ck{color:var(--good)}
.chk small{display:block;color:var(--muted)}
.medalhead{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.medalhead .medal{font-size:3rem}
/* Kodex-kort */
.kprog{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.kcard{--rc:#64748b;position:relative;border-radius:14px;padding:12px;min-height:148px;border:2px solid var(--rc);text-align:left;overflow:hidden;
  display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 24%,var(--card)),var(--card) 72%);color:var(--ink)}
.kcard.r2{--rc:#2f6fe4}.kcard.r3{--rc:#9b4dea}.kcard.r4{--rc:#d4a017}
.kcard .kr{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--rc)}
.kcard .kt{font-weight:700;line-height:1.25}
.kcard .kw{margin-top:auto;font-size:.75rem;color:var(--muted)}
.kcard .kgem{position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:3px;background:var(--rc);transform:rotate(45deg)}
.kcard.locked{--rc:var(--line);background:repeating-linear-gradient(45deg,var(--card),var(--card) 8px,var(--bg) 8px,var(--bg) 16px)}
.kcard.locked .kt{font-size:2rem;color:var(--muted)}
.kcard.r3:not(.locked)::after,.kcard.r4:not(.locked)::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 45%,transparent 60%);background-size:250% 100%;animation:sheen 3.2s infinite}
.kcard.r4:not(.locked){box-shadow:0 0 0 1px #f5d77a inset,0 6px 22px rgba(212,160,23,.35)}
@keyframes sheen{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
.kcard.big{min-height:0;padding:18px;gap:10px}
.kcard.big .kt{font-size:1.4rem}
.kcard.big .ksec{font-size:.95rem}
.kcard.big .ksec b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rc);margin-bottom:2px}
.kcard.reveal{animation:reveal 1s cubic-bezier(.2,.8,.2,1.15) both}
@keyframes reveal{0%{transform:perspective(600px) rotateY(100deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.newcard{margin:12px 0 0}
.newcard .lbl{font-weight:800;color:var(--ins);margin:0 0 6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal .inner{max-width:420px;width:100%;max-height:90vh;overflow:auto}
.modal .btn{margin-top:12px}
/* Butik */
.skin{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin:0 0 10px}
.swatch{width:46px;height:46px;border-radius:12px;flex:0 0 46px;border:1px solid var(--line)}
.skin .t{flex:1}.skin .t small{display:block;color:var(--muted)}
.skin button{min-width:100px;min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.skin button.on{background:var(--good-soft);color:var(--good)}
.skin button:disabled{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;animation:toast 2.6s both;max-width:calc(100% - 32px)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ===== Black ===== */
.bcard{position:relative;aspect-ratio:1.586;width:100%;max-width:400px;margin:0 auto;border-radius:18px;padding:18px 20px;overflow:hidden;color:#e9d9a6;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),radial-gradient(130% 160% at 0% 0%,#3b3b3d 0%,#141415 42%,#050505 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(212,175,55,.28);display:flex;flex-direction:column;text-align:left;font-family:system-ui,-apple-system,sans-serif}
.bcard .bc-sheen{position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,240,200,.16) 50%,transparent 58%);animation:bsheen 5s infinite;pointer-events:none}
@keyframes bsheen{0%{transform:translateX(-40%)}55%,100%{transform:translateX(40%)}}
.bc-top{display:flex;justify-content:space-between;align-items:center;letter-spacing:.22em;font-size:.7rem;font-weight:700}
.bc-tier{font-size:1.05rem;letter-spacing:.35em;font-weight:800;background:linear-gradient(180deg,#fbeebd,#d4af37 55%,#8a6a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.bc-chip{width:46px;height:34px;border-radius:7px;margin:14px 0 6px;background:linear-gradient(135deg,#f3dc8a,#b8901e 60%,#e9cf72);display:grid;grid-template-rows:repeat(3,1fr);padding:5px 0;box-shadow:inset 0 0 0 1px rgba(80,60,10,.4)}
.bc-chip i{border-top:1px solid rgba(80,60,10,.45)}
.bc-sym{font-family:Georgia,serif;letter-spacing:.5em;opacity:.5;font-size:.9rem}
.bc-name{margin-top:auto;font-size:1.12rem;letter-spacing:.16em;font-weight:600;text-shadow:0 1px 0 rgba(0,0,0,.8),0 -1px 0 rgba(255,255,255,.08);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bc-row{display:flex;justify-content:space-between;gap:6px;font-size:.56rem;letter-spacing:.12em;opacity:.85;margin-top:8px}
.bc-row b{display:block;font-size:.9rem;letter-spacing:.04em;color:#f6e7b0}
.bc-since{font-size:.54rem;letter-spacing:.2em;opacity:.6;margin-top:6px}
.bcard.grafit{color:#e2e5ea;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),radial-gradient(130% 160% at 0% 0%,#8d929a 0%,#4b4f56 45%,#2a2c30 100%);box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.22)}
.bcard.grafit .bc-tier{background:linear-gradient(180deg,#ffffff,#9aa0a8);-webkit-background-clip:text;background-clip:text}
.bcard.grafit .bc-chip{background:linear-gradient(135deg,#eceef1,#9aa0a8)}
.bcard.grafit .bc-row b{color:#fff}
.bmini{display:block;width:100%;border:0;background:none;padding:0;margin:0 0 14px}
.bmini .bcard{max-width:none}
.teaser{display:flex;gap:14px;border-radius:16px;padding:16px;margin:0 0 14px;background:linear-gradient(135deg,#0d0d0e,#26231c);color:#e9d9a6;border:1px solid rgba(212,175,55,.35)}
.teaser .t-lock{font-size:1.8rem;line-height:1}
.teaser .t-body{flex:1}
.t-req{list-style:none;padding:0;margin:8px 0 0;font-size:.88rem}
.t-req li{padding:2px 0;opacity:.72}.t-req li.done{opacity:1;color:#f2d16b}
.t-req span{opacity:.75}
.teaser.ready{animation:glow 2.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 26px rgba(212,175,55,.45)}}
.btn.gold,.btn.t-go{background:linear-gradient(180deg,#f3d77a,#c9a227);color:#111}
.btn.t-go{margin:12px 0 0}
.bossintro{background:radial-gradient(120% 100% at 50% 0%,#2b2414,#0b0b0c 70%);color:#efe3bf;border-radius:18px;padding:22px;margin:0 0 14px;border:1px solid rgba(212,175,55,.4)}
.bossintro h2{font-size:1.9rem;letter-spacing:.06em;margin:0 0 6px;color:#f2d16b}
.bossintro ul{padding-left:1.2em;margin:12px 0 0}
.bossintro li{margin:0 0 6px}
body.bossmode #g-card{border-color:#c9a227;box-shadow:0 0 0 1px #c9a227,0 0 28px rgba(201,162,39,.25)}
body.bossmode .timer>div{background:linear-gradient(90deg,#f3d77a,#c9a227)}
.okb{display:inline-block;background:#111;color:#f2d16b;border:1px solid #c9a227;border-radius:6px;padding:1px 7px;font-size:.66rem;font-weight:800;letter-spacing:.08em;vertical-align:middle}
.lvl.bl .n{background:#111;color:#f2d16b;border:1px solid #c9a227;font-size:.8rem}
.lesson p{margin:0 0 10px}
.exsteps{margin:10px 0 0;padding-left:1.4em}
.exsteps li{margin:0 0 8px;animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.qres{margin-top:10px;font-weight:600}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch button{min-width:92px;min-height:44px;border-radius:999px;border:0;font-weight:800;background:var(--line);color:var(--ink)}
.switch button.on{background:linear-gradient(180deg,#f3d77a,#c9a227);color:#111}
.nameinput{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:6px}
/* Testläge */
#testbar{position:sticky;top:0;z-index:40;background:repeating-linear-gradient(45deg,#f5c518,#f5c518 10px,#1b1b1b 10px,#1b1b1b 20px);padding:4px}
#testbar>div{background:#1b1b1b;color:#f5c518;font-weight:800;font-size:.78rem;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;gap:8px}
#testbar button{border:0;background:#f5c518;color:#111;font-weight:800;border-radius:6px;padding:5px 10px;margin-left:4px}
.testgrid{display:grid;gap:8px;margin:12px 0}
.testgrid .btn{margin:0;text-align:left}
/* Black-animationen */
.fx{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:hidden;animation:fxin .6s both;perspective:900px}
@keyframes fxin{from{opacity:0}}
.fx-burst{position:absolute;left:50%;top:40%;width:40px;height:40px;margin:-20px;border-radius:50%;background:radial-gradient(circle,#fff6d0,#d4af37 40%,transparent 70%);animation:burst 1.6s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes burst{0%{transform:scale(0);opacity:1}70%{opacity:.8}100%{transform:scale(28);opacity:0}}
.fx-sparks i{position:absolute;left:50%;top:40%;width:6px;height:6px;border-radius:50%;background:#f3d77a;box-shadow:0 0 8px #f3d77a;opacity:0;animation:spark 1.6s calc(.5s + var(--d)) ease-out both}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.fx-card{width:min(360px,88vw);animation:cardin 1.4s .9s cubic-bezier(.2,.9,.25,1.1) both;transform-style:preserve-3d}
@keyframes cardin{0%{opacity:0;transform:rotateY(-110deg) rotateX(20deg) scale(.5)}100%{opacity:1;transform:none}}
.fx-card .bcard{animation:float 4s 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotateX(4deg)}}
.fx-title{margin-top:28px;font-size:2.6rem;font-weight:800;letter-spacing:.6em;padding-left:.6em;background:linear-gradient(90deg,#8a6a12,#f8e7a8,#c9a227,#f8e7a8,#8a6a12);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fxtitle 1.2s 1.8s both,shine 3s 3s linear infinite}
@keyframes fxtitle{from{opacity:0;letter-spacing:1.6em}}
@keyframes shine{to{background-position:-200% 0}}
.fx-sub{color:#cfc3a0;margin-top:8px;text-align:center;animation:fxin .8s 2.4s both}
.fx-btn{max-width:320px;margin-top:26px;background:linear-gradient(180deg,#f3d77a,#c9a227);color:#111;animation:fxin .6s 2.9s both}
@media (prefers-reduced-motion: reduce){.fx,.fx *{animation-duration:.01s!important;animation-delay:0s!important}.bcard .bc-sheen,.kcard::after{animation:none}}
/* Temat Svart och guld: ligger sist så att det vinner över ljust och mörkt läge */
:root[data-skin="black"]{--bg:#0a0a0b;--card:#141416;--ink:#f1e9d2;--muted:#a49c86;--line:#2c2a25;--grid:#1d1c19;--accent:#d4af37;--accent-ink:#0a0a0b;--accent-soft:#2a2414;
  --c1:#e3c35a;--c2:#e5e4e2;--good:#7bd88f;--good-soft:#14281a;--bad:#ff7a85;--bad-soft:#341418;--warn:#e8c15a;--warn-soft:#2c2412;--ins:#e3c35a;--ins-soft:#2a2414;--gold:#e3c35a;color-scheme:dark}
:root[data-skin="black"] .btn.primary,:root[data-skin="black"] .keys .k-ok{background:linear-gradient(180deg,#f3d77a,#c9a227);color:#111}
:root[data-skin="black"]{--accent-2:#f3d77a;--bg-glow:#2a2414;--raised:#201e1a;--accent-ink:#111}
:root[data-skin="black"] .playbtn{color:#111}
.card>.xpbar{margin:10px 0 6px}

/* ===== Konto ===== */
.avatarbtn{position:absolute;top:10px;left:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);padding:0}
.avatarbtn svg{width:20px;height:20px}
.avatarbtn.in{border:0;color:#fff;font:900 1.1rem/1 var(--font);background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.avatarbtn .sd{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);background:var(--good)}
.avatarbtn .sd.pending,.avatarbtn .sd.saving{background:var(--warn)}
.avatarbtn .sd.offline{background:var(--muted)}
.acc-hero{text-align:center;padding:8px 0 6px}
.acc-hero .logo{width:72px;height:72px;margin-bottom:6px}
.acc-hero h2{margin:4px 0 4px;font-size:1.7rem}
.acc-hero p{color:var(--muted);margin:0 auto;max-width:340px;font-size:.95rem}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.85rem;font-weight:800;color:var(--muted);margin:0 0 6px 2px}
.field input{width:100%;font:700 1.05rem/1.2 var(--font);padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);transition:border-color .15s}

<!-- =====================================================================
     KÄRNA: bråk, polynom, svarskontroll och uppgiftsgeneratorer.
     Ingen DOM här, så att tests.html kan köra samma kod.
     ===================================================================== -->
<script id="core">
(function(root){
'use strict';

/* ---------- Slump ---------- */
let rand = Math.random;
function setRandom(fn){ rand = fn || Math.random; }
const ri = (a,b) => a + Math.floor(rand()*(b-a+1));
const pick = arr => arr[Math.floor(rand()*arr.length)];
function nzi(a,b,ex=[0]){ let v; do v = ri(a,b); while(ex.includes(v)); return v; }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Bråk ---------- */
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
class Frac{
  constructor(n,d=1){
    if(!Number.isInteger(n)||!Number.isInteger(d)) throw new Error('Frac kräver heltal: '+n+'/'+d);
    if(d===0) throw new Error('Division med noll');
    if(d<0){ n=-n; d=-d; }
    const g=gcd(n,d); this.n=n/g; this.d=d/g;
    if(this.n===0){ this.n=0; this.d=1; }
  }
  static of(x){ return x instanceof Frac ? x : new Frac(x,1); }
  add(o){ o=Frac.of(o); return new Frac(this.n*o.d+o.n*this.d, this.d*o.d); }
  sub(o){ return this.add(Frac.of(o).neg()); }
  mul(o){ o=Frac.of(o); return new Frac(this.n*o.n, this.d*o.d); }
  div(o){ o=Frac.of(o); return new Frac(this.n*o.d, this.d*o.n); }
  neg(){ return new Frac(-this.n,this.d); }
  abs(){ return new Frac(Math.abs(this.n),this.d); }
  pow(k){ let r=new Frac(1); for(let i=0;i<k;i++) r=r.mul(this); return r; }
  eq(o){ o=Frac.of(o); return this.n===o.n && this.d===o.d; }
  isInt(){ return this.d===1; }
  isZero(){ return this.n===0; }
  num(){ return this.n/this.d; }
  tex(){ return this.d===1 ? String(this.n) : (this.n<0?'-':'')+'\\frac{'+Math.abs(this.n)+'}{'+this.d+'}'; }
  str(){ return this.d===1 ? String(this.n) : this.n+'/'+this.d; }
}
const F = (n,d=1) => new Frac(n,d);
function isqrt(n){ if(n<0) return null; const r=Math.round(Math.sqrt(n)); return r*r===n ? r : null; }
function sqrtFrac(f){ const a=isqrt(f.n), b=isqrt(f.d); return (a===null||b===null) ? null : F(a,b); }

/* ---------- Polynom i flera variabler ---------- */
class Poly{
  constructor(){ this.t=new Map(); }
  static mono(c,e){ const p=new Poly(); p.acc(Frac.of(c), e||{}); return p; }
  static c(c){ return Poly.mono(c,{}); }
  static v(name){ return Poly.mono(1,{[name]:1}); }
  static uni(cs,v='x'){ const p=new Poly(), n=cs.length-1; cs.forEach((c,i)=>p.acc(Frac.of(c), n-i ? {[v]:n-i} : {})); return p; }
  static of(x){ return x instanceof Poly ? x : Poly.c(x); }
  acc(c,e){
    const ee={}; Object.keys(e).sort().forEach(k=>{ if(e[k]) ee[k]=e[k]; });
    const key=Object.keys(ee).map(k=>k+ee[k]).join('');
    const cur=this.t.get(key); const nc=cur ? cur.c.add(c) : c;
    if(nc.isZero()) this.t.delete(key); else this.t.set(key,{c:nc,e:ee});
    return this;
  }
  terms(){ return [...this.t.values()]; }
  clone(){ const p=new Poly(); this.terms().forEach(T=>p.acc(T.c,T.e)); return p; }
  add(q){ q=Poly.of(q); const p=this.clone(); q.terms().forEach(T=>p.acc(T.c,T.e)); return p; }
  neg(){ const p=new Poly(); this.terms().forEach(T=>p.acc(T.c.neg(),T.e)); return p; }
  sub(q){ return this.add(Poly.of(q).neg()); }
  mul(q){
    q=Poly.of(q); const p=new Poly();
    for(const A of this.terms()) for(const B of q.terms()){
      const e={...A.e}; for(const k in B.e) e[k]=(e[k]||0)+B.e[k];
      p.acc(A.c.mul(B.c), e);
    }
    return p;
  }
  pow(n){ let p=Poly.c(1); for(let i=0;i<n;i++) p=p.mul(this); return p; }
  subst(v,q){
    q=Poly.of(q); let r=new Poly();
    for(const T of this.terms()){ const e={...T.e}; const d=e[v]||0; delete e[v]; r=r.add(Poly.mono(T.c,e).mul(q.pow(d))); }
    return r;
  }
  eval(env){
    let s=F(0);
    for(const T of this.terms()){ let t=T.c; for(const k in T.e) t=t.mul(Frac.of(env[k]).pow(T.e[k])); s=s.add(t); }
    return s;
  }
  evalNum(env){
    let s=0;
    for(const T of this.terms()){ let t=T.c.num(); for(const k in T.e) t*=Math.pow(env[k],T.e[k]); s+=t; }
    return s;
  }
  eq(q){ return this.sub(q).t.size===0; }
  sorted(){
    const td=e=>Object.values(e).reduce((a,b)=>a+b,0);
    return this.terms().sort((A,B)=>td(B.e)-td(A.e) || (B.e.x||0)-(A.e.x||0) || (B.e.a||0)-(A.e.a||0));
  }
  tex(){
    const ts=this.sorted(); if(!ts.length) return '0';
    return ts.map((T,i)=>{
      const neg=T.c.n<0, a=neg?T.c.neg():T.c;
      const vars=Object.keys(T.e).map(k=>k+(T.e[k]>1?'^{'+T.e[k]+'}':'')).join('');
      const body=vars ? (a.eq(1)?'':a.tex())+vars : a.tex();
      return (i ? (neg?' - ':' + ') : (neg?'-':'')) + body;
    }).join('');
  }
  termVals(env){ return this.sorted().map(T=>Poly.mono(T.c,T.e).eval(env)); }
}
const X = () => Poly.v('x');

/* ---------- TeX-hjälp ---------- */
const T = v => Frac.of(v).tex();
const P = v => { const f=Frac.of(v); return f.n<0 ? '('+f.tex()+')' : f.tex(); };       // parentes om negativt
const PB = v => { const f=Frac.of(v); return (f.n<0||!f.isInt()) ? '\\left('+f.tex()+'\\right)' : f.tex(); }; // bas för potens
const plus = v => { const f=Frac.of(v); return f.n<0 ? ' - '+f.neg().tex() : ' + '+f.tex(); };
const poly = (cs,v='x') => Poly.uni(cs,v).tex();
const mono = (k,v) => Poly.uni([k,0],v).tex();
const plusM = (k,v) => Frac.of(k).n<0 ? ' - '+mono(Frac.of(k).neg(),v) : ' + '+mono(k,v);
const frac = (a,b) => '\\frac{'+a+'}{'+b+'}';
const ineq = inc => inc ? '\\le' : '<';
function sumTex(vals){
  const nz=vals.map(Frac.of).filter(v=>!v.isZero());
  if(!nz.length) return '0';
  return nz.map((v,i)=>i?plus(v):v.tex()).join('');
}
// Visar insättning: koefficienter (högst grad först) med x0 insatt, t.ex. "(-3)^{2} - 2\cdot(-3)"
function subsTex(cs,x0){
  const n=cs.length-1, parts=[];
  cs.forEach((c,i)=>{
    c=Frac.of(c); const d=n-i; if(c.isZero()) return;
    const base = d===0 ? '' : d===1 ? P(x0) : PB(x0)+'^{'+d+'}';
    const a=c.abs(); let body;
    if(d===0) body=a.tex(); else if(a.eq(1)) body=base; else body=a.tex()+'\\cdot '+base;
    parts.push((parts.length ? (c.n<0?' - ':' + ') : (c.n<0?'-':''))+body);
  });
  return parts.join('') || '0';
}
function termVals(cs,x0){ const n=cs.length-1; return cs.map((c,i)=>Frac.of(c).mul(Frac.of(x0).pow(n-i))); }
const evalCs = (cs,x0) => termVals(cs,x0).reduce((s,v)=>s.add(v),F(0));
const WORD={2:'tvåan',3:'trean',4:'fyran',5:'femman'};
const NAMES=['Alva','Elias','Maja','Noah','Ella','Hugo','Saga','Liam','Vera','Omar','Ida','Leo'];

/* ---------- Svarstyper ---------- */
function num(values,tex,opts={}){ return {kind:'num', values:values.map(Frac.of), tex, ordered:!!opts.ordered, hint:opts.hint||''}; }
function mc(correct,distractors){
  const seen=new Set([correct]); const opts=[{t:correct, ok:true, msg:null, h:null}];
  for(const d of distractors){
    if(!d||seen.has(d.t)) continue;
    seen.add(d.t); opts.push({t:d.t, ok:false, msg:d.msg||null, h:d.h||null});
    if(opts.length===4) break;
  }
  return {kind:'mc', options:shuffle(opts)};
}
const pmc = (correct,list) => mc('$'+correct.tex()+'$', list.filter(Boolean).map(([p,msg])=>({t:'$'+p.tex()+'$', msg})));
const pmcL = (lhs,correct,list) => mc('$'+lhs+correct.tex()+'$', list.filter(Boolean).map(([p,msg])=>({t:'$'+lhs+p.tex()+'$', msg})));

/* ---------- Tolka svar ---------- */
function parseNum(raw){
  let s=String(raw).replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/^[a-zåäö]+(_?\d)?=/i,'');
  const toF=t=>{
    t=t.replace(',','.'); const neg=t[0]==='-'; t=t.replace(/^[+-]/,'');
    const [i,f='']=t.split('.'); const n=parseInt((i||'0')+f,10);
    return new Frac(neg?-n:n, Math.pow(10,f.length));
  };
  const D='[+-]?(?:\\d+(?:[.,]\\d+)?|[.,]\\d+)';
  if(new RegExp('^'+D+'$').test(s)) return toF(s);
  const m=s.match(new RegExp('^('+D+')/('+D+')$'));
  if(m){ const b=toF(m[2]); if(b.isZero()) return null; return toF(m[1]).div(b); }
  return null;
}
// Delar upp "2, -3", "2; -3", "x = 2 eller x = -3". Komma mellan två siffror är decimalkomma.
function parseList(raw,expected=1){
  const s=String(raw).replace(/[−–—]/g,'-').replace(/\s+(och|eller)\s+/gi,';')
    .replace(/\s*([=\/])\s*/g,'$1').replace(/(^|[\s;,])([+-])\s+(?=\d)/g,'$1$2').trim();
  const conv=(str,allComma)=>{
    let o=''; for(let i=0;i<str.length;i++){
      const ch=str[i];
      if(ch===',' && (allComma || !(/\d/.test(str[i-1]||'') && /\d/.test(str[i+1]||'')))) o+=';'; else o+=ch;
    } return o;
  };
  const tryParse=t=>{
    const parts=t.split(';').flatMap(p=>p.trim().split(/\s+/)).filter(Boolean);
    if(!parts.length) return null;
    const v=parts.map(parseNum); return v.includes(null) ? null : v;
  };
  let v=tryParse(conv(s,false));
  if(expected>1 && (!v || v.length<expected)){ const w=tryParse(conv(s,true)); if(w && w.length===expected) v=w; }
  return v;
}
function uniq(a){ const out=[]; a.forEach(v=>{ if(!out.some(w=>w.eq(v))) out.push(v); }); return out; }
function sameVals(a,b,ordered){
  if(ordered) return a.length===b.length && a.every((v,i)=>v.eq(b[i]));
  const ua=uniq(a), ub=uniq(b);
  return ua.length===ub.length && ua.every(v=>ub.some(w=>w.eq(v)));
}
function check(task,input){
  const A=task.answer;
  if(A.kind==='mc'){
    const o=A.options[input]; if(!o) return {valid:false};
    return {valid:true, correct:o.ok, msg:o.ok?null:o.msg};
  }
  if(A.kind==='order'){
    if(!Array.isArray(input) || input.length!==A.items.length) return {valid:false};
    const right=input.filter((v,i)=>v===i).length;
    if(right===input.length) return {valid:true, correct:true, msg:null};
    return {valid:true, correct:false, msg: input[0]!==0
      ? 'Börja med det som är givet i uppgiften. Varje rad ska följa direkt ur raden före.'
      : `${right} av ${input.length} steg står på rätt plats. Fråga dig för varje rad: vilken rad måste stå före, för att den här ska gå att skriva?`};
  }
  const vals=parseList(input, A.values.length);
  if(!vals || !vals.length) return {valid:false};
  if(sameVals(vals,A.values,A.ordered)) return {valid:true, correct:true, msg:null};
  for(const e of task.errors) if(sameVals(vals,e.values,A.ordered)) return {valid:true, correct:false, msg:e.msg};
  const n=A.values.length;
  if(vals.length===n && sameVals(vals.map(v=>v.abs()), A.values.map(v=>v.abs()), A.ordered))
    return {valid:true, correct:false, msg:'Du har rätt siffror men fel tecken. Kolla tecknen: minus gånger minus blir plus.'};
  if(n>1 && !A.ordered && vals.length<n && vals.every(v=>A.values.some(w=>w.eq(v))))
    return {valid:true, correct:false, msg:'Det du skrev stämmer, men det finns '+n+' lösningar. Skriv alla, med ; emellan.'};
  if(n>1 && vals.length!==n) return {valid:true, correct:false, msg:'Svaret ska bestå av '+n+' tal, med ; emellan.'};
  return {valid:true, correct:false, msg:null};
}

/* ---------- SVG-figurer ---------- */
const svgOpen=(w,h,label)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">`;
const mt = v => v<0 ? '−'+(-v) : String(v);
const r1 = v => Math.round(v*10)/10;
function dotSVG(x,y,filled){ return `<circle class="dot${filled?'':' hollow'}" cx="${r1(x)}" cy="${r1(y)}" r="6"/>`; }

function numberLineSVG(o){
  const min=-7,max=7,u=22,pad=18,W=(max-min)*u+2*pad,H=58,y=22,X=v=>pad+(v-min)*u;
  let s=svgOpen(W,H,'Tallinje');
  s+=`<line class="ax" x1="${pad-12}" y1="${y}" x2="${W-pad+12}" y2="${y}"/>`;
  for(let v=min;v<=max;v++) s+=`<line class="ax" x1="${X(v)}" y1="${y-5}" x2="${X(v)}" y2="${y+5}"/><text class="tick" x="${X(v)}" y="${y+22}" text-anchor="middle">${mt(v)}</text>`;
  if(o.ray){
    const x0=X(o.a), end=o.dir>0 ? W-pad+8 : pad-8;
    s+=`<line class="hl" x1="${x0}" y1="${y}" x2="${end-(o.dir>0?8:-8)}" y2="${y}"/>`;
    s+=o.dir>0 ? `<polygon class="arrow" points="${end+4},${y} ${end-8},${y-7} ${end-8},${y+7}"/>`
               : `<polygon class="arrow" points="${end-4},${y} ${end+8},${y-7} ${end+8},${y+7}"/>`;
    s+=dotSVG(x0,y,o.filled);
  } else {
    s+=`<line class="hl" x1="${X(o.L)}" y1="${y}" x2="${X(o.R)}" y2="${y}"/>`;
    s+=dotSVG(X(o.L),y,o.lf)+dotSVG(X(o.R),y,o.rf);
  }
  return s+'</svg>';
}

let svgId=0;
// o = {xmin,xmax,ymin,ymax, mini, curves:[{fn,from,to,cls,label,lx,ly,lcls}], dots:[{x,y,filled}]}
function graphSVG(o){
  const u=o.mini ? 16 : Math.min(30, 330/(o.xmax-o.xmin)), pad=16, id='clip'+(++svgId), ys=o.ys||1;
  const W=(o.xmax-o.xmin)*u+2*pad, H=(o.ymax-o.ymin)*u/ys+2*pad;
  const X=x=>pad+(x-o.xmin)*u, Y=y=>pad+(o.ymax-Math.max(o.ymin-2*ys,Math.min(o.ymax+2*ys,y)))*u/ys;
  const step=(o.mini||o.xmax-o.xmin>13||(o.ymax-o.ymin)/ys>13)?2:1;
  let s=svgOpen(r1(W),r1(H),o.aria||'Graf');
  s+=`<defs><clipPath id="${id}"><rect x="${pad}" y="${pad}" width="${r1(W-2*pad)}" height="${r1(H-2*pad)}"/></clipPath></defs>`;
  for(let x=Math.ceil(o.xmin);x<=o.xmax;x++) s+=`<line class="gr" x1="${r1(X(x))}" y1="${pad}" x2="${r1(X(x))}" y2="${r1(H-pad)}"/>`;
  for(let y=Math.ceil(o.ymin/ys)*ys;y<=o.ymax;y+=ys) s+=`<line class="gr" x1="${pad}" y1="${r1(Y(y))}" x2="${r1(W-pad)}" y2="${r1(Y(y))}"/>`;
  // axlar
  s+=`<line class="ax" x1="${pad-6}" y1="${r1(Y(0))}" x2="${r1(W-pad+6)}" y2="${r1(Y(0))}"/>`;
  s+=`<polygon class="axarrow" points="${r1(W-pad+12)},${r1(Y(0))} ${r1(W-pad+2)},${r1(Y(0)-5)} ${r1(W-pad+2)},${r1(Y(0)+5)}"/>`;
  s+=`<line class="ax" x1="${r1(X(0))}" y1="${r1(H-pad+6)}" x2="${r1(X(0))}" y2="${pad-6}"/>`;
  s+=`<polygon class="axarrow" points="${r1(X(0))},${pad-12} ${r1(X(0)-5)},${pad-2} ${r1(X(0)+5)},${pad-2}"/>`;
  s+=`<text class="tick" x="${r1(W-pad+4)}" y="${r1(Y(0)-8)}" font-style="italic">x</text>`;
  s+=`<text class="tick" x="${r1(X(0)+8)}" y="${pad}" font-style="italic">y</text>`;
  for(let x=Math.ceil(o.xmin);x<=o.xmax;x++) if(x!==0 && x%step===0)
    s+=`<text class="tick" x="${r1(X(x))}" y="${r1(Y(0)+15)}" text-anchor="middle">${mt(x)}</text>`;
  for(let y=Math.ceil(o.ymin/ys)*ys;y<=o.ymax;y+=ys) if(y!==0 && (y/ys)%step===0)
    s+=`<text class="tick" x="${r1(X(0)-5)}" y="${r1(Y(y)+4)}" text-anchor="end">${mt(y)}</text>`;
  s+=`<text class="tick" x="${r1(X(0)-5)}" y="${r1(Y(0)+15)}" text-anchor="end">0</text>`;
  for(const c of o.curves){
    let d=''; const N=90;
    for(let i=0;i<=N;i++){ const x=c.from+(c.to-c.from)*i/N; d+=(i?'L':'M')+r1(X(x))+' '+r1(Y(c.fn(x))); }
    s+=`<path class="${c.cls}" d="${d}" clip-path="url(#${id})"/>`;
    if(c.label) s+=`<text class="${c.lcls}" x="${r1(X(c.lx))}" y="${r1(Y(c.ly))}" text-anchor="middle">${c.label}</text>`;
  }
  for(const p of (o.dots||[])) s+=dotSVG(X(p.x),Y(p.y),p.filled);
  return s+'</svg>';
}
function boundsFor(xs,ys){
  return {xmin:Math.min(-1,Math.floor(Math.min(...xs))-1), xmax:Math.max(1,Math.ceil(Math.max(...xs))+1),

}

/* =====================================================================
   UPPGIFTSGENERATORER
   Varje generator returnerar {diff, prompt, answer, errors, steps, fig, verify}.
   verify() räknar om svaret på ett oberoende sätt (insättning, kontroll).
   ===================================================================== */
const TYPES={};
function def(id,level,name,gen){ TYPES[id]={id,level,name,gen}; }

/* ----- Nivå 1: Insättning ----- */
def('ins-lin',1,'Insättning i linjär funktion',()=>{
  const k=nzi(-6,6,[0,1]), m=nzi(-9,9), x0=nzi(-5,6,[0,1]);
  const kx=k*x0, y=kx+m;
  return {
    diff:1,
    prompt:`$f(x) = ${poly([k,m])}$. Beräkna $f(${x0})$.`,
    answer:num([y],`f(${x0}) = ${y}`),
    errors:[
      x0<0 && {values:[-kx+m], msg:`Kolla tecknet. $x$ är negativt här, så $${k}\\cdot ${P(x0)} = ${kx}$.`},
      {values:[kx-m], msg:`Kolla tecknet framför konstanttermen. Det ska vara $${kx}${plus(m)}$.`},
      {values:[kx], msg:`Glöm inte konstanttermen $${m}$.`},
    ],
    steps:[
      `$f(${x0})$ betyder att vi sätter in $${x0}$ i stället för $x$.`,
      `$f(${x0}) = ${k}\\cdot ${P(x0)}${plus(m)}$`,
      `Gånger räknas före plus och minus: $${k}\\cdot ${P(x0)} = ${kx}$.`+(k<0&&x0<0?' Minus gånger minus blir plus.':''),
      `$f(${x0}) = ${kx}${plus(m)} = ${y}$`,
      `Kontroll: räkna baklänges. $${y}${plus(-m)} = ${kx}$ och $${frac(kx,k)} = ${x0}$ ✓`,
    ],
    verify:()=>Poly.uni([k,m]).eval({x:x0}).eq(y) && F(y-m,k).eq(x0),
  };
});

def('ins-kvad',1,'Insättning i andragradsfunktion',()=>{
  const a=pick([1,1,1,-1,2]), b=nzi(-5,5), c=pick([0,0,ri(-6,6)]), x0=pick([-4,-3,-2,-1,-1,2,3]);
  const cs=[a,b,c], y=Poly.uni(cs).eval({x:x0}).n, sq=x0*x0, t1=a*sq, t2=b*x0, inner=a*x0+b;
  const steps=[
    `$f(${x0})$ betyder att vi sätter in $${x0}$ i stället för varje $x$.`+(x0<0?' Sätt parentes runt det negativa talet, så att tecknen blir rätt.':''),
    `$f(${x0}) = ${subsTex(cs,x0)}$`,
    x0<0 ? `Potensen först: $(${x0})^2 = (${x0})\\cdot(${x0}) = ${sq}$, för minus gånger minus blir plus.`
         : `Potensen först: $${x0}^2 = ${sq}$.`,
    `Sedan gånger: ${a!==1?`$${a}\\cdot ${sq} = ${t1}$ och `:''}$${b}\\cdot ${P(x0)} = ${t2}$.`,
    `$f(${x0}) = ${sumTex([t1,t2,c])} = ${y}$`,
    `Kontroll på ett annat sätt: $f(x) = x(${poly([a,b])})${c?plus(c):''}$, så $f(${x0}) = ${P(x0)}\\cdot ${P(inner)}${c?plus(c):''} = ${y}$ ✓`,
  ];
  return {
    diff:x0<0?2:1,
    prompt:`$f(x) = ${poly(cs)}$. Beräkna $f(${x0})$.`,
    answer:num([y],`f(${x0}) = ${y}`),
    errors:[
      x0<0 && {values:[-t1+t2+c], msg:`Kolla tecknet. $(${x0})^2 = ${sq}$, för minus gånger minus blir plus.`},
      {values:[t1-t2+c], msg:`Kolla tecknet på $${b}\\cdot ${P(x0)}$. Det blir $${t2}$.`},
      Math.abs(a)!==1 && {values:[(a*x0)*(a*x0)+t2+c], msg:`Bara $x$ ska kvadreras, inte ${WORD[Math.abs(a)]||'talet framför'}: $${a}\\cdot ${PB(x0)}^2 = ${a}\\cdot ${sq}$.`},
    ],
    steps,
    verify:()=>x0*inner+c===y,
  };
});

def('ins-los',1,'Lös f(x) = k',()=>{
  const k=nzi(-5,6,[0,1]); let x0=F(nzi(-6,8)), diff=1;
  if(Math.abs(k)>=2 && Math.abs(k)<=4 && rand()<0.35){ x0=F(nzi(-7,7),Math.abs(k)); if(!x0.isInt()) diff=2; }
  const m=nzi(-9,9), y=x0.mul(k).add(m).n, r=y-m;
  return {
    diff,
    prompt:`$f(x) = ${poly([k,m])}$. Lös ekvationen $f(x) = ${y}$.`,
    answer:num([x0],`x = ${T(x0)}`),
    errors:[
      {values:[F(y+m,k)], msg:`Kolla tecknet när du flyttar över $${m}$. En term byter tecken när den byter sida.`},
      {values:[k*y+m], msg:`Du har räknat ut $f(${y})$. Här ska du i stället hitta det $x$ som ger $f(x) = ${y}$.`},
      r!==0 && {values:[F(k,r)], msg:`Bråket blev upp och ner. Det är $x$ som ska stå ensamt, så dela med $${k}$.`},
    ],
    steps:[
      `$f(x) = ${y}$ frågar: vilket $x$ ger funktionsvärdet $${y}$?`,
      `Sätt uttrycket lika med $${y}$: $${poly([k,m])} = ${y}$`,
      (m>0?`Dra bort $${m}$ på båda sidor`:`Lägg till $${-m}$ på båda sidor`)+`, så att $x$-termen står ensam: $${mono(k,'x')} = ${r}$`,
      `Dela båda sidor med $${k}$, så blir $x$ ensamt: $x = ${frac(r,k)} = ${T(x0)}$`,
      `Kontroll: $f(${T(x0)}) = ${k}\\cdot ${P(x0)}${plus(m)} = ${T(x0.mul(k))}${plus(m)} = ${y}$ ✓`,
    ],
    verify:()=>Poly.uni([k,m]).eval({x:x0}).eq(y),
  };
});

/* ----- Nivå 2: Tecken och parenteser ----- */
def('par-tva',2,'Multiplicera två parenteser',()=>{
  let p=nzi(-7,7), q=nzi(-7,7); if(p>0&&q>0) p=-p;
  const res=X().add(p).mul(X().add(q)), s=p+q, pr=p*q;
  const t=[1,2,3,4].find(v=>v+p!==0&&v+q!==0);
  const v=(t+p)*(t+q);
  return {
    diff:(p<0&&q<0)?1:2,
    prompt:`Multiplicera ut $(${poly([1,p])})(${poly([1,q])})$.`,
    answer:pmc(res,[
      [Poly.uni([1,s,-pr]), `Kolla tecknet på konstanttermen: $${P(p)}\\cdot ${P(q)} = ${pr}$.`+(p<0&&q<0?' Minus gånger minus blir plus.':'')],
      [Poly.uni([1,-s,pr]), `Kolla tecknet på $x$-termen: $${mono(q,'x')}${plusM(p,'x')} = ${mono(s,'x')}$.`],
      [Poly.uni([1,0,pr]), 'Du har glömt mittentermerna. Varje term i första parentesen ska gångras med varje term i den andra.'],
      [Poly.uni([1,pr,s]), 'Du har blandat ihop termerna. $x$-termen kommer från $x$ gånger talen. Konstanttermen kommer från talen gånger varandra.'],
      [Poly.uni([1,-s,-pr]), 'Kolla tecknen på både $x$-termen och konstanttermen.'],
    ]),
    errors:[],
    steps:[
      'Varje term i första parentesen ska gångras med varje term i den andra. Det blir fyra produkter:',
      `$x\\cdot x = x^2$, $\\;x\\cdot ${P(q)} = ${mono(q,'x')}$, $\\;${P(p)}\\cdot x = ${mono(p,'x')}$, $\\;${P(p)}\\cdot ${P(q)} = ${pr}$`,
      (p<0&&q<0) && 'Minus gånger minus blir plus. Därför är konstanttermen positiv.',
      `$x$-termerna är av samma sort, så de slås ihop: $${mono(q,'x')}${plusM(p,'x')} = ${mono(s,'x')}$`,
      `Svar: $${res.tex()}$`,
      `Kontroll med $x = ${t}$: $(${t}${plus(p)})(${t}${plus(q)}) = ${v}$ och $${subsTex([1,s,pr],t)} = ${v}$ ✓`,
    ],
    verify:()=>[t,-3,5].every(z=>res.eval({x:z}).eq((z+p)*(z+q))) && evalCs([1,s,pr],t).eq(v),
  };
});

def('par-en',2,'Multiplicera in i en parentes',()=>{
  const k=pick([1,1,2,3,-1,-2]), m=ri(2,12), n=pick([-1,-2,-3,-4,2,3]);
  const pre=mono(k,'x'), res=Poly.uni([k*n,k*m,0]);
  const sqTerm=Poly.uni([k*n,0,0]).tex(), linTerm=mono(k*m,'x');
  return {
    diff:k<0?2:1,
    prompt:`Multiplicera ut $${pre}(${m}${plusM(n,'x')})$.`,
    answer:pmc(res,[
      [Poly.uni([-k*n,k*m,0]), `Kolla tecknet: $${pre}\\cdot ${P(n)}x = ${sqTerm}$.`],
      [Poly.uni([k*m+k*n,0]), 'Glöm inte att $x\\cdot x = x^2$. Termerna är inte av samma sort och kan inte slås ihop.'],
      [Poly.uni([k*n,0,m]), `Multiplicera in i alla termer i parentesen, även i $${m}$.`],
      [Poly.uni([-k*n,-k*m,0]), 'Kolla tecknen. Plus gånger minus blir minus, minus gånger minus blir plus.'],
    ]),
    errors:[],
    steps:[
      'Det som står framför parentesen ska gångras med varje term inuti parentesen.',
      `$${pre}\\cdot ${m} = ${linTerm}$`,
      `$${pre}\\cdot ${P(n)}x = ${sqTerm}$, för $x\\cdot x = x^2$`+((k<0)!==(n<0)?' och plus gånger minus blir minus.':'.'),
      `Svar: $${res.tex()}$`,
      `Kontroll med $x = 1$: $${k}\\cdot(${m}${plus(n)}) = ${k*(m+n)}$ och $${sumTex(res.termVals({x:1}))} = ${k*(m+n)}$ ✓`,
    ],
    verify:()=>[1,2,-3].every(z=>res.eval({x:z}).eq(k*z*(m+n*z))),
  };
});

def('par-a',2,'Parentes med bokstäver',()=>{
  const k=pick([1,1,2,3,-1,-2]), b=nzi(-6,6);
  const A=Poly.v('a'), pre=Poly.mono(k,{a:1}), preT=pre.tex();
  const ax=A.mul(X()), res=pre.mul(ax.add(b));
  const t1=pre.mul(ax), t2=pre.mul(b);
  const lv=2*k*(2+b);
  return {
    diff:k<0?2:1,
    prompt:`Multiplicera ut $${preT}(ax${plus(b)})$.`,
    answer:pmc(res,[
      [pre.mul(X()).add(t2), `$a\\cdot a = a^2$. Därför blir första termen $${t1.tex()}$.`],
      [t1.add(b), `Multiplicera in i alla termer i parentesen, även i $${b}$.`],
      [t1.sub(t2), `Kolla tecknet: $${preT}\\cdot ${P(b)} = ${t2.tex()}$.`],
      [pre.mul(X()).sub(t2), 'Kolla både tecknet och bokstäverna. $a\\cdot a = a^2$.'],
    ]),
    errors:[],
    steps:[
      'Det som står framför parentesen ska gångras med varje term inuti den.',
      `$${preT}\\cdot ax = ${t1.tex()}$, för $a\\cdot a = a^2$.`,
      `$${preT}\\cdot ${P(b)} = ${t2.tex()}$`+((k<0)!==(b<0)?', för plus gånger minus blir minus.':(k<0&&b<0?', för minus gånger minus blir plus.':'.')),
      `Svar: $${res.tex()}$`,
      `Kontroll med $a = 2$ och $x = 1$: $${k===1?'':k===-1?'-':k+'\\cdot '}2\\cdot(2${plus(b)}) = ${lv}$ och $${sumTex(res.termVals({a:2,x:1}))} = ${lv}$ ✓`,
    ],
    verify:()=>[[2,1],[-1,3],[3,-2]].every(([a,x])=>res.eval({a,x}).eq(k*a*(a*x+b))),
  };
});

def('par-kvad',2,'Kvadrera en produkt',()=>{
  const outside=rand()<0.25;
  const k=outside ? ri(2,5) : nzi(-5,5,[0,1,-1]);
  const e=pick([1,1,1,2]);
  const base=Poly.mono(k,{a:e}), bT=base.tex(), sqv=base.pow(2), res=outside?sqv.neg():sqv;
  const kk=k*k, ak=Math.abs(k);
  const forgot=Poly.mono(outside?-k:k,{a:2*e});
  const forgotMsg = k>0 ? `Glöm inte att kvadrera ${WORD[ak]} också.` : `Glöm inte att kvadrera $${k}$ också: $(${k})^2 = ${kk}$.`;
  const answer = outside
    ? pmc(res,[
        [sqv, 'Minustecknet står utanför parentesen, så det kvadreras inte. Bara det inuti parentesen kvadreras.'],
        [forgot, forgotMsg],
        [Poly.mono(-2*k,{a:2*e}), `Kvadrera betyder gånger sig själv, inte gånger två: $${k}^2 = ${k}\\cdot ${k}$.`],
        [Poly.mono(-kk,{a:e}), `Både talet och $a$ ska kvadreras.`],
      ])
    : pmc(res,[
        [forgot, forgotMsg],
        [sqv.neg(), k<0 ? 'Kolla tecknet. Minus gånger minus blir plus.' : 'En kvadrat kan aldrig bli negativ.'],
        [Poly.mono(2*k,{a:2*e}), `Kvadrera betyder gånger sig själv, inte gånger två: $${P(k)}^2 = ${P(k)}\\cdot ${P(k)}$.`],
        e===2 ? [Poly.mono(kk,{a:3}), 'Potensregeln: $(a^2)^2 = a^2\\cdot a^2 = a^4$.'] : [Poly.mono(kk,{a:1}), 'Både talet och $a$ ska kvadreras: $a\\cdot a = a^2$.'],
      ]);
  const steps = outside ? [
      `Potensen räknas före minustecknet. Minuset står utanför parentesen, så det följer bara med till slut.`,
      `Kvadrera det som står i parentesen, både talet och $a$: $(${bT})^2 = ${sqv.tex()}$`,
      `Talet: $${k}^2 = ${kk}$. Bokstaven: $${e===1?'a\\cdot a = a^2':'a^2\\cdot a^2 = a^4'}$.`,
      `Sätt tillbaka minuset: $-(${bT})^2 = ${res.tex()}$`,
      `Kontroll med $a = 1$: $-(${k})^2 = -${kk}$ och $-${kk}\\cdot 1 = -${kk}$ ✓`,
    ] : [
      'Kvadrera betyder gånger sig själv. Allt inuti parentesen ska kvadreras, både talet och $a$.',
      `$(${bT})^2 = (${bT})\\cdot(${bT})$`,
      `Talet: $${P(k)}^2 = ${kk}$`+(k<0?', för minus gånger minus blir plus.':'.'),
      `Bokstaven: $${e===1?'a\\cdot a = a^2':'a^2\\cdot a^2 = a^4'}$.`,
      `Svar: $${res.tex()}$`,
      `Kontroll med $a = 1$: $(${k})^2 = ${kk}$ och $${kk}\\cdot 1 = ${kk}$ ✓`,
    ];
  return {
    diff: outside||e===2 ? 2 : 1,
    prompt:`Förenkla $${outside?'-':''}(${bT})^2$.`,
    answer, errors:[], steps,
    verify:()=>[1,2,-3].every(a=>res.eval({a}).eq((outside?-1:1)*Math.pow(k*Math.pow(a,e),2))),
  };
});

/* ----- Nivå 3: Rötter och faktorform ----- */
def('rot-faktor',3,'Nollställen ur faktorform',()=>{
  const v=rand(); let fs, diff=1;
  if(v<0.6){ const p=nzi(-7,7); let q; do q=nzi(-7,7); while(q===p); fs=[{a:1,b:p},{a:1,b:q}]; }
  else if(v<0.8){ fs=[{a:1,b:0},{a:1,b:nzi(-8,8)}]; }
  else { const a=pick([2,3]); let b; do b=nzi(-9,9); while(b%a===0 && rand()<0.6); fs=[{a,b},{a:1,b:nzi(-6,6)}]; diff=2; }
  fs=shuffle(fs);
  const roots=fs.map(f=>F(-f.b,f.a));
  if(roots[0].eq(roots[1])) return null;
  const ft=f=>f.b===0&&f.a===1 ? 'x' : '('+poly([f.a,f.b])+')';
  const prod=fs.map(ft).sort((u,w)=>(u==='x'?-1:w==='x'?1:0)).join('');
  const lines=fs.map(f=>{
    const r=F(-f.b,f.a);
    if(f.b===0&&f.a===1) return '$x = 0$ är direkt en lösning.';
    if(f.a===1) return `$${poly([1,f.b])} = 0$ ger $x = ${-f.b}$. Talet byter tecken när det flyttas över.`;
    return `$${poly([f.a,f.b])} = 0$ ger $${f.a}x = ${-f.b}$, alltså $x = ${T(r)}$.`;
  });
  const ctrl=roots.map((r,i)=>{
    const vals=fs.map(f=>r.mul(f.a).add(f.b));
    return `$x = ${T(r)}$ ger $${vals.map(P).join('\\cdot ')} = 0$`;
  }).join(' och ');
  const flipF=fs.find(f=>f.b>0 && f.a===1) || fs.find(f=>f.b!==0);
  const errs=[
    {values:roots.map(r=>r.neg()), msg:`Roten till $${poly([flipF.a,flipF.b])} = 0$ är $x = ${T(F(-flipF.b,flipF.a))}$. Tecknet byts när talet flyttas över.`},
  ];
  const lin=fs.find(f=>f.a!==1);
  if(lin) errs.push({values:fs.map(f=>f===lin?F(-f.b):F(-f.b,f.a)), msg:`$${poly([lin.a,lin.b])} = 0$ ger $${lin.a}x = ${-lin.b}$. Glöm inte att dela med $${lin.a}$.`});
  return {
    diff,
    prompt:`Lös ekvationen $${prod} = 0$.`,
    answer:num(roots,`x_1 = ${T(roots[0])}, \\quad x_2 = ${T(roots[1])}`),
    errors:errs,
    steps:[
      'En produkt är noll bara om någon av faktorerna är noll. Därför sätter vi varje faktor lika med noll (nollproduktmetoden).',
      ...lines,
      `Svar: $x_1 = ${T(roots[0])}$ och $x_2 = ${T(roots[1])}$`,
      `Kontroll: ${ctrl} ✓`,
    ],
    verify:()=>{ const pp=fs.reduce((acc,f)=>acc.mul(Poly.uni([f.a,f.b])),Poly.c(1)); return roots.every(r=>pp.eval({x:r}).isZero()); },
  };
});

def('rot-bygg',3,'Ekvation ur rötter',()=>{
  const r1=nzi(-7,7); let r2; do r2=nzi(-7,7); while(r2===r1);
  const b=-(r1+r2), c=r1*r2, eq=poly([1,b,c]);
  const shown=r1>0?r1:r2>0?r2:r1;
  return {
    diff:(r1<0||r2<0)?2:1,
    prompt:`Skriv ekvationen som har rötterna $x = ${r1}$ och $x = ${r2}$ på formen $x^2 + bx + c = 0$. Ange $b$ och $c$.`,
    answer:num([b,c],`b = ${b}, \\quad c = ${c}`,{ordered:true, hint:'Svara: b; c'}),
    errors:[
      {values:[r1+r2,c], msg:`Roten $x = ${shown}$ ger parentesen $(${poly([1,-shown])})$. Tecknet byts.`},
      {values:[b,-c], msg:`Kolla tecknet på $c$: $${P(-r1)}\\cdot ${P(-r2)} = ${c}$.`},
      {values:[c,b], msg:'Du har bytt plats på $b$ och $c$. $b$ står framför $x$, och $c$ är konstanttermen.'},
      {values:[r1+r2,-c], msg:`Roten $x = ${shown}$ ger parentesen $(${poly([1,-shown])})$. Tecknet byts.`},
    ],
    steps:[
      `Om $x = ${r1}$ är en rot måste parentesen $(${poly([1,-r1])})$ finnas med, för den blir noll när $x = ${r1}$. Tecknet byts.`,
      `På samma sätt ger $x = ${r2}$ parentesen $(${poly([1,-r2])})$.`,
      `Ekvationen är alltså $(${poly([1,-r1])})(${poly([1,-r2])}) = 0$.`,
      `Multiplicera ut: $x$-termen blir $${mono(-r1,'x')}${plusM(-r2,'x')} = ${mono(b,'x')}$ och konstanttermen $${P(-r1)}\\cdot ${P(-r2)} = ${c}$.`,
      `Ekvationen: $${eq} = 0$, alltså $b = ${b}$ och $c = ${c}$.`,
      `Kontroll med $x = ${r1}$: $${subsTex([1,b,c],r1)} = ${sumTex(termVals([1,b,c],r1))} = 0$ ✓`,
    ],
    verify:()=>evalCs([1,b,c],r1).isZero() && evalCs([1,b,c],r2).isZero(),
  };
});

def('rot-andra',3,'Hitta den andra roten',()=>{
  const r1=nzi(-6,6); let r2; do r2=nzi(-7,7); while(r2===r1);
  const b=-(r1+r2), c=r1*r2;
  return {
    diff:2,
    prompt:`Ekvationen $${poly([1,b,c])} = 0$ har roten $x = ${r1}$. Vilken är den andra roten?`,
    answer:num([r2],`x = ${r2}`),
    errors:[
      {values:[r1], msg:`$x = ${r1}$ är roten som redan är given. Frågan gäller den andra.`},
    ],
    steps:[
      `Om rötterna är $${r1}$ och $r$ kan ekvationen skrivas $(${poly([1,-r1])})(x - r) = 0$.`,
      'När man multiplicerar ut blir konstanttermen de två talen i parenteserna gånger varandra. Det blir samma sak som rötterna gånger varandra.',
      `Därför är $${P(r1)}\\cdot r = ${c}$, alltså $r = ${frac(c,r1)} = ${r2}$.`,

/* ----- Nivå 4: pq- och abc-formeln ----- */
function pqLines(p,q){
  p=F(p); q=F(q);
  const h=p.div(2), mh=h.neg(), D=h.mul(h).sub(q), s=sqrtFrac(D);
  return {
    s, roots:[mh.add(s),mh.sub(s)],
    lines:[
      'pq-formeln: $x = -\\frac{p}{2} \\pm \\sqrt{\\left(\\frac{p}{2}\\right)^2 - q}$. Den gäller när $x^2$ står ensamt.',
      `Här är $p = ${T(p)}$ och $q = ${T(q)}$. Tecknen hör till talen.`,
      `$-\\frac{p}{2} = -${frac(T(p),2)} = ${T(mh)}$`+(p.n<0?', för minus gånger minus blir plus.':'.'),
      `Under rottecknet: $${PB(h)}^2${plus(q.neg())} = ${T(h.mul(h))}${plus(q.neg())} = ${T(D)}$`,
      `$\\sqrt{${T(D)}} = ${T(s)}$`,
      `$x = ${T(mh)} \\pm ${T(s)}$, alltså $x_1 = ${T(mh.add(s))}$ och $x_2 = ${T(mh.sub(s))}$`,
    ],
  };
}
const rootCheck=(cs,roots)=>'Kontroll: '+roots.map(r=>`$x = ${T(r)}$ ger $${subsTex(cs,r)} = 0$`).join(' och ')+' ✓';

def('pq',4,'pq-formeln',()=>{
  const r1=nzi(-8,8); let r2; do r2=nzi(-8,8); while(r2===r1);
  const p=-(r1+r2), q=r1*r2, pq=pqLines(p,q);
  return {
    diff:p%2===0?1:2,
    prompt:`Lös ekvationen $${poly([1,p,q])} = 0$.`,
    answer:num([r1,r2],`x_1 = ${T(pq.roots[0])}, \\quad x_2 = ${T(pq.roots[1])}`),
    errors:[
      {values:[-r1,-r2], msg:`Kolla tecknet på $-\\frac{p}{2}$. Här är $p = ${p}$, så $-\\frac{p}{2} = ${T(F(-p,2))}$.`},
    ],
    steps:[...pq.lines, rootCheck([1,p,q],pq.roots)],
    verify:()=>pq.s!==null && sameVals(pq.roots,[F(r1),F(r2)],false) && evalCs([1,p,q],r1).isZero() && evalCs([1,p,q],r2).isZero(),
  };
});

def('pq-dela',4,'Dela med a först',()=>{
  const a=pick([2,3,-1,-2,4,5]);
  const r1=nzi(-6,6); let r2; do r2=nzi(-6,6); while(r2===r1);
  const p=-(r1+r2), q=r1*r2, cs=[a,a*p,a*q], pq=pqLines(p,q);
  const errs=[{values:[-r1,-r2], msg:`Kolla tecknet på $-\\frac{p}{2}$. Efter divisionen är $p = ${p}$, så $-\\frac{p}{2} = ${T(F(-p,2))}$.`}];
  const wrong=pqRootsMaybe(a*p,a*q);
  if(wrong) errs.push({values:wrong, msg:`Du har glömt att dela med $${a}$ först. pq-formeln fungerar bara när $x^2$ står ensamt.`});
  return {
    diff:a<0?3:2,
    prompt:`Lös ekvationen $${poly(cs)} = 0$.`,
    answer:num([r1,r2],`x_1 = ${T(pq.roots[0])}, \\quad x_2 = ${T(pq.roots[1])}`),
    errors:errs,
    steps:[
      `pq-formeln kräver att $x^2$ står ensamt. Dela därför alla termer med $${a}$. Högerledet är $0$, och $0$ delat med $${a}$ är fortfarande $0$.`,
      `$${poly([1,p,q])} = 0$`,
      ...pq.lines.slice(1),
      rootCheck(cs,pq.roots),
    ],
    verify:()=>pq.s!==null && [r1,r2].every(r=>evalCs(cs,r).isZero()) && sameVals(pq.roots,[F(r1),F(r2)],false),
  };
});
function pqRootsMaybe(p,q){
  const h=F(p,2), D=h.mul(h).sub(q); if(D.n<0) return null;
  const s=sqrtFrac(D); if(!s) return null;
  const rs=[h.neg().add(s),h.neg().sub(s)];
  return rs.every(r=>r.d<=2) ? rs : null;
}

def('abc',4,'abc-formeln',()=>{
  const a=pick([2,3]); const r=nzi(-5,5); let s; do s=nzi(-7,7); while(s%a===0);
  const b=-(s+a*r), c=r*s, D=b*b-4*a*c, sq=Math.abs(s-a*r);
  const roots=[F(-b+sq,2*a),F(-b-sq,2*a)];
  return {
    diff:3,
    prompt:`Lös ekvationen $${poly([a,b,c])} = 0$.`,
    answer:num(roots,`x_1 = ${T(roots[0])}, \\quad x_2 = ${T(roots[1])}`),
    errors:[
      {values:roots.map(v=>v.neg()), msg:`Kolla tecknet: formeln börjar med $-b$. Här är $b = ${b}$, så $-b = ${-b}$.`},
      {values:[F(-b+sq,a),F(-b-sq,a)], msg:`Nämnaren är $2a = ${2*a}$, inte $a$.`},
    ],
    steps:[
      `$x^2$ har koefficienten $${a}$. Då kan vi använda abc-formeln direkt: $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$`,
      `Här är $a = ${a}$, $b = ${b}$ och $c = ${c}$.`,
      `Under rottecknet: $${P(b)}^2 - 4\\cdot ${a}\\cdot ${P(c)} = ${b*b}${plus(-4*a*c)} = ${D}$`,
      `$\\sqrt{${D}} = ${sq}$`,
      `$x = ${frac(`${-b} \\pm ${sq}`,2*a)}$`+(b<0?`. Här är $-b = ${-b}$, för minus gånger minus blir plus.`:''),
      `$x_1 = ${frac(-b+sq,2*a)} = ${T(roots[0])}$ och $x_2 = ${frac(-b-sq,2*a)} = ${T(roots[1])}$`,
      rootCheck([a,b,c],roots),
    ],
    verify:()=>isqrt(D)===sq && roots.every(x=>evalCs([a,b,c],x).isZero()) && !roots[0].eq(roots[1]),
  };
});

/* ----- Nivå 5: Definitions- och värdemängd ----- */
const dotMsg=(v,filled)=>filled
  ? `Pricken vid $${v}$ är fylld. Fylld prick betyder att talet är med, alltså $\\le$.`
  : `Pricken vid $${v}$ är ofylld. Ofylld prick betyder att talet inte är med, alltså $<$.`;

def('df-tallinje',5,'Intervall på tallinjen',()=>{
  const asDf=rand()<0.4, q=asDf?'Bilden visar definitionsmängden för en funktion $f$. Vilken är $D_f$?':'Vilken olikhet beskriver den markerade delen av tallinjen?';

      ]),

      steps:[

        `Svar: ${I(lf,rf)}`,

  const dirMsg=dir>0?'Linjen går åt höger, mot större tal. Alltså är $x$ större än talet.':'Linjen går åt vänster, mot mindre tal. Alltså är $x$ mindre än talet.';
  const t=a+3*dir;

    diff:1, prompt:q, fig:numberLineSVG({ray:true,a,filled,dir}),

      {t:I(dir,!filled), msg:dotMsg(a,filled)},
      {t:I(-dir,filled), msg:dirMsg},
      {t:I(-dir,!filled), msg:dirMsg+' Kolla också pricken.'},
    ]),
    errors:[],
