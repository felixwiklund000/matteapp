      `Pricken vid $${a}$ är ${filled?'fylld, så talet är med':'ofylld, så talet är inte med'}.`,
      dirMsg,
      `Svar: ${I(dir,filled)}`,
      `Kontroll: $x = ${t}$ ligger på det markerade, och $${t} ${sym(dir,false)} ${a}$ stämmer ✓`,
    ],
    verify:()=>dir>0?t>a:t<a,
  };
});

def('df-graf',5,'Df och Vf ur graf',()=>{
  const ask=pick(['D','V']), isLin=rand()<0.5;
  let fn,x1,x2,ylo,yhi,loInc,hiInc,ptsY,fTex,vtx=null;
  const lf=rand()<0.6, rf=rand()<0.6;
  if(isLin){
    const k=pick([-2,-1,1,2]); x1=ri(-4,0); x2=x1+ri(3,5);
    const m=ri(-3,3); fn=x=>k*x+m;
    const y1=fn(x1), y2=fn(x2); if(Math.max(Math.abs(y1),Math.abs(y2))>7) return null;
    fTex=poly([k,m]);
    if(y1<y2){ ylo=y1; yhi=y2; loInc=lf; hiInc=rf; } else { ylo=y2; yhi=y1; loInc=rf; hiInc=lf; }
    ptsY=[y1,y2];
  } else {
    const s=pick([1,-1]), h=ri(-2,2); let d1,d2; do{ d1=ri(1,2); d2=ri(1,3); }while(d1===d2);
    const big=Math.max(d1,d2)**2;
    const v = s>0 ? ri(-5,6-big) : ri(-6+big,5);
    if(s>0 && 6-big<-5) return null; if(s<0 && -6+big>5) return null;
    fn=x=>s*(x-h)*(x-h)+v; x1=h-d1; x2=h+d2;
    fTex=Poly.uni([1,-h]).pow(2).mul(s).add(v).tex();
    const farInc = d2>d1 ? rf : lf, farY=v+s*big;
    if(s>0){ ylo=v; loInc=true; yhi=farY; hiInc=farInc; } else { yhi=v; hiInc=true; ylo=farY; loInc=farInc; }
    vtx={x:h,y:v,s};
    ptsY=[fn(x1),fn(x2),v];
  }
  const bd=boundsFor([x1,x2],ptsY);
  const fig=graphSVG({...bd, aria:'Graf till f', curves:[{fn,from:x1,to:x2,cls:'cf'}], dots:[{x:x1,y:fn(x1),filled:lf},{x:x2,y:fn(x2),filled:rf}]});
  const DT=(a,b)=>`$${x1} ${ineq(a)} x ${ineq(b)} ${x2}$`;
  const VT=(a,b)=>`$${ylo} ${ineq(a)} y ${ineq(b)} ${yhi}$`;
  const yEnds=[fn(x1),fn(x2)].sort((a,b)=>a-b);
  let answer, steps;
  if(ask==='D'){
    answer=mc(DT(lf,rf),[
      {t:`$${ylo} ${ineq(lf)} x ${ineq(rf)} ${yhi}$`, msg:'Det där är $y$-värdena. $D_f$ är $x$-värdena, alltså hur långt grafen sträcker sig åt sidorna.'},
      {t:DT(!lf,rf), msg:dotMsg(x1,lf)},
      {t:DT(lf,!rf), msg:dotMsg(x2,rf)},
      {t:DT(!lf,!rf), msg:'Kolla prickarna. Fylld betyder att ändpunkten är med, ofylld att den inte är med.'},
    ]);
    steps=[
      '$D_f$ är alla $x$-värden som grafen har, alltså hur långt den sträcker sig åt vänster och höger.',
      `Grafen börjar vid $x = ${x1}$ med en ${lf?'fylld prick, så $'+x1+'$ är med':'ofylld prick, så $'+x1+'$ är inte med'}.`,
      `Grafen slutar vid $x = ${x2}$ med en ${rf?'fylld prick, så $'+x2+'$ är med':'ofylld prick, så $'+x2+'$ är inte med'}.`,
      `Svar: $D_f$: ${DT(lf,rf)}`,
      `Kontroll: funktionen är $f(x) = ${fTex}$, ritad bara mellan $x = ${x1}$ och $x = ${x2}$. Rakt ovanför eller under varje $x$ där emellan finns graf, men inte utanför ✓`,
    ];
  } else {
    const ds=[
      {t:`$${x1} ${ineq(loInc)} y ${ineq(hiInc)} ${x2}$`, msg:'Det där är $x$-värdena. $V_f$ är $y$-värdena, alltså hur lågt och högt grafen går.'},
      {t:VT(!loInc,hiInc), msg:loInc&&vtx&&vtx.s>0?`Lägsta punkten är vändpunkten $(${vtx.x}, ${vtx.y})$. Den är en vanlig punkt på grafen, så $${ylo}$ är med.`:'Kolla om det lägsta $y$-värdet är med. Titta på pricken där grafen är som lägst.'},
      {t:VT(loInc,!hiInc), msg:hiInc&&vtx&&vtx.s<0?`Högsta punkten är vändpunkten $(${vtx.x}, ${vtx.y})$. Den är en vanlig punkt på grafen, så $${yhi}$ är med.`:'Kolla om det högsta $y$-värdet är med. Titta på pricken där grafen är som högst.'},
    ];
    if(vtx) ds.unshift({t:`$${yEnds[0]} ${ineq(true)} y ${ineq(true)} ${yEnds[1]}$`, msg:`Grafen vänder i $(${vtx.x}, ${vtx.y})$. Där finns det ${vtx.s>0?'minsta':'största'} $y$-värdet, inte vid en ändpunkt.`});
    answer=mc(VT(loInc,hiInc),ds);
    steps=[
      '$V_f$ är alla $y$-värden som grafen antar, alltså hur lågt och hur högt den går.',
      vtx && `Grafen är en parabel som vänder i $(${vtx.x}, ${vtx.y})$. ${vtx.s>0?'Där är den som lägst':'Där är den som högst'}, och den punkten är med.`,
      `Lägsta $y$-värdet är $${ylo}$`+(vtx&&vtx.s>0?' (vändpunkten).':loInc?', och där är pricken fylld, så det är med.':', men där är pricken ofylld, så det är inte med.'),
      `Högsta $y$-värdet är $${yhi}$`+(vtx&&vtx.s<0?' (vändpunkten).':hiInc?', och där är pricken fylld, så det är med.':', men där är pricken ofylld, så det är inte med.'),
      `Svar: $V_f$: ${VT(loInc,hiInc)}`,
      `Kontroll: funktionen är $f(x) = ${fTex}$. Inget $y$-värde på grafen ligger under $${ylo}$ eller över $${yhi}$ ✓`,
    ];
  }
  return {
    diff:isLin?(ask==='D'?1:2):(ask==='D'?2:3),
    prompt:`Grafen visar hela funktionen $f$. Vilken är $${ask==='D'?'D_f':'V_f'}$?`,
    fig, answer, errors:[], steps,
    verify:()=>{ const ys=[]; for(let i=0;i<=200;i++) ys.push(fn(x1+(x2-x1)*i/200)); return Math.abs(Math.min(...ys)-ylo)<1e-9 && Math.abs(Math.max(...ys)-yhi)<1e-9; },
  };
});

/* ----- Nivå 6: f(något) ----- */
function fDef(){
  const p=ri(2,6), q=pick([-1,-2,-3,1,2]);
  return {p,q,f:Poly.uni([q,p,0]), cs:[q,p,0], tex:`${p}x${plusM(q,'x^2')}`};
}
const qPre = q => q===1?'':q===-1?'-':q+'';

def('fn-ka',6,'f(ka): stoppa in ett uttryck',()=>{
  const {p,q,f,cs,tex}=fDef(); const k=pick([-3,-2,2,3,-1]);
  const ka=Poly.mono(k,{a:1}), kaT=ka.tex(), res=f.subst('x',ka);
  const lin=Poly.mono(p*k,{a:1}), sq=Poly.mono(q*k*k,{a:2}), kkA=Poly.mono(k*k,{a:2}).tex();
  const fk=f.eval({x:k}).n;
  return {
    diff:2,
    prompt:`$f(x) = ${tex}$. Bestäm $f(${kaT})$.`,
    answer:pmc(res,[
      [lin.sub(sq), k<0?`Kolla tecknet. $(${kaT})^2 = ${kkA}$, för minus gånger minus blir plus.`:`Kolla tecknet på $a^2$-termen: $${q}\\cdot ${kkA} = ${sq.tex()}$.`],
      Math.abs(k)!==1 && [lin.add(Poly.mono(q*k,{a:2})), `Glöm inte att kvadrera $${k}$ också: $(${kaT})^2 = ${kkA}$.`],
      [lin.neg().add(sq), `Kolla tecknet på första termen: $${p}\\cdot(${kaT}) = ${lin.tex()}$.`],
      [lin.add(Poly.mono(q*k*k,{a:1})), 'Både talet och $a$ ska kvadreras: $a\\cdot a = a^2$.'],
      [lin.neg().sub(sq), 'Kolla tecknen i båda termerna.'],
    ]),
    errors:[],
    steps:[
      `Vi byter ut varje $x$ mot $(${kaT})$, för $f(\\text{något})$ betyder att man stoppar in det där något i stället för $x$.`,
      `$f(${kaT}) = ${p}\\cdot(${kaT})${q<0?' - ':' + '}${Math.abs(q)===1?'':Math.abs(q)+'\\cdot '}(${kaT})^2$`,
      `Kvadrera både talet och $a$: $(${kaT})^2 = ${kkA}$`+(k<0?', för minus gånger minus blir plus.':'.'),
      `$${p}\\cdot(${kaT}) = ${lin.tex()}$ och $${q}\\cdot ${kkA} = ${sq.tex()}$`,
      `Svar: $f(${kaT}) = ${res.tex()}$`,
      `Kontroll med $a = 1$: då är $${kaT} = ${k}$, och $f(${k}) = ${subsTex([p,0],k)}${q<0?' - ':' + '}${Math.abs(q)===1?'':Math.abs(q)+'\\cdot '}${PB(k)}^2 = ${fk}$. Vårt svar ger $${sumTex(res.termVals({a:1}))} = ${fk}$ ✓`,
    ],
    verify:()=>[1,2,-1].every(a=>res.eval({a}).eq(evalCs(cs,k*a))) && res.eval({a:1}).eq(fk),
  };
});

def('fn-xk',6,'f(x + k)',()=>{
  const {p,q,f,cs,tex}=fDef(); const k=pick([1,2,3,-1,-2]);
  const sub=X().add(k), sT=sub.tex(), res=f.subst('x',sub), sqr=sub.pow(2);
  const fk=evalCs(cs,k).n;
  return {
    diff:q===1?2:3,
    prompt:`$f(x) = ${tex}$. Bestäm $f(${sT})$ och förenkla.`,
    answer:pmc(res,[
      [sub.mul(p).add(Poly.uni([1,0,k*k]).mul(q)), `Kvadreringsregeln: $(${sT})^2 = ${sqr.tex()}$. Glöm inte dubbla produkten $${mono(2*k,'x')}$.`],
      [f.add(k), `$f(${sT})$ betyder att varje $x$ byts mot $(${sT})$. Det är inte samma sak som $f(x)${plus(k)}$.`],
      q!==1 && [sub.mul(p).add(Poly.uni([q,0,0])).add(Poly.uni([2*k,k*k]).mul(q<0?-q:1)), q<0?`Minustecknet framför ska gångras med hela kvadraten: $${q}(${sqr.tex()}) = ${sqr.mul(q).tex()}$.`:`Gångra in $${q}$ i alla termer: $${q}(${sqr.tex()}) = ${sqr.mul(q).tex()}$.`],
      q!==1 && [sub.mul(p).add(sqr), `Glöm inte att gångra kvadraten med $${q}$.`],
      [sub.mul(p).sub(sqr.mul(q)), 'Kolla tecknet framför kvadrattermen.'],
    ]),
    errors:[],
    steps:[
      `Vi byter ut varje $x$ mot $(${sT})$, för $f(\\text{något})$ betyder att man stoppar in det där något i stället för $x$.`,
      `$f(${sT}) = ${p}(${sT})${q<0?' - ':' + '}${Math.abs(q)===1?'':Math.abs(q)}(${sT})^2$`,
      `Kvadreringsregeln: $(${sT})^2 = ${sqr.tex()}$`,
      `$${qPre(q)}(${sqr.tex()}) = ${sqr.mul(q).tex()}$`+(q<0?'. Minustecknet gäller alla termer i parentesen.':''),
      `$${p}(${sT}) = ${sub.mul(p).tex()}$`,
      `Lägg ihop termer av samma sort: $f(${sT}) = ${res.tex()}$`,
      `Kontroll med $x = 0$: $f(0${plus(k)}) = f(${k}) = ${subsTex(cs,k)} = ${fk}$. Vårt svar ger också $${fk}$ när $x = 0$ ✓`,
    ],
    verify:()=>[0,1,-2,3].every(x=>res.eval({x}).eq(evalCs(cs,x+k))) && res.eval({x:0}).eq(fk),
  };
});

def('fn-ff',6,'f(f(x))',()=>{
  const {p,q,cs,tex}=fDef(); const t=pick([1,2,-1,3,-2]);
  const u=evalCs(cs,t).n; if(u===0||Math.abs(u)>7) return null;
  const w=evalCs(cs,u).n;
  return {
    diff:2,
    prompt:`$f(x) = ${tex}$. Beräkna $f(f(${t}))$.`,
    answer:num([w],`f(f(${t})) = ${w}`),
    errors:[
      {values:[u], msg:`Du har räknat ut $f(${t}) = ${u}$. Nu ska det svaret stoppas in i $f$ igen.`},
      {values:[u*u], msg:`$f(f(${t}))$ är inte $f(${t})$ i kvadrat. Stoppa in $${u}$ i $f$.`},
    ],
    steps:[
      `Räkna inifrån och ut, precis som med parenteser: först $f(${t})$, sedan $f$ av det svaret.`,
      `$f(${t}) = ${subsTex(cs,t)} = ${sumTex(termVals(cs,t))} = ${u}$`,
      `Nu stoppar vi in $${u}$ i $f$: $f(${u}) = ${subsTex(cs,u)} = ${sumTex(termVals(cs,u))} = ${w}$`,
      `Svar: $f(f(${t})) = ${w}$`,
      `Kontroll på ett annat sätt: $f(x) = x(${p}${plusM(q,'x')})$, så $f(${u}) = ${P(u)}\\cdot ${P(p+q*u)} = ${w}$ ✓`,
    ],
    verify:()=>u*(p+q*u)===w && Poly.uni(cs).subst('x',Poly.uni(cs)).eval({x:t}).eq(w),
  };
});

/* ----- Nivå 7: Hitta konstanten ----- */
def('k-lin',7,'Bestäm k i linjär funktion',()=>{
  const x0=nzi(-5,5); let k=F(nzi(-4,5)), diff=1;
  if(Math.abs(x0)>=2 && Math.abs(x0)<=4 && rand()<0.35){ k=F(nzi(-5,5),Math.abs(x0)); if(!k.isInt()) diff=2; }
  const m=nzi(-8,8), y0=k.mul(x0).add(m).n, r=y0-m;
  return {
    diff,
    prompt:`$f(x) = kx${plus(m)}$ och $f(${x0}) = ${y0}$. Bestäm $k$.`,
    answer:num([k],`k = ${T(k)}`),
    errors:[
      {values:[F(y0+m,x0)], msg:`Kolla tecknet när du flyttar över $${m}$. Den byter tecken när den byter sida.`},
      {values:[F(y0,x0)], msg:`Glöm inte konstanttermen $${m}$. Den måste flyttas över innan du delar.`},
      r!==0 && {values:[F(x0,r)], msg:'Bråket blev upp och ner. Det är $k$ som ska stå ensamt, så dela med talet framför $k$.'},
    ],
    steps:[
      `$f(${x0}) = ${y0}$ betyder att när vi sätter in $x = ${x0}$ blir det $${y0}$.`,
      `$k\\cdot ${P(x0)}${plus(m)} = ${y0}$, alltså $${mono(x0,'k')}${plus(m)} = ${y0}$`,
      `${m>0?'Dra bort':'Lägg till'} $${Math.abs(m)}$ på båda sidor, så att $k$-termen står ensam: $${mono(x0,'k')} = ${r}$`,
      `Dela med $${x0}$: $k = ${frac(r,x0)} = ${T(k)}$`,
      `Kontroll: $f(x) = ${Poly.uni([k,m]).tex()}$ ger $f(${x0}) = ${T(k)}\\cdot ${P(x0)}${plus(m)} = ${T(k.mul(x0))}${plus(m)} = ${y0}$ ✓`,
    ],
    verify:()=>Poly.uni([k,m]).eval({x:x0}).eq(y0),
  };
});

def('k-kvad',7,'Bestäm konstanttermen k',()=>{
  const a=pick([1,2,-1,3]), b=nzi(-5,5), x0=nzi(-3,3), k=nzi(-9,9);
  const tv=termVals([a,b,0],x0), S=a*x0*x0+b*x0, y0=S+k, sq=x0*x0;
  return {
    diff:x0<0?2:1,
    prompt:`$g(x) = ${poly([a,b,0])} + k$ och $g(${x0}) = ${y0}$. Bestäm $k$.`,
    answer:num([k],`k = ${k}`),
    errors:[
      {values:[y0+S], msg:`När $${S}$ flyttas över till andra sidan byter den tecken.`},
      x0<0 && {values:[y0-(-a*sq+b*x0)], msg:`Kolla tecknet. $(${x0})^2 = ${sq}$, för minus gånger minus blir plus.`},
      {values:[y0-(a*sq-b*x0)], msg:`Kolla tecknet på $${b}\\cdot ${P(x0)}$. Det blir $${b*x0}$.`},
    ],
    steps:[
      `$g(${x0}) = ${y0}$ betyder att när vi sätter in $x = ${x0}$ blir det $${y0}$.`,
      `$${subsTex([a,b,0],x0)} + k = ${y0}$`,
      x0<0 ? `$(${x0})^2 = ${sq}$, för minus gånger minus blir plus. Då blir det $${sumTex(tv)} + k = ${y0}$.` : `Räkna ut: $${sumTex(tv)} + k = ${y0}$.`,
      S===0 ? `Alltså $k = ${y0}$.` : `Alltså $${S} + k = ${y0}$. ${S>0?'Dra bort':'Lägg till'} $${Math.abs(S)}$ på båda sidor: $k = ${y0}${plus(-S)} = ${k}$`,
      `Kontroll: $g(${x0}) = ${sumTex(tv)}${plus(k)} = ${y0}$ ✓`,
    ],
    verify:()=>Poly.uni([a,b,k]).eval({x:x0}).eq(y0),
  };
});

def('k-tva',7,'Bestäm b ur två punkter',()=>{
  const b=nzi(-6,6), c=ri(-6,6), y1=1+b+c, y2=1-b+c;
  return {
    diff:3,
    prompt:`$f(x) = x^2 + bx + c$, $f(1) = ${y1}$ och $f(-1) = ${y2}$. Bestäm $b$.`,
    answer:num([b],`b = ${b}`),
    errors:[
      {values:[y1-y2], msg:`Det är $2b$ som är $${y1-y2}$. Dela med $2$.`},
    ],
    steps:[
      'Sätt in $x = 1$ och $x = -1$. Kom ihåg att $(-1)^2 = 1$ och $b\\cdot(-1) = -b$.',
      `$1 + b + c = ${y1}$ och $1 - b + c = ${y2}$`,
      'Ta första ekvationen minus den andra. Då försvinner både $1$ och $c$, för de finns i båda.',
      `$2b = ${y1}${plus(-y2)} = ${y1-y2}$`,
      `$b = ${frac(y1-y2,2)} = ${b}$`,
      `Kontroll: då är $c = ${y1} - 1${plus(-b)} = ${c}$, och $f(-1) = 1${plus(-b)}${plus(c)} = ${y2}$ ✓`,
    ],
    verify:()=>Poly.uni([1,b,c]).eval({x:1}).eq(y1) && Poly.uni([1,b,c]).eval({x:-1}).eq(y2),
  };
});

/* ----- Nivå 8: Två grafer ----- */
function twoGraphs(){
  for(let i=0;i<80;i++){
    const k=pick([-2,-1,0,1,2]), m=ri(-3,3), x1=ri(-4,2), x2=x1+pick([2,3,4]), s=pick([1,-1]);
    const g=Poly.uni([k,m]), f=g.add(Poly.uni([1,-x1-x2,x1*x2]).mul(s));
    const xa=x1-1.5, xb=x2+1.5; let ok=true; const ys=[];
    for(let x=xa;x<=xb+1e-9;x+=0.25){ const a=f.evalNum({x}), b=g.evalNum({x}); ys.push(a,b); if(Math.abs(a)>7||Math.abs(b)>7) ok=false; }
    if(!ok) continue;
    const bd=boundsFor([xa,xb],ys);
    const fy=x=>f.evalNum({x}), gy=x=>g.evalNum({x});
    const fig=graphSVG({...bd, aria:'Graferna till f och g', curves:[
      {fn:fy,from:xa,to:xb,cls:'cf',label:'f',lcls:'lf',lx:xb+0.35,ly:fy(xb)+(fy(xb)>gy(xb)?0.4:-0.6)},
      {fn:gy,from:xa,to:xb,cls:'cg',label:'g',lcls:'lg',lx:xa-0.35,ly:gy(xa)+(gy(xa)>fy(xa)?0.4:-0.6)},
    ]});
    return {k,m,x1,x2,s,f,g,fig};
  }
  return null;
}

def('graf-skar',8,'Läs av f(x) = g(x)',()=>{
  const G=twoGraphs(); if(!G) return null;
  const {x1,x2,f,g,fig}=G, y1=g.eval({x:x1}).n, y2=g.eval({x:x2}).n;
  return {
    diff:1, fig,
    prompt:'Figuren visar en parabel $f$ och en rät linje $g$. Lös ekvationen $f(x) = g(x)$.',
    answer:num([x1,x2],`x_1 = ${x1}, \\quad x_2 = ${x2}`),
    errors:[
      !(y1===x1&&y2===x2) && !(y1===x2&&y2===x1) && {values:[y1,y2], msg:'Det där är $y$-värdena. Frågan gäller $x$-värdena där graferna skär varandra.'},
    ],
    steps:[
      'Där $f(x) = g(x)$ har graferna samma $y$-värde. Det är där de skär varandra.',
      `Graferna skär varandra i punkterna $(${x1}, ${y1})$ och $(${x2}, ${y2})$.`,
      'Vi svarar med $x$-värdena, för frågan gäller vilka $x$ som gör $f(x)$ och $g(x)$ lika.',
      `Svar: $x_1 = ${x1}$ och $x_2 = ${x2}$`,
      `Kontroll: graferna är $f(x) = ${f.tex()}$ och $g(x) = ${g.tex()}$. $f(${x1}) = ${y1} = g(${x1})$ och $f(${x2}) = ${y2} = g(${x2})$ ✓`,
    ],
    verify:()=>f.eval({x:x1}).eq(y1) && f.eval({x:x2}).eq(y2),
  };
});

def('graf-olikhet',8,'Läs av f(x) > g(x)',()=>{
  const G=twoGraphs(); if(!G) return null;
  const {x1,x2,s,f,g,fig}=G;
  const rel=pick(['>','<','>','<','\\ge','\\le']);
  const greater=rel==='>'||rel==='\\ge', strict=rel==='>'||rel==='<';
  const outside=greater===(s===1);
  const R=(out,st)=>out ? `$x ${st?'<':'\\le'} ${x1}$ eller $x ${st?'>':'\\ge'} ${x2}$` : `$${x1} ${st?'<':'\\le'} x ${st?'<':'\\le'} ${x2}$`;
  const regMsg=`$f(x) ${rel} g(x)$ betyder att grafen för $f$ ligger ${greater?'ovanför':'under'} grafen för $g$. Titta var det gäller.`;
  const stMsg=strict ? 'Olikheten är strikt. I skärningspunkterna är $f(x) = g(x)$, så de ska inte vara med.'
                     : 'Med $\\ge$ eller $\\le$ ska skärningspunkterna vara med, för där är $f(x) = g(x)$.';
  const tp=outside ? x1-1 : x1+1;
  const fv=f.eval({x:tp}).n, gv=g.eval({x:tp}).n;
  return {
    diff:strict?2:3, fig,
    prompt:`Figuren visar en parabel $f$ och en rät linje $g$. För vilka $x$ gäller $f(x) ${rel} g(x)$?`,
    answer:mc(R(outside,strict),[
      {t:R(!outside,strict), msg:regMsg},
      {t:R(outside,!strict), msg:stMsg},
      {t:R(!outside,!strict), msg:regMsg},
    ]),
    errors:[],
    steps:[
      `Först skärningspunkterna: graferna skär varandra vid $x = ${x1}$ och $x = ${x2}$. Där är $f(x) = g(x)$.`,
      `$f(x) ${rel} g(x)$ betyder att parabeln $f$ ligger ${greater?'ovanför':'under'} linjen $g$${strict?'':', eller skär den'}.`,
      `Det gäller ${outside?`till vänster om $x = ${x1}$ och till höger om $x = ${x2}$`:`mellan $x = ${x1}$ och $x = ${x2}$`}.`,
      strict ? 'Olikheten är strikt, så skärningspunkterna är inte med.' : 'Likhetstecknet i olikheten gör att skärningspunkterna är med.',
      `Svar: ${R(outside,strict)}`,
      `Kontroll med $x = ${tp}$: $f(${tp}) = ${fv}$ och $g(${tp}) = ${gv}$, och $${fv} ${fv>gv?'>':'<'} ${gv}$ stämmer ✓`,
    ],
    verify:()=>{ const d=f.sub(g).eval({x:tp}).num(); return greater ? d>0 : d<0; },
  };
});

/* ----- Nivå 9: Modellering ----- */
function model(){
  const W=pick([6,8,10,12,14,16,18,20,24,28]), kind=pick(['ranna','hage']);
  const u=kind==='ranna'?'dm':'m';
  const text = kind==='ranna'
    ? `En ${W} dm bred plåt viks upp $x$ dm på varje sida så att det blir en ränna. Tvärsnittet är en rektangel.`
    : `Du har ${W} m staket och ska bygga en rektangulär hage mot en lång vägg. Väggen är den fjärde sidan. De två sidorna som går ut från väggen är $x$ m var.`;
  const fig = kind==='ranna' ? rannaSVG(W) : hageSVG(W);
  const A=Poly.uni([-2,W,0]), xm=F(W,4), max=A.eval({x:xm});
  const what = kind==='ranna' ? 'tvärsnittsarean' : 'hagens area';
  const bottom = kind==='ranna' ? 'bottnen' : 'sidan längs väggen';
  return {W,kind,u,text,fig,A,xm,max,what,bottom};
}
const unit2 = u => `\\text{ ${u}}^2`;

def('mod-formel',9,'Ställ upp en modell',()=>{
  const M=model(), W=M.W;
  return {
    diff:1, fig:M.fig,
    prompt:`${M.text} Vilken formel ger ${M.what} $A(x)$?`,
    answer:mc(`$A(x) = x(${W} - 2x)$`,[
      {t:`$A(x) = x(${W} - x)$`, msg:`Det viks upp på båda sidor, så ${M.bottom} blir $${W} - 2x$.`},
      {t:`$A(x) = 2x(${W} - 2x)$`, msg:`Arean är höjd gånger bredd. Höjden är $x$, inte $2x$.`},
      {t:`$A(x) = (${W} - x)(${W} - 2x)$`, msg:'Ena sidan är $x$. Det är den som ska gångras med den andra sidan.'},
      {t:`$A(x) = 2x + (${W} - 2x)$`, msg:'Arean är sida gånger sida, inte summan av sidorna.'},
    ]),
    errors:[],
    steps:[
      'Rektangelns area är sida gånger sida.',
      `Den ena sidan är $x$.`,
      `Av de $${W}$ ${M.u} går $x$ till varje sida, alltså $2x$ totalt. Kvar till ${M.bottom} blir $${W} - 2x$.`,
      `Svar: $A(x) = x(${W} - 2x)$`,
      `Kontroll med $x = 1$: sidorna blir $1$ och $${W-2}$, arean $${W-2}$. Formeln ger $1\\cdot(${W} - 2) = ${W-2}$ ✓`,
    ],
    verify:()=>M.A.eval({x:1}).eq(W-2),
  };
});

def('mod-varde',9,'Räkna med modellen',()=>{
  const M=model(), W=M.W, c=ri(1,W/2-1), v=c*(W-2*c);
  return {
    diff:1, fig:M.fig,
    prompt:`${M.text} ${M.what[0].toUpperCase()+M.what.slice(1)} är $A(x) = x(${W} - 2x)$. Beräkna $A(${c})$.`,
    answer:num([v],`A(${c}) = ${v}${unit2(M.u)}`),
    errors:[{values:[c*(W-c)], msg:`Det ska vara $${W} - 2\\cdot ${c}$, inte $${W} - ${c}$.`}, {values:[c*W-2*c], msg:'Räkna parentesen först, sedan gånger.'}],
    steps:[
      `Sätt in $x = ${c}$ i formeln.`,
      `Parentesen först: $${W} - 2\\cdot ${c} = ${W-2*c}$`,
      `$A(${c}) = ${c}\\cdot ${W-2*c} = ${v}$`,
      `Kontroll: sidorna blir $${c}$ och $${W-2*c}$ ${M.u}, och $${c} + ${c} + ${W-2*c} = ${W}$ ${M.u} som det ska ✓`,
    ],
    verify:()=>M.A.eval({x:c}).eq(v),
  };
});

def('mod-df',9,'Df för en modell',()=>{
  const M=model(), W=M.W, h=W/2;
  return {
    diff:2, fig:M.fig,
    prompt:`${M.text} ${M.what[0].toUpperCase()+M.what.slice(1)} är $A(x) = x(${W} - 2x)$. Vilken är definitionsmängden?`,
    answer:mc(`$0 < x < ${h}$`,[
      {t:`$0 \\le x \\le ${h}$`, msg:`När $x = 0$ eller $x = ${h}$ blir arean $0$. Då finns ingen ${M.kind==='ranna'?'ränna':'hage'}, så ändpunkterna är inte med.`},
      {t:`$0 < x < ${W}$`, msg:`Det går åt $2x$, och det får inte bli mer än $${W}$. Alltså $x < ${h}$.`},
      {t:`$0 < x < ${T(M.xm)}$`, msg:`$x = ${T(M.xm)}$ är där arean är störst, inte gränsen för $x$.`},
    ]),
    errors:[],
    steps:[
      '$D_f$ är de $x$ som är möjliga i verkligheten.',
      `$x$ är en längd, så $x > 0$.`,
      `${M.bottom[0].toUpperCase()+M.bottom.slice(1)} $${W} - 2x$ måste också vara större än $0$. Det ger $2x < ${W}$, alltså $x < ${h}$.`,
      `Svar: $0 < x < ${h}$`,
      `Kontroll: $x = ${h}$ ger $A = ${h}\\cdot 0 = 0$ (ingen area) och $x = 1$ ger $A = ${W-2}$ (fungerar) ✓`,
    ],
    verify:()=>M.A.eval({x:h}).isZero() && M.A.eval({x:0}).isZero(),
  };
});

def('mod-max',9,'Största värdet',()=>{
  const M=model(), W=M.W, h=W/2, xm=M.xm, max=M.max;
  const [na,nb]=xm.isInt()?[xm.n-1,xm.n+1]:[Math.floor(xm.num()),Math.ceil(xm.num())];
  const Aa=M.A.eval({x:na}).n, Ab=M.A.eval({x:nb}).n;
  return {
    diff:2, fig:M.fig,
    prompt:`${M.text} ${M.what[0].toUpperCase()+M.what.slice(1)} är $A(x) = x(${W} - 2x)$. Hur stor kan arean bli som mest?`,

def('koef',10,'Koefficientjämförelse',()=>{
  if(rand()<0.5){
    const a=pick([1,1,2,3]); const b= a===1 ? F(nzi(-5,5),2) : F(nzi(-4,4));
    const A=a*a, B=b.mul(a+1);
    const f=Poly.uni([a,b]), ff=f.subst('x',f);
    return {
      diff:3,
      prompt:`$f(x) = ax + b$${A!==1?' där $a > 0$':''}, och $f(ax + b) = ${poly([A,B])}$. Bestäm $a$ och $b$.`,
      answer:num([a,b],`a = ${a}, \\quad b = ${T(b)}`,{ordered:true, hint:'Svara: a; b'}),
      errors:[
        {values:[b,a], msg:'Ordningen: skriv först $a$, sedan $b$.'},
        {values:[a,B], msg:'Konstanttermen är $ab + b$, inte bara $b$.'},
      ],
      steps:[
        '$f(ax + b)$ betyder att vi stoppar in $(ax + b)$ i stället för $x$ i $f(x) = ax + b$.',
        '$f(ax + b) = a(ax + b) + b = a^2x + ab + b$',
        `Det ska vara lika med $${poly([A,B])}$ för alla $x$. Det går bara om talen framför $x$ är lika och konstanttermerna är lika (koefficientjämförelse).`,
        `$x$-termen: $a^2 = ${A}$, så $a = ${a}$`+(A===1?` eller $a = -1$. Men $a = -1$ ger konstanttermen $-b + b = 0$, inte $${T(B)}$. Alltså $a = 1$.`:` (vi ska ha $a > 0$).`),
        `Konstanttermen: $ab + b = ${T(B)}$. Med $a = ${a}$ blir det $${a+1}b = ${T(B)}$, alltså $b = ${frac(T(B),a+1)} = ${T(b)}$.`,
        `Kontroll: $f(x) = ${f.tex()}$ ger $f(${f.tex()}) = ${a===1?'':a}(${f.tex()})${plus(b)} = ${ff.tex()}$ ✓`,
      ],
      verify:()=>ff.eq(Poly.uni([A,B])) && a>0,
    };
  }
  const b=nzi(-5,5), c=nzi(-6,6), h=pick([1,2,-1]);
  const g=Poly.uni([1,b,c]), s=Poly.uni([1,h]), gs=g.subst('x',s);
  const B=2*h+b, C=h*h+b*h+c;
  return {
    diff:3,
    prompt:`$g(x) = x^2 + bx + c$ och $g(${s.tex()}) = ${gs.tex()}$. Bestäm $b$ och $c$.`,
    answer:num([b,c],`b = ${b}, \\quad c = ${c}`,{ordered:true, hint:'Svara: b; c'}),
    errors:[{values:[c,b], msg:'Ordningen: skriv först $b$, sedan $c$.'}, {values:[B,C], msg:`Det där är koefficienterna i $g(${s.tex()})$. Du ska hitta dem i $g(x)$.`}],
    steps:[
      `Byt varje $x$ mot $(${s.tex()})$: $g(${s.tex()}) = (${s.tex()})^2 + b(${s.tex()}) + c$`,
      `$= ${s.pow(2).tex()} + bx${plusM(h,'b')} + c$`,
      `Samla termerna: $x$-termen är $(${2*h} + b)x$ och konstanttermen är $${h*h}${plusM(h,'b')} + c$.`,
      `Jämför med $${gs.tex()}$, för talen framför $x$ och konstanttermerna måste vara lika (koefficientjämförelse).`,
      `$${2*h} + b = ${B}$, alltså $b = ${b}$.`,
      `$${h*h}${plusM(h,'b')} + c = ${C}$. Med $b = ${b}$ blir det $${h*h}${plus(h*b)} + c = ${C}$, alltså $c = ${c}$.`,
      `Kontroll: $g(x) = ${g.tex()}$. Då är $g(${h}) = ${subsTex([1,b,c],h)} = ${C}$, samma som konstanttermen i $g(${s.tex()})$ när $x = 0$ ✓`,
    ],
    verify:()=>g.subst('x',s).eq(Poly.uni([1,B,C])) && g.eval({x:h}).eq(C),
  };
});

def('elever',10,'Två elevers fel',()=>{
  const r1=nzi(-6,6); let r2; do r2=nzi(-6,6); while(r2===r1);
  const S=r1+r2, Pr=r1*r2;
  const ds=shuffle([1,2,3,-1,-2,-3]).filter(d=>d!==r2-r1 && r1+d!==r2-d && r1+d!==0 && r2-d!==0);
  if(!ds.length) return null;
  const d=ds[0], s1=r1+d, s2=r2-d;
  const pairs=[];
  for(let t=-Math.abs(Pr);t<=Math.abs(Pr);t++){
    if(t===0||Pr%t!==0) continue; const u=Pr/t;
    if(t<=u && t+u!==S && !(t===s1&&u===s2) && !(t===s2&&u===s1)) pairs.push([t,u]);
  }
  if(!pairs.length) return null;
  const [t1,t2]=pick(pairs);
  const [A,B]=shuffle(NAMES).slice(0,2);
  const askRoots=rand()<0.5;
  const pA=-S, qA=s1*s2, pB=-(t1+t2);
  const steps=[
    `${A} skrev bara av $q$ fel. Då är ${A}s $p$ rätt.`,
    `${A}s rötter ger $(${poly([1,-s1])})(${poly([1,-s2])}) = ${poly([1,pA,qA])}$, alltså $p = ${pA}$.`,
    `${B} skrev bara av $p$ fel. Då är ${B}s $q$ rätt.`,
    `${B}s rötter ger $(${poly([1,-t1])})(${poly([1,-t2])}) = ${poly([1,pB,Pr])}$, alltså $q = ${Pr}$.`,
    `Den rätta ekvationen är $${poly([1,pA,Pr])} = 0$.`,
  ];
  if(askRoots) steps.push(`Vi söker två tal med summan $${S}$ och produkten $${Pr}$, för då blir parenteserna rätt: $(${poly([1,-r1])})(${poly([1,-r2])}) = 0$. Rötterna är $x = ${r1}$ och $x = ${r2}$.`);
  steps.push(rootCheck([1,pA,Pr],[F(r1),F(r2)]));
  return {
    diff:askRoots?3:2,
    prompt:`${A} och ${B} skulle lösa samma ekvation $x^2 + px + q = 0$. ${A} skrev av $q$ fel och fick rötterna $${s1}$ och $${s2}$. ${B} skrev av $p$ fel och fick rötterna $${t1}$ och $${t2}$. ${askRoots?'Vilka är de rätta rötterna?':'Bestäm $p$ och $q$.'}`,
    answer: askRoots ? num([r1,r2],`x_1 = ${r1}, \\quad x_2 = ${r2}`) : num([pA,Pr],`p = ${pA}, \\quad q = ${Pr}`,{ordered:true,hint:'Svara: p; q'}),
    errors: askRoots ? [
      {values:[s1,s2], msg:`Det är ${A}s rötter. ${A} skrev av $q$ fel, så de stämmer inte.`},
      {values:[t1,t2], msg:`Det är ${B}s rötter. ${B} skrev av $p$ fel, så de stämmer inte.`},
    ] : [
      {values:[pA,qA], msg:`Det är ${A}s ekvation. ${A}s $p$ är rätt, men $q$ ska tas från ${B}.`},
      {values:[pB,Pr], msg:`Det är ${B}s ekvation. ${B}s $q$ är rätt, men $p$ ska tas från ${A}.`},
      {values:[Pr,pA], msg:'Ordningen: skriv först $p$, sedan $q$.'},
    ],
    steps,
    verify:()=>evalCs([1,pA,Pr],r1).isZero() && evalCs([1,pA,Pr],r2).isZero()
      && evalCs([1,pA,qA],s1).isZero() && evalCs([1,pA,qA],s2).isZero()
      && evalCs([1,pB,Pr],t1).isZero() && evalCs([1,pB,Pr],t2).isZero() && qA!==Pr && pB!==pA,
  };
});

const UND={varfor:'Varför-steget', fraga:'Vad frågar de efter?', felet:'Hitta felet', ordna:'Ordna stegen',

function defU(id,level,kind,card,name,gen){ TYPES[id]={id,level,name,gen,und:kind,card}; }
function mcFixed(opts,lines){ return {kind:'mc', fixed:true, lines:!!lines, options:opts.map(o=>({t:o.t, ok:!!o.ok, msg:o.msg||null, h:o.h||null}))}; }
function mcOpts(opts){ return {kind:'mc', options:shuffle(opts.map(o=>({t:o.t, ok:!!o.ok, msg:o.msg||null, h:o.h||null})))}; }
function order(items){ let start; do start=shuffle(items.map((_,i)=>i)); while(start.every((v,i)=>v===i)); return {kind:'order', items, start}; }
function feletAns(lines,err){
  return mcFixed(lines.map((l,i)=>({t:l, ok:i===err,
    msg: i<err ? (i===0?'Rad 1 är uppgiften, och den stämmer.':`Rad ${i+1} stämmer. Leta längre ned.`)
               : `Rad ${i+1} är fel, men felet började tidigare. Leta efter den första raden som inte stämmer.`})), true);
}
function tableHTML(xs,ys){
  return `<table class="vt"><tr><th><i>x</i></th>${xs.map(x=>`<td>${mt(x)}</td>`).join('')}</tr><tr><th><i>f</i>(<i>x</i>)</th>${ys.map(y=>`<td>${mt(y)}</td>`).join('')}</tr></table>`;
}
const miniGraph = fn => graphSVG({xmin:-4,xmax:4,ymin:-5,ymax:5,mini:true,aria:'Graf',curves:[{fn,from:-4,to:4,cls:'cf'}]});
const qTerm = (q,body) => (q<0?' - ':' + ')+(Math.abs(q)===1?'':Math.abs(q))+body;   // " - 2(x+1)^2"

defU('u-felet-kvadregel',2,'felet','kvadreringsregeln','Kvadreringsregeln',()=>{
  const k=nzi(-5,5), v=pick([1,2]), s=poly([1,k]), sq=Poly.uni([1,2*k,k*k]), right=Poly.uni([2*k,k*k]);
  const lines=[`$(${s})^2 - x^2$`];
  if(v===1) lines.push(`$= x^2${plus(k*k)} - x^2$`, `$= ${k*k}$`);
  else lines.push(`$= ${sq.tex()} - x^2$`, `$= ${mono(2*k,'x')}$`);
  const val=(1+k)*(1+k)-1;
  return {
    diff:v, prompt:`Någon har förenklat $(${s})^2 - x^2$. På vilken rad blir det fel först?`,
    answer:feletAns(lines,v),
    steps:[
      v===1 ? `Rad 2 är fel: $(${s})^2$ är inte $x^2${plus(k*k)}$. Kvadreringsregeln ger också dubbla produkten $${mono(2*k,'x')}$.`
            : `Rad 3 är fel: konstanttermen $${k*k}$ försvann. Det är bara $x^2$-termerna som tar ut varandra.`,
      `$(${s})^2 = (${s})(${s}) = ${sq.tex()}$`,
      `Rätt svar: $${right.tex()}$`,
      `Kontroll med $x = 1$: $(1${plus(k)})^2 - 1 = ${val}$ och $${sumTex(right.termVals({x:1}))} = ${val}$ ✓`,
    ],
    verify:()=>sq.sub(Poly.uni([1,0,0])).eq(right) && right.eval({x:1}).eq(val),
  };
});

defU('u-felet-distributiv',2,'felet','distributiv','Multiplicera in',()=>{
  const k=ri(2,5), m=ri(1,6), x0=ri(-3,6), n=k*(x0-m), v=pick([1,2]);
  const lines=[`$${k}(x - ${m}) = ${n}$`];
  if(v===1) lines.push(`$${k}x - ${m} = ${n}$`, `$${k}x = ${n+m}$`, `$x = ${frac(n+m,k)}$`);
  else lines.push(`$${k}x - ${k*m} = ${n}$`, `$${k}x = ${n-k*m}$`, `$x = ${frac(n-k*m,k)}$`);
  return {
    diff:v, card:v===1?'distributiv':'teckenregler',
    prompt:`Någon har löst ekvationen $${k}(x - ${m}) = ${n}$. På vilken rad blir det fel först?`,
    answer:feletAns(lines,v),
    steps:[
      v===1 ? `Rad 2 är fel: $${k}$ ska gångras med båda termerna i parentesen, så $${k}(x - ${m}) = ${k}x - ${k*m}$.`
            : `Rad 3 är fel: när $-${k*m}$ flyttas över till högerledet byter den tecken och blir $+${k*m}$.`,
      `Rätt: $${k}x - ${k*m} = ${n}$, så $${k}x = ${n+k*m}$ och $x = ${x0}$.`,
      `Kontroll: $${k}(${x0} - ${m}) = ${k}\\cdot ${P(x0-m)} = ${n}$ ✓`,
    ],
    verify:()=>k*(x0-m)===n && (n+k*m)/k===x0,
  };
});

defU('u-felet-faktorform',3,'felet','faktorform','Fel tecken i faktorformen',()=>{
  const [A,B]=shuffle([ri(1,7),-ri(1,7)]), v=pick([1,1,2]);
  const right=Poly.uni([1,-(A+B),A*B]);
  const lines=[`Rötterna är $x = ${A}$ och $x = ${B}$.`];
  let wrongRoot=null;
  if(v===1){
    wrongRoot=pick([A,B]);
    const fA=wrongRoot===A?-A:A, fB=wrongRoot===B?-B:B;
    lines.push(`$(${poly([1,-fA])})(${poly([1,-fB])}) = 0$`, `$${Poly.uni([1,-(fA+fB),fA*fB]).tex()} = 0$`);
  } else {
    lines.push(`$(${poly([1,-A])})(${poly([1,-B])}) = 0$`, `$${Poly.uni([1,-(A+B),-A*B]).tex()} = 0$`);
  }
  return {
    diff:v, card:v===1?'faktorform':'teckenregler',
    prompt:'Någon ska skriva en andragradsekvation som har de här rötterna. På vilken rad blir det fel först?',
    answer:feletAns(lines,v),
    steps:[
      v===1 ? `Rad 2 är fel: roten $x = ${wrongRoot}$ ger parentesen $(${poly([1,-wrongRoot])})$, för den blir noll när $x = ${wrongRoot}$. Tecknet byts.`
            : `Rad 3 är fel: konstanttermen är $${P(-A)}\\cdot ${P(-B)} = ${A*B}$.`,
      `Rätt: $(${poly([1,-A])})(${poly([1,-B])}) = ${right.tex()} = 0$`,
      `Kontroll: $x = ${A}$ ger $${subsTex([1,-(A+B),A*B],A)} = 0$ ✓`,
    ],
    verify:()=>right.eval({x:A}).isZero() && right.eval({x:B}).isZero(),
  };
});

defU('u-felet-pq',4,'felet','pq','Fel i pq-formeln',()=>{
  const r1=nzi(-6,6); let r2; do r2=nzi(-6,6); while(r2===r1);
  const p=-(r1+r2); if(p===0||p%2) return null;
  const q=r1*r2, h=p/2, D=h*h-q, s=isqrt(D), v=q<0?pick([1,2]):1;
  const lines=[`$${poly([1,p,q])} = 0$`];
  if(v===1) lines.push(`$x = ${h} \\pm \\sqrt{${P(h)}^2${plus(-q)}}$`, `$x = ${h} \\pm ${s}$`, `$x_1 = ${h+s}, \\quad x_2 = ${h-s}$`);
  else lines.push(`$x = ${-h} \\pm \\sqrt{${P(h)}^2${plus(-q)}}$`, `$x = ${-h} \\pm \\sqrt{${h*h+q}}$`);
  return {
    diff:2, prompt:'Någon har löst ekvationen med pq-formeln. På vilken rad blir det fel först?',
    answer:feletAns(lines,v),
    steps:[
      v===1 ? `Rad 2 är fel: formeln börjar med $-\\frac{p}{2}$. Här är $p = ${p}$, så $-\\frac{p}{2} = ${-h}$.`
            : `Rad 3 är fel: $${P(h)}^2 - ${P(q)} = ${h*h} + ${-q} = ${D}$. Minus ett negativt tal blir plus.`,
      `Rätt: $x = ${-h} \\pm \\sqrt{${D}} = ${-h} \\pm ${s}$`,
      `Alltså $x_1 = ${-h+s}$ och $x_2 = ${-h-s}$.`,
      rootCheck([1,p,q],[F(-h+s),F(-h-s)]),
    ],
    verify:()=>s!==null && evalCs([1,p,q],-h+s).isZero() && evalCs([1,p,q],-h-s).isZero(),
  };
});

  const p=-(r1+r2), q=r1*r2, h=F(-p,2), D=h.mul(h).sub(q), s=sqrtFrac(D);

    `$x = ${T(h)} \\pm ${T(s)}$`, `$x_1 = ${T(h.add(s))}, \\quad x_2 = ${T(h.sub(s))}$`);

const FRAGA_KAT={formel:'En formel', df:'Definitionsmängden $D_f$', vf:'Värdemängden $V_f$', max:'Ett största värde', xval:'Ett $x$-värde (eller $t$-värde)', fval:'Ett funktionsvärde'};
const FRAGA_FORM={formel:'en formel, till exempel $A(x) = \\dots$', df:'en olikhet för insignalen, till exempel $0 < x < 6$', vf:'en olikhet för utsignalen, till exempel $0 < A \\le 18$',
  max:'ett enda tal, ett största värde med enhet', xval:'ett värde på insignalen, till exempel $t = 2$', fval:'ett tal som kommer ut ur funktionen, till exempel $h(1) = 15$'};
const FRAGA_CTX=[
  ()=>{ const v=pick([10,20,30]); return {intro:`En boll kastas uppåt. Höjden är $h(t) = ${v}t - 5t^2$ meter efter $t$ sekunder.`, qs:[

  ]}; },
  ()=>{ const W=pick([8,12,16,20]); return {intro:`En ${W} dm bred plåt viks upp $x$ dm på varje sida till en ränna.`, qs:[
    ['Teckna en formel för tvärsnittsarean.','formel','"Teckna" betyder att man ska skriva upp en formel.'],

    ['Hur mycket ska plåten vikas upp för att arean ska bli störst?','xval','"Hur mycket ska vikas" frågar efter $x$, inte efter arean.'],

  ()=>{ const k=pick([20,30,50]); return {intro:'Ett företags vinst är $V(x)$ kronor när det säljer $x$ varor.', qs:[

    ['Vilken är den största möjliga vinsten?','max','Frågan gäller själva vinsten, det största värdet.'],
    [`Hur stor blir vinsten om $${k}$ varor säljs?`,'fval','Antalet varor är givet. Räkna ut ett funktionsvärde.'],
    ['Vilka antal varor är möjliga att sälja?','df','Antalet varor är insignalen, alltså $D_f$.'],
    ['Vilka vinster är möjliga?','vf','Vinsten är det som kommer ut, alltså $V_f$.'],
  ]}; },
];
function fragaGen(cats){
  return ()=>{
    const ctx=pick(FRAGA_CTX)(), qs=ctx.qs.filter(q=>cats.includes(q[1])); if(!qs.length) return null;
    const [q,cat,why]=pick(qs);
    const others=shuffle(Object.keys(FRAGA_KAT).filter(c=>c!==cat)).slice(0,3);
    return {
      diff:cat==='xval'||cat==='max'?2:1,
      prompt:`${ctx.intro} Frågan lyder: "${q}" Vad är det egentligen uppgiften ber om?`,
      answer:mc(FRAGA_KAT[cat], others.map(c=>({t:FRAGA_KAT[c], msg:`Titta på frågeordet. ${why}`}))),
      steps:[
        'Innan man räknar lönar det sig att se vad som efterfrågas. Samma modell kan ge många olika svar.',
        why,
        `Svaret ska alltså vara ${FRAGA_FORM[cat]}.`,
        `Kontroll: läs frågan igen med ett sådant svar i tankarna. Det passar ✓`,
      ],
      verify:()=>!!FRAGA_KAT[cat],
    };
  };
}

  const ys=W>=16?10:5, ymax=Math.ceil((max+ys)/ys)*ys;
  const fig=graphSVG({xmin:-1,xmax:h+1,ymin:-ys,ymax,ys,aria:'Arean A(x) och linjen y = '+T0,curves:[
    {fn:x=>A.evalNum({x}),from:0,to:h,cls:'cf',label:'A',lcls:'lf',lx:xm,ly:max+ys*0.45},
    {fn:()=>T0,from:-0.5,to:h+0.5,cls:'cg',label:'T',lcls:'lg',lx:h+0.7,ly:T0+ys*0.3}]});
  const between=`$${lo} < x < ${hi}$`;
  return {
    diff:3, time:240,
    prompt:`En ${W} dm bred plåt viks upp $x$ dm på varje sida till en ränna. Fem steg, en gemensam klocka. Varje steg bygger på det förra.`,
    fig:rannaSVG(W),
    parts:[
      {prompt:'Steg 1 av 5 · Modell. Vilken formel ger tvärsnittsarean $A(x)$?', answer:mc(`$A(x) = x(${W} - 2x)$`,[
        {t:`$A(x) = x(${W} - x)$`, msg:`Det viks upp på båda sidor, så bottnen blir $${W} - 2x$.`},
        {t:`$A(x) = 2x(${W} - 2x)$`, msg:'Höjden är $x$, inte $2x$.'},
        {t:`$A(x) = 2x + (${W} - 2x)$`, msg:'Arean är sida gånger sida, inte summan.'}])},
      {prompt:`Steg 2 av 5 · Definitionsmängd. Vilka $x$ är möjliga i $A(x) = x(${W} - 2x)$?`, answer:mc(`$0 < x < ${h}$`,[
        {t:`$0 \\le x \\le ${h}$`, msg:`Vid $x = 0$ och $x = ${h}$ blir arean $0$, alltså ingen ränna.`},
        {t:`$0 < x < ${W}$`, msg:`Det går åt $2x$ till kanterna, så $x < ${h}$.`},
        {t:`$0 < x < ${xm}$`, msg:`$x = ${xm}$ är där arean är störst, inte gränsen.`}])},
      {prompt:`Steg 3 av 5 · Ekvation. För vilka $x$ blir arean $${T0}$ dm²? Ställ upp $x(${W} - 2x) = ${T0}$ och lös med pq-formeln.`,
        answer:num([c,c2],`x_1 = ${lo}, \\quad x_2 = ${hi}`),
        errors:[{values:[-c,-c2], msg:`Kolla tecknet på $-\\frac{p}{2}$. Efter divisionen med $-2$ är $p = ${p}$.`}]},
      {prompt:`Steg 4 av 5 · Graf. Grafen visar $A(x)$ och linjen $y = ${T0}$. Använd rötterna från steg 3: för vilka $x$ är arean större än $${T0}$ dm²?`, fig,
        answer:mc(between,[
          {t:`$x < ${lo}$ eller $x > ${hi}$`, msg:'Arean är större där parabeln ligger ovanför linjen, alltså mellan skärningspunkterna.'},
          {t:`$${lo} \\le x \\le ${hi}$`, msg:`Vid $x = ${lo}$ och $x = ${hi}$ är arean exakt $${T0}$, inte större.`},
          {t:`$0 < x < ${lo}$`, msg:'Där ligger parabeln under linjen.'}])},
      {prompt:`Steg 5 av 5 · Koefficientjämförelse. Skriv $A(x) = -2(x - h)^2 + k$. Bestäm $h$ och $k$. Tips: $h$ ligger mitt emellan rötterna från steg 3.`,
        answer:num([xm,max],`h = ${xm}, \\quad k = ${max}`,{ordered:true,hint:'Svara: h; k'}),
        errors:[{values:[max,xm], msg:'Ordningen: först $h$, sedan $k$.'},{values:[-xm,max], msg:'Kolla tecknet: $(x - h)^2$ har sin topp där $x = h$.'}]},
    ],
    steps:[
      `Steg 1: höjden är $x$ och bottnen $${W} - 2x$, så $A(x) = x(${W} - 2x) = ${A.tex()}$.`,
      `Steg 2: både $x$ och bottnen måste vara större än $0$, så $0 < x < ${h}$.`,
      `Steg 3: $${W}x - 2x^2 = ${T0}$. Dela med $-2$: $${poly([1,p,q])} = 0$. pq-formeln: $x = ${T(F(h,2))} \\pm \\sqrt{${T(F(h*h,4))} - ${q}} = ${T(F(h,2))} \\pm ${T(F(Math.abs(c2-c),2))}$, alltså $x = ${lo}$ eller $x = ${hi}$. Båda ligger i $D_f$.`,
      `Steg 4: parabeln ligger ovanför linjen mellan skärningspunkterna, alltså ${between}.`,

      `Kontroll: $A(${xm}) = ${xm}\\cdot ${W-2*xm} = ${max}$ och $A(${lo}) = ${lo}\\cdot ${W-2*lo} = ${T0}$ ✓`,

    steps:[
      'Vietas formler för $x^2 + px + q = 0$: $x_1 + x_2 = -p$ och $x_1\\cdot x_2 = q$.',
      'De kommer från $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1x_2$.',
      `Här är $p = ${p}$ och $q = ${q}$, så summan är $${-p}$ och produkten $${q}$.`,

def('b-vieta-kolla',12,'Kolla rötter blixtsnabbt',()=>{
  const r1=nzi(-7,7); let r2; do r2=nzi(-7,7); while(r2===r1);
  const p=-(r1+r2), q=r1*r2, v=pick(['ok','ok','sum','prod','sign']);
  let a=r1,b=r2;
  if(v==='sum'){ a=r1+1; b=r2-1; } if(v==='prod'){ a=r1+1; b=r2; } if(v==='sign'){ a=-r1; b=-r2; }
  if(v!=='ok' && sameVals([F(a),F(b)],[F(r1),F(r2)],false)) return null;
  const sumOk=a+b===-p, prodOk=a*b===q, yes=sumOk&&prodOk;
  const why=`Summan $${a}${plus(b)} = ${a+b}$ ska vara $${-p}$ och produkten $${a*b}$ ska vara $${q}$.`;
  return {
    diff:1, prompt:`Är $x = ${a}$ och $x = ${b}$ rötterna till $${poly([1,p,q])} = 0$? Använd Vietas formler.`,
    answer:mcFixed([{t:'Ja',ok:yes,msg:why},{t:'Nej',ok:!yes,msg:why}]),
    steps:[
      `Rötterna ska ha summan $-p = ${-p}$ och produkten $q = ${q}$.`,
      `Summan: $${a}${plus(b)} = ${a+b}$ ${sumOk?'✓':'✗'}`,
      `Produkten: $${P(a)}\\cdot ${P(b)} = ${a*b}$ ${prodOk?'✓':'✗'}`,
      yes?'Båda stämmer, så det är rötterna.':'Minst en stämmer inte, så det är inte rötterna.',
      `Kontroll: de rätta rötterna är $${r1}$ och $${r2}$ ✓`,
    ],
    verify:()=>yes===sameVals([F(a),F(b)],[F(r1),F(r2)],false),
  };
});

    'Flytta över $q$, så att bara $x$-termerna står till vänster.',
    'Lägg till $\\left(\\frac{p}{2}\\right)^2$ på båda sidor. Då blir vänsterledet en hel kvadrat.',
    'Skriv vänsterledet som $\\left(x + \\frac{p}{2}\\right)^2$ med kvadreringsregeln.',
    'Dra roten ur båda sidor. Glöm inte $\\pm$.',
    'Kontroll: med $p = -6$ och $q = 8$ ger sista raden $x = 3 \\pm 1$, och $4$ och $2$ löser $x^2 - 6x + 8 = 0$ ✓',
  ],

}));

/* ----- 14: Komplexa tal ----- */
const cTex=(h,s)=>`${h===0?'':h+' '}\\pm ${s===1?'':s}i`;
def('b-komplex-ren',14,'Roten ur ett negativt tal',()=>{
  const k=ri(1,6), v=pick([0,1]);
  return {
    diff:1, prompt:v?`Lös ekvationen $x^2 + ${k*k} = 0$.`:`Lös ekvationen $x^2 = -${k*k}$.`,
    answer:mc(`$x = ${cTex(0,k)}$`,[
      {t:`$x = \\pm ${k}$`, msg:`Testa: $(\\pm ${k})^2 = ${k*k}$, inte $-${k*k}$. Ett reellt tal i kvadrat blir aldrig negativt.`},
      {t:'Ekvationen saknar lösning', msg:'Bland reella tal, ja. Men med komplexa tal finns två lösningar.'},
      {t:`$x = \\pm ${k*k}i$`, msg:`Roten ur $${k*k}$ är $${k}$.`}]),
    steps:[
      'Talet $i$ är definierat så att $i^2 = -1$.',
      `$x^2 = -${k*k} = ${k*k}\\cdot(-1) = ${k*k}i^2 = (${k===1?'':k}i)^2$`,
      `Alltså $x = ${cTex(0,k)}$.`,
      `Kontroll: $(${k===1?'':k}i)^2 = ${k*k}i^2 = -${k*k}$ ✓`,
    ],
    verify:()=>k>0,
  };
});
def('b-komplex-i',14,'Räkna med i',()=>{
  const v=pick(['kk','ab','i4','sum']); let prompt, val, how;
  if(v==='kk'){ const k=ri(2,6); prompt=`$(${k}i)^2$`; val=-k*k; how=`$(${k}i)^2 = ${k*k}\\cdot i^2 = ${k*k}\\cdot(-1) = ${val}$`; }
  if(v==='ab'){ const a=ri(2,5), b=nzi(-5,5,[0,1]); prompt=`$${a}i\\cdot ${b<0?'('+b+'i)':b+'i'}$`; val=-a*b; how=`$${a}\\cdot ${P(b)}\\cdot i^2 = ${a*b}\\cdot(-1) = ${val}$`; }
  if(v==='i4'){ const n=pick([2,4,6,8]); prompt=`$i^{${n}}$`; val=n%4===0?1:-1; how=`$i^{${n}} = (i^2)^{${n/2}} = (-1)^{${n/2}} = ${val}$`; }
  if(v==='sum'){ const k=ri(2,5); prompt=`$(${k}i)^2 + ${k*k}$`; val=0; how=`$(${k}i)^2 = -${k*k}$, och $-${k*k} + ${k*k} = 0$`; }
  return {
    diff:1, prompt:`Beräkna ${prompt}.`, answer:num([val],`${val}`),
    errors:[val!==0 && {values:[-val], msg:'Kolla tecknet. $i^2 = -1$, inte $1$.'}],
    steps:['Allt räknas som vanligt, men varje $i^2$ byts mot $-1$.', how, `Svar: $${val}$`, `Kontroll: $i^2 = -1$ användes, och svaret $${val}$ är ett vanligt reellt tal ✓`],
    verify:()=>Number.isInteger(val),
  };
});
def('b-komplex-pq',14,'pq-formeln med i',()=>{
  const h=ri(-3,3), s=ri(1,4), p=-2*h, q=h*h+s*s;
  return {
    diff:2, prompt:`Lös ekvationen $${poly([1,p,q])} = 0$.`,
    answer:mc(`$x = ${cTex(h,s)}$`,[
      h!==0 && {t:`$x = ${cTex(-h,s)}$`, msg:`Kolla tecknet på $-\\frac{p}{2}$. Här är $p = ${p}$.`},
      {t:`$x = ${h===0?'':h+' '}\\pm ${s}$`, msg:'Talet under rottecknet är negativt. Roten ur ett negativt tal ger ett $i$.'},
      {t:'Ekvationen saknar lösning', msg:'Bland reella tal, ja. Med komplexa tal finns två lösningar.'},
      {t:`$x = ${cTex(h,s*s)}$`, msg:`Roten ur $-${s*s}$ är $${s===1?'':s}i$.`}]),
    steps:[
      `pq-formeln: $x = ${h} \\pm \\sqrt{${P(h)}^2 - ${q}}$`,
      `Under rottecknet: $${h*h} - ${q} = -${s*s}$, ett negativt tal.`,
      `$\\sqrt{-${s*s}} = ${s===1?'':s}i$, för $(${s===1?'':s}i)^2 = -${s*s}$.`,
      `$x = ${cTex(h,s)}$`,
      `Kontroll med Vieta: summan $2\\cdot ${P(h)} = ${2*h} = -p$ och produkten $${P(h)}^2 + ${s*s} = ${q} = q$ ✓`,
    ],
    verify:()=>h*h-q===-s*s,
  };
});

/* ----- 15: Fler funktioner för Df och Vf ----- */
def('b-df-rat',15,'Df för bråkfunktioner',()=>{
  const k=nzi(-6,6), a=nzi(-6,6), sq=rand()<0.3, m=ri(2,5);
  if(sq) return {
    diff:2, prompt:`Bestäm definitionsmängden för $f(x) = \\frac{${k}}{x^2 - ${m*m}}$.`,
    answer:mc(`$x \\ne \\pm ${m}$`,[
      {t:`$x \\ne ${m}$`, msg:`Även $x = -${m}$ ger nämnaren $0$, för $(-${m})^2 = ${m*m}$.`},
      {t:`$x \\ne ${m*m}$`, msg:`Nämnaren blir noll när $x^2 = ${m*m}$, alltså när $x = \\pm ${m}$.`},
      {t:'Alla reella tal', msg:'Man får aldrig dela med noll.'}]),
    steps:['Man får aldrig dela med noll. Vi letar efter de $x$ som gör nämnaren noll.', `$x^2 - ${m*m} = 0$ ger $x^2 = ${m*m}$, alltså $x = \\pm ${m}$.`, `$D_f$: alla $x$ utom $\\pm ${m}$.`, `Kontroll: $(${m})^2 - ${m*m} = 0$ och $(-${m})^2 - ${m*m} = 0$ ✓`],
    verify:()=>true,
  };
  return {
    diff:1, prompt:`Bestäm definitionsmängden för $f(x) = \\frac{${k}}{${poly([1,-a])}}$.`,
    answer:mc(`$x \\ne ${a}$`,[
      {t:`$x \\ne ${-a}$`, msg:`Nämnaren $${poly([1,-a])}$ blir noll när $x = ${a}$. Tecknet byts.`},
      {t:`$x > ${a}$`, msg:`Man får stoppa in tal både större och mindre än $${a}$, bara inte $${a}$ själv.`},
      {t:'Alla reella tal', msg:'Man får aldrig dela med noll.'}]),
    steps:['Man får aldrig dela med noll.', `Nämnaren $${poly([1,-a])}$ är noll när $x = ${a}$.`, `$D_f$: alla $x$ utom $${a}$.`, `Kontroll: $x = ${a}$ ger nämnaren $${a}${plus(-a)} = 0$ ✓`],
    verify:()=>true,
  };
});
def('b-df-rot',15,'Df och Vf för rotfunktioner',()=>{
  const a=nzi(-6,6), flip=rand()<0.4, askV=rand()<0.3;
  const inner=flip?`${a} - x`:poly([1,-a]), cond=flip?`x \\le ${a}`:`x \\ge ${a}`;
  if(askV) return {
    diff:2, prompt:`Bestäm värdemängden för $f(x) = \\sqrt{${inner}}$.`,
    answer:mc('$y \\ge 0$',[
      {t:`$y \\ge ${a}$`, msg:`$${a}$ hör till $D_f$, inte till $V_f$.`},
      {t:'Alla reella tal', msg:'En kvadratrot är aldrig negativ.'},
      {t:'$y > 0$', msg:`$f(${a}) = \\sqrt{0} = 0$, så $0$ är med.`}]),
    steps:['$\\sqrt{\\ }$ betyder den icke-negativa roten. Den är aldrig negativ.', `Minsta värdet är $f(${a}) = \\sqrt{0} = 0$.`, 'Större värden går att få genom att välja $x$ längre bort.', `Kontroll: $${flip?'x = '+(a-4):'x = '+(a+4)}$ ger $\\sqrt{4} = 2 \\ge 0$ ✓`],
    verify:()=>true,
  };
  return {
    diff:1, prompt:`Bestäm definitionsmängden för $f(x) = \\sqrt{${inner}}$.`,
    answer:mc(`$${cond}$`,[
      {t:`$${flip?'x \\ge '+a:'x \\le '+a}$`, msg:`Det under roten, $${inner}$, måste vara minst $0$. Lös olikheten.`},
      {t:`$x \\ge ${-a}$`, msg:'Kolla tecknet när du löser olikheten.'},
      {t:'Alla reella tal', msg:'Man kan inte dra roten ur negativa tal bland de reella talen.'}]),
    steps:['Man kan inte dra roten ur ett negativt tal (bland reella tal). Det under roten måste vara minst $0$.', `$${inner} \\ge 0$ ger $${cond}$.`, `$D_f$: $${cond}$`, `Kontroll: $x = ${a}$ ger $\\sqrt{0} = 0$, som är tillåtet ✓`],
    verify:()=>true,
  };
});
def('b-df-aldrig',15,'Värdet som aldrig kommer',()=>{
  const k=nzi(-6,6), a=nzi(-6,6);
  return {
    diff:2, prompt:`Vilket $y$-värde kan $f(x) = \\frac{${k}}{${poly([1,-a])}}$ aldrig anta?`,
    answer:num([0],'y = 0'),
    errors:[{values:[a], msg:`$${a}$ är det $x$ som inte får stoppas in. Frågan gäller ett $y$-värde.`},{values:[k], msg:`Prova $x = ${a+1}$: då blir $f(x) = ${k}$. Det värdet går alltså att få.`}],
    steps:['Ett bråk är noll bara om täljaren är noll.', `Täljaren är $${k}$, som aldrig är noll.`, `Därför blir $f(x)$ aldrig $0$. Alla andra $y$ går att få.`, `Kontroll: $\\frac{${k}}{${poly([1,-a])}} = 0$ skulle betyda $${k} = 0$, vilket är falskt ✓`],
    verify:()=>k!==0,
  };
});

/* ----- 16: Grafernas transformationer ----- */
def('b-trans-vertex',16,'Var hamnar vändpunkten?',()=>{
  const h=nzi(-5,5), k=ri(-5,5), s=pick([1,-1,2]);
  const gT=`${s===1?'':s===-1?'-':s}(${poly([1,-h])})^2${k?plus(k):''}`;
  return {
    diff:1, prompt:`$f(x) = x^2$ har vändpunkten $(0, 0)$. Var ligger vändpunkten för $g(x) = ${gT}$?`,
    answer:num([h,k],`(${h}, ${k})`,{ordered:true,hint:'Svara: x; y'}),
    errors:[{values:[-h,k], msg:`$f(${poly([1,-h])})$ flyttar grafen åt ${h>0?'höger':'vänster'}. Minus inne i parentesen ger höger.`},{values:[k,h], msg:'Ordningen: först $x$, sedan $y$.'}],
    steps:[
      `$(${poly([1,-h])})^2$ flyttar grafen $${Math.abs(h)}$ steg åt ${h>0?'höger':'vänster'}.`,
      s!==1 ? (s<0?'Minustecknet framför speglar grafen i $x$-axeln. Vändpunktens läge i sidled ändras inte.':'Faktorn $2$ sträcker grafen på höjden. Vändpunktens läge ändras inte.') : 'Inget tal framför parentesen, så formen är samma som för $x^2$.',
      k ? `$${plus(k).trim()}$ flyttar grafen $${Math.abs(k)}$ steg ${k>0?'upp':'ned'}.` : 'Ingen konstant, så ingen flytt i höjdled.',
      `Kontroll: $g(${h}) = ${s===1?'':s===-1?'-':s+'\\cdot '}0^2${k?plus(k):''} = ${k}$ ✓`,
    ],
    verify:()=>true,
  };
});
def('b-trans-ord',16,'Hur flyttas grafen?',()=>{
  const c=ri(2,5);
  const all={ right:`${c} steg åt höger`, left:`${c} steg åt vänster`, up:`${c} steg uppåt`, down:`${c} steg nedåt`, mirror:'Speglas i $x$-axeln', stretch:`Sträcks på höjden med faktorn $${c}$` };
  const cases=[
    {f:`f(x - ${c})`, a:'right', why:'Minus inne i parentesen ger höger: man behöver ett $x$ som är $'+c+'$ större för att få samma värde som innan.'},
    {f:`f(x + ${c})`, a:'left', why:'Plus inne i parentesen ger vänster.'},
    {f:`f(x) + ${c}`, a:'up', why:`Alla $y$-värden blir $${c}$ större.`},
    {f:`f(x) - ${c}`, a:'down', why:`Alla $y$-värden blir $${c}$ mindre.`},
    {f:'-f(x)', a:'mirror', why:'Alla $y$-värden byter tecken.'},
    {f:`${c}f(x)`, a:'stretch', why:`Alla $y$-värden blir $${c}$ gånger så stora.`},
  ];
  const cs=pick(cases), others=shuffle(Object.keys(all).filter(k=>k!==cs.a)).slice(0,3);
  return {
    diff:1, prompt:`Hur ändras grafen till $f(x)$ när man ritar $y = ${cs.f}$?`,
    answer:mc(all[cs.a], others.map(k=>({t:all[k], msg:cs.why}))),
    steps:['Ändringar utanför $f$ påverkar $y$-värdena. Ändringar inne i parentesen påverkar $x$.', cs.why, `Svar: ${all[cs.a]}`, 'Kontroll: tänk på vändpunkten till $f(x) = x^2$ och se vart den hamnar ✓'],
    verify:()=>true,
  };
});
def('b-trans-graf',16,'Vilken formel har grafen?',()=>{
  const h=nzi(-3,3), k=nzi(-3,3);
  const fn=x=>(x-h)*(x-h)+k;
  const fig=graphSVG({xmin:-5,xmax:5,ymin:-4,ymax:6,aria:'Graferna till f och g',curves:[
    {fn:x=>x*x,from:-3,to:3,cls:'cf',label:'f',lcls:'lf',lx:0,ly:-0.9},
    {fn,from:h-3,to:h+3,cls:'cg',label:'g',lcls:'lg',lx:h,ly:k-0.9}]});
  const G=(hh,kk,neg)=>`$g(x) = ${neg?'-':''}(${poly([1,-hh])})^2${plus(kk)}$`;
  return {
    diff:2, fig, prompt:'Grafen $f$ är $f(x) = x^2$. Grafen $g$ är samma parabel, flyttad. Vilken formel har $g$?',
    answer:mc(G(h,k),[
      {t:G(-h,k), msg:`Vändpunkten ligger vid $x = ${h}$. Då står det $(${poly([1,-h])})^2$: minus ger höger.`},
      {t:G(h,-k), msg:`Vändpunkten ligger på höjden $${k}$, så konstanten är $${k}$.`},
      {t:G(h,k,true), msg:'Parabeln öppnar sig uppåt, alltså inget minus framför.'}]),
    steps:[`Vändpunkten för $g$ ligger i $(${h}, ${k})$.`, `Sidledes: $${Math.abs(h)}$ steg åt ${h>0?'höger':'vänster'} ger $(${poly([1,-h])})^2$.`, `Höjdled: $${Math.abs(k)}$ steg ${k>0?'upp':'ned'} ger $${plus(k).trim()}$.`, `Kontroll: $g(${h}) = 0${plus(k)} = ${k}$, alltså vändpunkten ✓`],
    verify:()=>fn(h)===k,
  };
});

    '$x = -\\frac{b}{2a} \\pm \\sqrt{\\frac{b^2 - 4ac}{4a^2}}$','$x = -\\frac{b}{2a} \\pm \\frac{\\sqrt{b^2 - 4ac}}{2a}$','$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$']),

def('b-bevis-ind',17,'Induktionens delar',()=>{
  const sums=[
    {stmt:'1 + 3 + 5 + \\dots + (2n - 1) = n^2', base:'1 = 1^2', hyp:'1 + 3 + \\dots + (2k - 1) = k^2', goal:'1 + 3 + \\dots + (2k + 1) = (k + 1)^2'},
    {stmt:'1 + 2 + 3 + \\dots + n = \\frac{n(n + 1)}{2}', base:'1 = \\frac{1\\cdot 2}{2}', hyp:'1 + 2 + \\dots + k = \\frac{k(k + 1)}{2}', goal:'1 + 2 + \\dots + (k + 1) = \\frac{(k + 1)(k + 2)}{2}'},
  ];
  const sm=pick(sums), q=pick(['base','hyp','goal']);
  const lbl={base:'basfallet',hyp:'induktionsantagandet',goal:'det som ska visas i induktionssteget'};
  const opts={base:`$${sm.base}$`, hyp:`Anta att $${sm.hyp}$`, goal:`Visa att $${sm.goal}$`, ex:'Testa $n = 1, 2, 3$ och se att det stämmer'};
  const msgs={base:'Det är basfallet: att påståendet stämmer för $n = 1$.', hyp:'Det är induktionsantagandet: att det gäller för något $n = k$.', goal:'Det är målet i induktionssteget: att det då också gäller för $n = k + 1$.', ex:'Exempel bevisar inget för alla $n$. Induktion behöver basfall och induktionssteg.'};
  return {
    diff:2, prompt:`Vi vill bevisa $${sm.stmt}$ med induktion. Vad är ${lbl[q]}?`,
    answer:mc(opts[q], Object.keys(opts).filter(k=>k!==q).map(k=>({t:opts[k], msg:msgs[k]}))),
    steps:['Induktion fungerar som dominobrickor: den första brickan måste falla, och varje bricka måste fälla nästa.', `Basfall ($n = 1$): $${sm.base}$.`, `Induktionsantagande ($n = k$): $${sm.hyp}$. Steg: visa $${sm.goal}$.`, 'Kontroll: basfall plus steg täcker $n = 1$, sedan $2$, sedan $3$, och så vidare ✓'],
    verify:()=>true,
  };
});
def('b-bevis-steg',17,'Induktionssteget med tal',()=>{
  const k=ri(3,16), nxt=2*k+1, val=k*k+nxt;
  return {
    diff:1, prompt:`Antag att $1 + 3 + 5 + \\dots + ${2*k-1} = ${k*k}$, som är $${k}^2$. Vad blir summan när nästa udda tal läggs till?`,
    answer:num([val],`${val}`),
    errors:[{values:[k*k+2*k-1], msg:`Nästa udda tal efter $${2*k-1}$ är $${nxt}$.`},{values:[k*k+2*k], msg:`Udda tal ökar med $2$: nästa är $${2*k-1} + 2 = ${nxt}$.`}],
    steps:[`Nästa udda tal är $${2*k-1} + 2 = ${nxt}$.`, `Summan blir $${k*k} + ${nxt} = ${val}$.`, `Det är $${k+1}^2$. Allmänt: $k^2 + (2k + 1) = (k + 1)^2$, precis induktionssteget.`, `Kontroll: $${k+1}\\cdot ${k+1} = ${val}$ ✓`],
    verify:()=>val===(k+1)*(k+1),
  };
});

/* ---------- Skapa och kontrollera uppgifter ---------- */
function normPart(p){
  p.role=p.role||'main'; p.prompt=p.prompt||'';
  if(p.answer.kind==='num') p.errors=(p.errors||[]).filter(Boolean).map(e=>({values:e.values.map(Frac.of),msg:e.msg}))
    .filter(e=>!sameVals(e.values,p.answer.values,p.answer.ordered));
  else p.errors=[];
  return p;
}
function generate(id){
  const def=TYPES[id];
  for(let i=0;i<200;i++){
    const t=def.gen(); if(!t) continue;
    t.type=id; t.level=def.level; t.typeName=def.name; t.und=def.und||null; t.card=t.card||def.card||null;
    t.steps=t.steps.filter(Boolean); t.fig=t.fig||''; t.lines=t.lines||null;
    if(!t.parts) t.parts=[{answer:t.answer, errors:t.errors}];
    t.parts=t.parts.map(normPart);
    const last=t.parts[t.parts.length-1]; t.answer=last.answer; t.errors=last.errors;
    let ok=false; try{ ok=t.verify(); }catch(e){ ok=false; }
    if(ok) return t;
  }
  throw new Error('Kunde inte skapa en korrekt uppgift av typen '+id);
}
// n uppgifter. undCount av dem (aldrig den första) blir förståelseuppgifter.
function makeRound(typeIds,n=10,undIds=[],undCount=0){
  const slots=new Set(); if(undIds.length && typeIds.length) while(slots.size<Math.min(undCount,n-1)) slots.add(ri(1,n-1));
  const out=[]; let pool=[], upool=[];
  const ids=typeIds.length?typeIds:undIds;
  for(let i=0;i<n;i++){
    let id;
    if(slots.has(i)){ if(!upool.length) upool=shuffle(undIds); id=upool.pop(); }
    else { if(!pool.length) pool=shuffle(ids); id=pool.pop(); }
    let t, tries=0;
    do{ t=generate(id); tries++; } while(tries<8 && out.some(o=>o.prompt===t.prompt && o.fig===t.fig && JSON.stringify(o.lines)===JSON.stringify(t.lines)));
    out.push(t);
  }
  return out;
}

const DAY=86400000, RUST_DAYS=7, WORLDS=[1,2,3,4,5,6,7,8,9];
const MEDALS=['Ingen medalj','Brons','Silver','Guld','Diamant'];
const starsFor = c => c>=9?3:c>=8?2:c>=6?1:0;
function freshState(){
  return {v:2, level:1, passed:{}, best:{}, low:{level:0,count:0}, rounds:0, answered:0, correct:0, bestStreak:0, totalTime:0, types:{}, history:[],
    xp:0, insights:0, insightsEarned:0, hintsUsed:0, stars:{}, und:{}, cards:{}, worldLast:{},
    skin:{owned:['standard'], active:'standard'},
    black:{unlocked:false, beaten:false, name:'', theme:false, lessons:{}, attempts:0, unlockedAt:0}};
}
function migrate(old){
  const S=freshState(); if(!old || typeof old!=='object') return S;
  const f=freshState();
  for(const k in old) if(old[k]!==undefined) S[k]=old[k];
  S.skin=Object.assign({},f.skin,old.skin||{}); S.black=Object.assign({},f.black,old.black||{});
  for(const k of ['stars','und','cards','worldLast','passed','best','types']) S[k]=Object.assign({},old[k]||{});
  if(!Array.isArray(S.history)) S.history=[];
  if(!old.v || old.v<2){
    const now=Date.now();
    S.xp=S.history.reduce((s,h)=>s+(h.score||0),0);
    S.history.forEach(h=>{
      if(h.practice) return;
      const st=S.stars[h.level]||(S.stars[h.level]={best:0,n3:0,n:0}), s=starsFor(h.correct);
      st.best=Math.max(st.best,s); if(s===3) st.n3++; st.n++;
      if(h.correct>=6) S.worldLast[h.level]=Math.max(S.worldLast[h.level]||0, h.date||now);
    });
    Object.keys(S.passed).forEach(l=>{
      const st=S.stars[l]||(S.stars[l]={best:0,n3:0,n:0}); st.best=Math.max(st.best,2);
      if(!S.worldLast[l]) S.worldLast[l]=now;
    });
    S.v=2;
  }
  return S;
}
function forstadd(S,w){ const u=S.und[w]; return !!u && u.n>=3 && Object.keys(u.kinds||{}).length>=2; }
const cardsOfWorld = w => CARDS.filter(c=>c.w===w).map(c=>c.id);
function medalInfo(S,w){
  const st=S.stars[w]||{best:0,n3:0,n:0}, und=forstadd(S,w), cards=cardsOfWorld(w).every(id=>S.cards[id]);
  let m=0; if(st.best>=1) m=1; if(st.best>=2) m=2; if(st.best>=3 && und) m=3; if(m===3 && st.n3>=3 && cards) m=4;
  return {medal:m, stars:st.best, n3:st.n3, rounds:st.n, und, cards, capped:st.best>=3 && !und};
}
function provGrade(S){
  const r=S.history.filter(h=>h.level===10 && !h.practice).slice(-3); if(!r.length) return null;
  const avg=r.reduce((s,h)=>s+h.correct,0)/3;
  return avg>=9?'A':avg>=8?'B':avg>=7?'C':avg>=6?'D':avg>=5?'E':'F';
}
const isRusty = (S,w,now) => medalInfo(S,w).medal>=1 && now-(S.worldLast[w]||0) > RUST_DAYS*DAY;
const rustyWorlds = (S,now) => WORLDS.filter(w=>isRusty(S,w,now));
/* ---------- Black ---------- */
const BOSS_INSIGHTS=100;
function blackRequirements(S){
  const dia=WORLDS.filter(w=>medalInfo(S,w).medal===4).length;
  return [
    {id:'diamant', label:'Diamant i alla 9 världar', have:dia+' av 9', done:dia===9},
    {id:'prov', label:'Provberedskap A', have:provGrade(S)||'–', done:provGrade(S)==='A'},
    {id:'ins', label:BOSS_INSIGHTS+' Insikter intjänade', have:Math.min(S.insightsEarned,BOSS_INSIGHTS)+' av '+BOSS_INSIGHTS, done:S.insightsEarned>=BOSS_INSIGHTS},
    {id:'boss', label:'Besegra Slutbossen', have:S.black.beaten?'klar':'', done:!!S.black.beaten},
  ];
}
const bossReady = S => blackRequirements(S).slice(0,3).every(r=>r.done);
const blackStatus = (S,now) => !S.black.unlocked ? null : rustyWorlds(S,now).length ? 'grafit' : 'black';
function playerLevel(xp){ let l=1; while(xp>=150*l*l) l++; return {level:l, from:150*(l-1)*(l-1), to:150*l*l}; }

root.Core={Frac,F,Poly,parseNum,parseList,check,answerString,generate,makeRound,TYPES,LEVELS,typesFor,undTypesFor,levelInfo,timeFor,setRandom,sameVals,

/* ---------- Dagar i rad (räknas fram ur historiken) ---------- */
function dayStreak(now=Date.now()){
  const key=t=>{ const d=new Date(t); return d.getFullYear()*10000+d.getMonth()*100+d.getDate(); };
  const days=new Set(S.history.map(h=>key(h.date)));
  const d=new Date(now); if(!days.has(key(d))) d.setDate(d.getDate()-1);   // idag räknas inte bort förrän dagen är slut
  let n=0; while(days.has(key(d))){ n++; d.setDate(d.getDate()-1); }
  return {n, today:days.has(key(now))};
}
